<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">What a cue number plays</title>
  <desc id="desc">Every sound starts as one call with a cue number, and the number's range decides what it is. Cues below 80 are music, played on the music player; asking for the music already chosen does nothing. Cues from 80 to 99 are fanfares, played on the fanfare player while the music is silenced. Cues from 100 up are rows of the song table, mostly sound effects, each played on the player its row names. Three cues are controls instead of sounds: cue 17 fades the music out, cue 18 keeps the music that is playing, and cue 289 fades out player 3.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .mus { fill: #0a72ef; }
    .fan { fill: #f59e0b; }
    .se { fill: #737373; }
    .ctl { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .tick { stroke: #a3a3a3; stroke-width: 1; }
    .brk { fill: #fafafa; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .n { fill: #737373; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .mus { fill: #3b8eff; }
      .se { fill: #8f8f8f; }
      .ctl { fill: #111111; stroke: #ededed; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .tick { stroke: #5c5c5c; }
      .brk { fill: #0a0a0a; }
      .h { fill: #ededed; }
      .l, .p { fill: #a1a1a1; }
      .in { fill: #0a0a0a; }
      .n { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="34">ONE CALL, ONE NUMBER: THE CUE</text>
  <text class="code" x="380" y="34" text-anchor="end">AudioCommand_Play</text>

  <!-- The ruler: music 0..79 at 20..180, fanfare 80..99 at 180..240, song rows 100.. at 240..380 -->
  <rect class="mus" x="20" y="64" width="160" height="40" rx="6"/>
  <text class="in" x="100" y="89" text-anchor="middle">music</text>
  <rect class="fan" x="182" y="64" width="58" height="40" rx="6"/>
  <text class="in" x="211" y="89" text-anchor="middle">fanfare</text>
  <rect class="se" x="242" y="64" width="138" height="40" rx="6"/>
  <text class="in" x="311" y="89" text-anchor="middle">song table</text>
  <path class="tick" d="M 20 110 V 118 M 181 110 V 118 M 241 110 V 118"/>
  <text class="n" x="20" y="132">0</text>
  <text class="n" x="181" y="132" text-anchor="middle">80</text>
  <text class="n" x="241" y="132" text-anchor="middle">100</text>
  <text class="n" x="380" y="132" text-anchor="end">and up</text>

  <!-- What each range does -->
  <rect class="card" x="20" y="150" width="360" height="70" rx="10"/>
  <rect class="mus" x="32" y="164" width="12" height="12" rx="3"/>
  <text class="h" x="52" y="175">Music</text>
  <text class="l" x="32" y="200">On the music player. The music already</text>
  <text class="l" x="32" y="214">chosen is left alone, even if it has ended.</text>

  <rect class="card" x="20" y="228" width="360" height="56" rx="10"/>
  <rect class="fan" x="32" y="242" width="12" height="12" rx="3"/>
  <text class="h" x="52" y="253">Fanfare</text>
  <text class="l" x="32" y="275">On the fanfare player; the music is silenced.</text>

  <rect class="card" x="20" y="292" width="360" height="56" rx="10"/>
  <rect class="se" x="32" y="306" width="12" height="12" rx="3"/>
  <text class="h" x="52" y="317">Song table</text>
  <text class="l" x="32" y="339">Mostly sound effects, on the player each names.</text>

  <!-- Controls -->
  <text class="eyebrow" x="20" y="380">THREE NUMBERS ARE CONTROLS, NOT SOUNDS</text>
  <rect class="ctl" x="20" y="392" width="40" height="26" rx="13"/>
  <text class="n" x="40" y="409" text-anchor="middle">17</text>
  <text class="l" x="70" y="409">fade the music out</text>
  <rect class="ctl" x="20" y="426" width="40" height="26" rx="13"/>
  <text class="n" x="40" y="443" text-anchor="middle">18</text>
  <text class="l" x="70" y="443">keep the music that is playing</text>
  <rect class="ctl" x="20" y="460" width="40" height="26" rx="13"/>
  <text class="n" x="40" y="477" text-anchor="middle">289</text>
  <text class="l" x="70" y="477">fade out player 3</text>
  <text class="code" x="380" y="504" text-anchor="end">AUDIO_JINGLE_FIRST · AUDIO_SONG_FIRST</text>
</svg>
