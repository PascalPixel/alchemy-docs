<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">Eight players, each with its own job</title>
  <desc id="desc">The sound driver's eight players, each able to play one song at a time. Player 0 plays fanfares, such as the one for finding treasure, with four tracks. Player 1 plays the music, with ten tracks. Player 2 plays the menus' sounds: confirm, cancel, error and buying. Player 3 plays the sounds of actions in the field and in battle: casting, impacts, doors opening. Players 4 to 7 share the other sound effects: most take the first free player counting down from 7, and when none is free it cuts off whatever player 7 was playing. Because each kind has its own players, a sound effect never stops the music.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .pl { fill: #f5f5f5; stroke: #d4d4d4; }
    .fan { fill: #f59e0b; }
    .mus { fill: #0a72ef; }
    .ui { fill: #7c3aed; }
    .act { fill: #16a34a; }
    .fx { fill: #737373; }
    .num { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .pl { fill: #1a1a1a; stroke: #333333; }
      .fan { fill: #f59e0b; }
      .mus { fill: #3b8eff; }
      .ui { fill: #a78bfa; }
      .act { fill: #22c55e; }
      .fx { fill: #8f8f8f; }
      .num { fill: #0a0a0a; }
      .h { fill: #ededed; }
      .l, .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="559" rx="16"/>
  <text class="eyebrow" x="20" y="34">EIGHT PLAYERS</text>
  <text class="code" x="380" y="34" text-anchor="end">gSound_PlayerSlots</text>

  <!-- Player 0 -->
  <rect class="card" x="20" y="48" width="360" height="62" rx="10"/>
  <rect class="fan" x="32" y="60" width="38" height="38" rx="8"/>
  <text class="num" x="51" y="84" text-anchor="middle">0</text>
  <text class="h" x="84" y="74">Fanfares</text>
  <text class="l" x="84" y="94">treasure found, a puzzle solved</text>

  <!-- Player 1 -->
  <rect class="card" x="20" y="118" width="360" height="62" rx="10"/>
  <rect class="mus" x="32" y="130" width="38" height="38" rx="8"/>
  <text class="num" x="51" y="154" text-anchor="middle">1</text>
  <text class="h" x="84" y="144">Music</text>
  <text class="l" x="84" y="164">a town's theme, a battle's, a dungeon's</text>

  <!-- Player 2 -->
  <rect class="card" x="20" y="188" width="360" height="62" rx="10"/>
  <rect class="ui" x="32" y="200" width="38" height="38" rx="8"/>
  <text class="num" x="51" y="224" text-anchor="middle">2</text>
  <text class="h" x="84" y="214">Menu sounds</text>
  <text class="l" x="84" y="234">confirm, cancel, error, buying</text>

  <!-- Player 3 -->
  <rect class="card" x="20" y="258" width="360" height="62" rx="10"/>
  <rect class="act" x="32" y="270" width="38" height="38" rx="8"/>
  <text class="num" x="51" y="294" text-anchor="middle">3</text>
  <text class="h" x="84" y="284">Actions</text>
  <text class="l" x="84" y="304">casting, impacts, a door opening</text>

  <!-- Players 4 to 7 -->
  <rect class="card" x="20" y="328" width="360" height="128" rx="10"/>
  <rect class="fx" x="32" y="340" width="38" height="38" rx="8"/>
  <text class="num" x="51" y="364" text-anchor="middle">7</text>
  <rect class="fx" x="76" y="340" width="38" height="38" rx="8"/>
  <text class="num" x="95" y="364" text-anchor="middle">6</text>
  <rect class="fx" x="120" y="340" width="38" height="38" rx="8"/>
  <text class="num" x="139" y="364" text-anchor="middle">5</text>
  <rect class="fx" x="164" y="340" width="38" height="38" rx="8"/>
  <text class="num" x="183" y="364" text-anchor="middle">4</text>
  <path class="wire" d="M 32 390 H 196"/>
  <path class="head" d="M 194 385 l 9 5 l -9 5 z"/>
  <text class="h" x="216" y="364">Other sound</text>
  <text class="h" x="216" y="382">effects</text>
  <text class="l" x="32" y="414">Most take the first free player from 7 down;</text>
  <text class="l" x="32" y="432">with none free, it cuts off player 7's sound.</text>

  <text class="p" x="20" y="490">Each kind has players of its own, so a sound</text>
  <text class="p" x="20" y="509">effect never stops the music, and a fanfare</text>
  <text class="p" x="20" y="528">only silences it for a while.</text>
</svg>
