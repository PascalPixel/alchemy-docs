<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">A flag is one bit</title>
  <desc id="desc">The game flags are 4,096 bits kept in 512 bytes. A flag's number divided by 8 says which byte holds it, and the remainder says which bit. Flag 48 is bit 0 of byte 6, and it is set once the party has found Flint, the first Venus Djinni; flags 48 to 55 share that byte, and Fizz, the first Mercury Djinni, is flag 68, twenty further on. Because eight flags in a row make one byte and four make a nibble, some bytes hold small numbers instead of yes-or-no answers: the Battle Arena's win count is one whole byte.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="469" rx="16"/>
  <text class="eyebrow" x="20" y="30">4,096 FLAGS IN 512 BYTES</text>

  <rect class="card-accent" x="20" y="44" width="360" height="78" rx="12"/>
  <circle class="dot" cx="43" cy="70" r="5"/>
  <text class="h" x="56" y="75">Flag 48: Flint found</text>
  <text class="p" x="36" y="102">48 ÷ 8 = byte 6, remainder bit 0</text>

  <!-- byte 6 -->
  <text class="h" x="20" y="158">Byte 6</text>
  <text class="sub" x="380" y="158" text-anchor="end">flags 48 to 55</text>
  <rect class="bar" x="20" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="66" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="112" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="158" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="204" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="250" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="296" y="170" width="40" height="40" rx="6"/>
  <rect class="bar-muted" x="342" y="170" width="38" height="40" rx="6"/>
  <text class="small" x="40" y="228" text-anchor="middle">bit 0</text>
  <text class="small" x="86" y="228" text-anchor="middle">1</text>
  <text class="small" x="132" y="228" text-anchor="middle">2</text>
  <text class="small" x="178" y="228" text-anchor="middle">3</text>
  <text class="small" x="224" y="228" text-anchor="middle">4</text>
  <text class="small" x="270" y="228" text-anchor="middle">5</text>
  <text class="small" x="316" y="228" text-anchor="middle">6</text>
  <text class="small" x="361" y="228" text-anchor="middle">7</text>
  <text class="k" x="20" y="250">Flint</text>
  <text class="sub" x="66" y="250">Granite, and the Venus Djinn after it</text>

  <!-- the Djinn -->
  <rect class="card" x="20" y="272" width="360" height="78" rx="12"/>
  <text class="h" x="36" y="298">All 80 Djinn: flags 48 to 127</text>
  <text class="p" x="36" y="322">20 to an element, in order:</text>
  <text class="p" x="36" y="340">Fizz, the first Mercury Djinni, is 68.</text>

  <!-- counters -->
  <rect class="card-exit" x="20" y="362" width="360" height="90" rx="12"/>
  <text class="h" x="36" y="388">A byte can be a number</text>
  <text class="p" x="36" y="412">Eight flags in a row are one byte, so</text>
  <text class="p" x="36" y="431">the Battle Arena's wins live there.</text>
</svg>
