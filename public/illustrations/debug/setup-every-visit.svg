<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 540" role="img" aria-labelledby="title desc">
  <title id="title">What each visit to the menu test room does</title>
  <desc id="desc">The menu test room's setup runs every time the party walks in, in the English edition. Before the first visit, in Vale, the party is Isaac and Garet at level 1, and the shops' counters for their rare items are all 0. After the first visit, Isaac is level 50 and Garet, Ivan and Mia level 30, and the counters read 3 Shamshirs, 2 Silver Blades and 1 of each of the nine other rare items. After a second visit the levels are unchanged, since a level is only ever raised to its target, but every counter has gone up again: 6 Shamshirs, 4 Silver Blades and 2 of each of the others.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .colhead { fill: #f5f5f5; }
    .same { fill: #0a0a0a; font: 500 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .up { fill: #15803d; font: 700 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .zero { fill: #a3a3a3; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ch { fill: #0a0a0a; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .rule { stroke: #f0f0f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .colhead { fill: #1a1a1a; }
      .same, .h, .ch { fill: #ededed; }
      .up { fill: #4ade80; }
      .zero { fill: #5c5c5c; }
      .l, .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .rule { stroke: #1f1f1f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="539" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE MENU TEST ROOM, IN ENGLISH</text>

  <!-- Column heads: values centred at 196, 264, 340 -->
  <rect class="colhead" x="160" y="48" width="72" height="40" rx="8"/>
  <text class="ch" x="196" y="65" text-anchor="middle">before,</text>
  <text class="ch" x="196" y="80" text-anchor="middle">in Vale</text>
  <rect class="colhead" x="236" y="48" width="64" height="40" rx="8"/>
  <text class="ch" x="268" y="65" text-anchor="middle">first</text>
  <text class="ch" x="268" y="80" text-anchor="middle">visit</text>
  <rect class="colhead" x="304" y="48" width="76" height="40" rx="8"/>
  <text class="ch" x="342" y="65" text-anchor="middle">second</text>
  <text class="ch" x="342" y="80" text-anchor="middle">visit</text>

  <!-- Levels -->
  <rect class="card" x="20" y="98" width="360" height="148" rx="12"/>
  <text class="h" x="36" y="122">Levels</text>
  <text class="l" x="36" y="148">Isaac</text>
  <text class="same" x="196" y="148" text-anchor="middle">1</text>
  <text class="up" x="268" y="148" text-anchor="middle">50</text>
  <text class="same" x="342" y="148" text-anchor="middle">50</text>
  <path class="rule" d="M 36 156 H 364"/>
  <text class="l" x="36" y="174">Garet</text>
  <text class="same" x="196" y="174" text-anchor="middle">1</text>
  <text class="up" x="268" y="174" text-anchor="middle">30</text>
  <text class="same" x="342" y="174" text-anchor="middle">30</text>
  <path class="rule" d="M 36 182 H 364"/>
  <text class="l" x="36" y="200">Ivan</text>
  <text class="zero" x="196" y="200" text-anchor="middle">not yet</text>
  <text class="up" x="268" y="200" text-anchor="middle">30</text>
  <text class="same" x="342" y="200" text-anchor="middle">30</text>
  <path class="rule" d="M 36 208 H 364"/>
  <text class="l" x="36" y="226">Mia</text>
  <text class="zero" x="196" y="226" text-anchor="middle">not yet</text>
  <text class="up" x="268" y="226" text-anchor="middle">30</text>
  <text class="same" x="342" y="226" text-anchor="middle">30</text>

  <!-- Counters -->
  <rect class="card" x="20" y="256" width="360" height="130" rx="12"/>
  <text class="h" x="36" y="280">Rare items the shops may sell</text>
  <text class="l" x="36" y="306">Shamshir</text>
  <text class="zero" x="196" y="306" text-anchor="middle">0</text>
  <text class="up" x="268" y="306" text-anchor="middle">3</text>
  <text class="up" x="342" y="306" text-anchor="middle">6</text>
  <path class="rule" d="M 36 314 H 364"/>
  <text class="l" x="36" y="332">Silver Blade</text>
  <text class="zero" x="196" y="332" text-anchor="middle">0</text>
  <text class="up" x="268" y="332" text-anchor="middle">2</text>
  <text class="up" x="342" y="332" text-anchor="middle">4</text>
  <path class="rule" d="M 36 340 H 364"/>
  <text class="l" x="36" y="358">each of the</text>
  <text class="l" x="36" y="374">nine others</text>
  <text class="zero" x="196" y="366" text-anchor="middle">0</text>
  <text class="up" x="268" y="366" text-anchor="middle">1</text>
  <text class="up" x="342" y="366" text-anchor="middle">2</text>

  <text class="small" x="20" y="408">green: changed by that visit</text>

  <text class="p" x="20" y="446">The setup runs on every visit. A level is only</text>
  <text class="p" x="20" y="465">ever raised to its target, so a second visit</text>
  <text class="p" x="20" y="484">leaves the levels alone, but the shops' stock</text>
  <text class="p" x="20" y="503">goes up again each time.</text>
  <text class="code" x="380" y="526" text-anchor="end">CommandTable_ConfigureCommandList</text>
</svg>
