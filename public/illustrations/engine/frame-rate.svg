<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 552" role="img" aria-labelledby="title desc">
  <title id="title">Sixty pictures a second</title>
  <desc id="desc">The console redraws its screen about sixty times a second, each picture a frame. It draws a picture line by line, from the top of the screen to the bottom, 160 lines. After the last line comes a pause about as long as 68 more lines, the vertical blank, when nothing is drawn. Then the next picture starts at the top. Changing the picture while it is being drawn would show half the change, so the game does its work during the frame and hands the finished picture to the hardware in the blank. On a timeline, each frame is a long stretch of drawing followed by a short blank, over and over.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .screen-bg { fill: #ffffff; }
    .screen { stroke: #0a0a0a; stroke-width: 2; }
    .done { fill: #0a72ef; fill-opacity: 0.18; }
    .line { stroke: #0a72ef; stroke-width: 2.5; }
    .scan { stroke: #0a72ef; stroke-width: 1; stroke-opacity: 0.35; }
    .blank { fill: #f59e0b; fill-opacity: 0.18; stroke: #f59e0b; stroke-dasharray: 4 3; }
    .draw { fill: #0a72ef; }
    .bl { fill: #f59e0b; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #b45309; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .screen-bg { fill: #111111; }
      .screen { stroke: #ededed; }
      .done { fill: #3b8eff; fill-opacity: 0.22; }
      .line { stroke: #3b8eff; }
      .scan { stroke: #3b8eff; }
      .draw { fill: #3b8eff; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .h { fill: #ededed; }
      .p, .l { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .kb { fill: #fbbf24; }
      .in { fill: #0a0a0a; }
      .small, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="551" rx="16"/>
  <text class="eyebrow" x="20" y="34">ONE FRAME ON THE SCREEN</text>

  <!-- The screen, 240 by 160 at 0.75: 180 by 120, at x 20, y 52 -->
  <rect class="screen-bg" x="20" y="52" width="180" height="120"/>
  <rect class="done" x="20" y="52" width="180" height="78"/>
  <path class="scan" d="M 20 60 H 200 M 20 68 H 200 M 20 76 H 200 M 20 84 H 200 M 20 92 H 200 M 20 100 H 200 M 20 108 H 200 M 20 116 H 200 M 20 124 H 200"/>
  <path class="line" d="M 20 130 H 200"/>
  <rect class="screen" x="20" y="52" width="180" height="120" fill="none"/>
  <rect class="blank" x="20" y="176" width="180" height="51"/>

  <text class="k" x="214" y="70">Drawing</text>
  <text class="l" x="214" y="88">line by line, top to</text>
  <text class="l" x="214" y="104">bottom: 160 lines</text>
  <path class="wire" d="M 206 130 H 214"/>
  <text class="small" x="218" y="134">the line being drawn</text>
  <text class="kb" x="214" y="196">The blank</text>
  <text class="l" x="214" y="214">about 68 lines' time,</text>
  <text class="l" x="214" y="230">nothing is drawn</text>

  <!-- Why -->
  <text class="h" x="20" y="276">Why the game waits for the blank</text>
  <text class="p" x="20" y="300">A change made while the picture is being</text>
  <text class="p" x="20" y="319">drawn would show on only part of it. So the</text>
  <text class="p" x="20" y="338">game works out the next picture during the</text>
  <text class="p" x="20" y="357">frame and hands it over in the blank.</text>

  <!-- Timeline: three frames -->
  <text class="eyebrow" x="20" y="404">ABOUT SIXTY FRAMES A SECOND</text>
  <rect class="draw" x="20" y="416" width="86" height="30" rx="4"/>
  <text class="in" x="63" y="435" text-anchor="middle">drawing</text>
  <rect class="bl" x="107" y="416" width="34" height="30" rx="4"/>
  <rect class="draw" x="143" y="416" width="86" height="30" rx="4"/>
  <text class="in" x="186" y="435" text-anchor="middle">drawing</text>
  <rect class="bl" x="230" y="416" width="34" height="30" rx="4"/>
  <rect class="draw" x="266" y="416" width="86" height="30" rx="4"/>
  <text class="in" x="309" y="435" text-anchor="middle">drawing</text>
  <rect class="bl" x="353" y="416" width="27" height="30" rx="4"/>
  <path class="wire" d="M 124 452 V 466"/>
  <text class="kb" x="124" y="484" text-anchor="middle">blank</text>
  <path class="wire" d="M 20 504 H 141"/>
  <path class="wire" d="M 20 498 V 510 M 141 498 V 510"/>
  <text class="small" x="80" y="526" text-anchor="middle">one frame</text>

</svg>
