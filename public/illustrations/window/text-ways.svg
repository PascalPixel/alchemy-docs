<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 540" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to put letters in a window</title>
  <desc id="desc">A window's frame and filling are always tiles of the window layer. Its letters go on in one of three ways. A message typed on the field puts each letter cell on as a sprite riding on the window, so the letters can bob and move. A battle message is drawn into one shared picture across the bottom of the screen, which only one window can use at a time. Text drawn all at once, such as menu labels and the area's name, becomes tiles of the window layer itself, taken from a set of 128. Each way is shown as the game draws it: the start of Garet's sister's line in Vale, "Ghost appeared!" at the start of a battle in Goma Cave, and the area name Bilibin.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .px { image-rendering: pixelated; }
    .edge { fill: none; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .frame { fill: none; stroke: #d4d4d4; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .pill-on { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .w2 { fill: none; stroke: #7c3aed; stroke-width: 2; }
    .f4 { fill: #db2777; }
    .t2 { fill: #7c3aed; fill-opacity: 0.10; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .edge { stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .frame { stroke: #333333; }
      .h2 { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .w2 { stroke: #a78bfa; }
      .f4 { fill: #be185d; }
      .t2 { fill-opacity: 0.18; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="539" rx="16"/>
  <text class="eyebrow" x="20" y="32">THE FRAME IS ALWAYS WINDOW TILES; THE LETTERS…</text>

  <!-- sprites -->
  <rect class="card" x="20" y="46" width="360" height="148" rx="12"/>
  <!-- From render guide: talk.gif frame 8 cut 88x26+82+10, at twice its size. -->
  <image href="data:image/png;base64," class="px" data-crop="crops/window/talk-cells.png" x="36" y="62" width="176" height="52"/>
  <text class="h2" x="228" y="94">…as sprites</text>
  <text class="small" x="36" y="138">one sprite a cell, riding on the window; they can move</text>
  <text class="p" x="36" y="158">Messages typed out on the field.</text>
  <text class="code" x="36" y="186">a render output a cell</text>

  <!-- canvas -->
  <rect class="card" x="20" y="206" width="360" height="148" rx="12"/>
  <!-- From render guide: random-battle.gif frame 180 cut 88x26+0+134, at twice its size. -->
  <image href="data:image/png;base64," class="px" data-crop="crops/window/battle-message.png" x="36" y="222" width="176" height="52"/>
  <text class="h2" x="228" y="254">…into one picture</text>
  <text class="small" x="36" y="298">painted letter by letter; one window at a time can use it</text>
  <text class="p" x="36" y="318">Battle messages, across the bottom rows.</text>
  <text class="code" x="36" y="346">the text canvas: 120 tiles</text>

  <!-- tiles -->
  <rect class="card" x="20" y="366" width="360" height="148" rx="12"/>
  <!-- From render guide: area-name-frame.png (the frame in area-name.svg) cut 88x26+76+23, at twice its size. -->
  <image href="data:image/png;base64," class="px" data-crop="crops/window/area-name-bilibin.png" x="36" y="382" width="176" height="52"/>
  <text class="h2" x="228" y="414">…as window tiles</text>
  <text class="small" x="36" y="458">drawn all at once into the window layer itself</text>
  <text class="p" x="36" y="478">Labels and names, such as the area's name.</text>
  <text class="code" x="36" y="506">128 tiles set aside for text</text>
</svg>
