<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">The ring that holds unpacked messages</title>
  <desc id="desc">Unpacked messages are written into a ring of 512 letter codes, 256 in the Japanese edition, one after another round the ring. Each ends with an end mark and is known only by where it starts. Nothing reserves a message's place: once writing comes round the ring again, the newest message runs on over the oldest. A message stays readable until then.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .dot-no { fill: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .big { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .wire-accent { stroke: #3b8eff; }
      .head-accent, .dot { fill: #3b8eff; }
      .dot-no { fill: #f05252; }
    }
  </style>
  <style>
    .track { fill: none; stroke: #ededed; stroke-width: 26; }
    .arc { fill: none; stroke-width: 22; stroke-linecap: butt; }
    .a-old { stroke: #f6c3b7; } .a-mid { stroke: #d4d4d4; } .a-last { stroke: #bcd7fb; } .a-new { stroke: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #1a1a1a; }
      .a-old { stroke: #5c2a1a; } .a-mid { stroke: #333333; } .a-last { stroke: #1e3a66; } .a-new { stroke: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="469" rx="16"/>
  <text class="eyebrow" x="20" y="32">UNPACKED MESSAGES, ROUND A RING</text>

  <circle class="track" cx="200" cy="196" r="110"/>
  <path class="arc a-old" d="M 203.8 86.1 A 110 110 0 0 1 309.9 192.2"/>
  <path class="arc a-mid" d="M 309.9 199.8 A 110 110 0 0 1 162.4 299.4"/>
  <path class="arc a-mid" d="M 155.3 296.5 A 110 110 0 0 1 98.0 154.8"/>
  <path class="arc a-last" d="M 101.1 147.8 A 110 110 0 0 1 158.8 94.0"/>
  <path class="arc a-new" d="M 166.0 91.4 A 110 110 0 0 1 196.2 86.1"/>
  <!-- where the next code goes -->
  <path class="wire-accent" d="M 196 62 C 214 54 232 60 244 72"/>
  <path class="head-accent" d="M 240 66 l 9 9 l -11 1 z"/>

  <text class="big" x="200" y="192" text-anchor="middle">512 codes</text>
  <text class="small" x="200" y="214" text-anchor="middle">256 in Japanese</text>

  <!-- labels -->
  <text class="kx" x="380" y="56" text-anchor="end">the oldest</text>
  <text class="small" x="380" y="72" text-anchor="end">written over next</text>
  <text class="label" x="300" y="306">earlier</text>
  <text class="label" x="300" y="322">messages</text>
  <text class="k" x="22" y="104">the last one</text>
  <text class="small" x="22" y="120">ready to type</text>
  <text class="k" x="120" y="54" text-anchor="end">being written</text>

  <!-- the rule -->
  <circle class="dot" cx="26" cy="364" r="4"/>
  <text class="p" x="38" y="369">One message after another; each ends with</text>
  <text class="p" x="38" y="387">an end mark and is found by where it starts.</text>
  <circle class="dot-no" cx="26" cy="412" r="4"/>
  <text class="p" x="38" y="417">Nothing is reserved: coming round again,</text>
  <text class="p" x="38" y="435">new text runs over the oldest.</text>
  <text class="code" x="380" y="458" text-anchor="end">work-&gt;entries</text>
</svg>
