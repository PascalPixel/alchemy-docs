<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">A message is unpacked before it is typed</title>
  <desc id="desc">Garet's sister's message as the cartridge stores it and as it is ready to type. Stored, it is squeezed: each letter is a short run of bits, and the code for a letter depends on the letter before it, so common pairs are cheap. It also holds a blank for a party member's name and marks for a new line, a new page and the end. Before any of it is typed, the whole message is unpacked in one go: the letters come out, Garet's name is written into the blank, and the marks stay as they are. The window then only has to type what is there.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .type { fill: #0a0a0a; font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head-accent { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .type { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .k { fill: #66a6ff; }
      .wire-accent { stroke: #3b8eff; }
      .head-accent { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>

  <!-- stored -->
  <text class="eyebrow" x="20" y="32">IN THE CARTRIDGE</text>
  <rect class="card" x="20" y="44" width="360" height="150" rx="12"/>
  <g class="chip-wait">
    <rect x="36" y="60" width="22" height="14" rx="3"/><rect x="61" y="60" width="12" height="14" rx="3"/><rect x="76" y="60" width="9" height="14" rx="3"/><rect x="88" y="60" width="16" height="14" rx="3"/><rect x="107" y="60" width="28" height="14" rx="3"/><rect x="138" y="60" width="9" height="14" rx="3"/><rect x="150" y="60" width="12" height="14" rx="3"/><rect x="165" y="60" width="18" height="14" rx="3"/><rect x="186" y="60" width="9" height="14" rx="3"/><rect x="198" y="60" width="24" height="14" rx="3"/><rect x="225" y="60" width="12" height="14" rx="3"/><rect x="240" y="60" width="9" height="14" rx="3"/><rect x="252" y="60" width="16" height="14" rx="3"/>
  </g>
  <text class="small" x="276" y="72">one code a letter</text>
  <text class="p" x="36" y="100">Squeezed: each letter is a few bits, and</text>
  <text class="p" x="36" y="119">how it is coded depends on the letter</text>
  <text class="p" x="36" y="138">before it, so common pairs cost little.</text>
  <text class="small" x="36" y="164">With a blank for a name, and marks for a</text>
  <text class="small" x="36" y="180">new line, a new page and the end.</text>

  <!-- unpack -->
  <path class="wire-accent" d="M 200 194 V 236"/>
  <path class="head-accent" d="M 194 232 h 12 l -6 9 z"/>
  <text class="k" x="214" y="214">unpacked whole,</text>
  <text class="k" x="214" y="230">before any typing</text>

  <!-- ready -->
  <text class="eyebrow" x="20" y="268">READY TO TYPE</text>
  <rect class="card-accent" x="20" y="280" width="360" height="176" rx="12"/>
  <text class="type" x="36" y="310">You guys are so lucky,</text>
  <rect class="chip-wait" x="248" y="295" width="40" height="20" rx="4"/>
  <text class="kw" x="268" y="310" text-anchor="middle">↵</text>
  <rect class="chip" x="34" y="322" width="56" height="24" rx="4"/>
  <text class="type" x="62" y="340" text-anchor="middle">Garet</text>
  <text class="type" x="92" y="340">.</text>
  <rect class="chip-wait" x="108" y="325" width="56" height="20" rx="4"/>
  <text class="kw" x="136" y="340" text-anchor="middle">page</text>
  <text class="type" x="36" y="374">I wish I could</text>
  <rect class="chip-wait" x="174" y="359" width="40" height="20" rx="4"/>
  <text class="kw" x="194" y="374" text-anchor="middle">↵</text>
  <text class="type" x="36" y="404">go with you.</text>
  <rect class="chip-wait" x="156" y="389" width="56" height="20" rx="4"/>
  <text class="kw" x="184" y="404" text-anchor="middle">end</text>
  <text class="k" x="36" y="440">Garet's name written into the blank</text>

  <text class="p" x="20" y="484">The window then only has to type it.</text>
  <text class="code" x="380" y="508" text-anchor="end">UiText_BuildRenderEntries</text>
</svg>
