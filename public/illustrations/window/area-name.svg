<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 460" role="img" aria-labelledby="title desc">
  <title id="title">The area's name on arrival</title>
  <desc id="desc">The party arriving in Bilibin: a small window with the town's name appears at once, centred across the screen and in its top half, with no zoom. It stays for 90 frames, a second and a half, counting down by one each frame, and closes when the count reaches zero. The name comes from the table of area names.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .fill-soft { fill: #f5f5f5; }
    .fill-accent { fill: #0a72ef; }
    .frame { fill: none; stroke: #d4d4d4; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .pill { fill: #ffffff; fill-opacity: 0.94; }
    .pill-text { fill: #0a0a0a; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .w3 { fill: none; stroke: #0a72ef; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .fill-soft { fill: #1a1a1a; }
      .fill-accent { fill: #3b8eff; }
      .frame { stroke: #333333; }
      .h2 { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .w3 { stroke: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="459" rx="16"/>
  <text class="eyebrow" x="20" y="28">ARRIVING IN BILIBIN</text>

  <image href="data:image/png;base64," x="20" y="40" width="360" height="240" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="40" width="360" height="240"/>
  <!-- the top half, where the window is centred -->
  <path class="w3" d="M 22 42 H 378 V 160 H 22 Z" stroke-dasharray="5 4" stroke-width="1.5"/>
  <rect class="pill" x="250" y="132" width="122" height="22" rx="11"/>
  <text class="pill-text" x="311" y="147" text-anchor="middle">centred up here</text>

  <!-- the countdown -->
  <text class="h2" x="20" y="316">On screen at once, for 90 frames</text>
  <rect class="fill-soft" x="20" y="330" width="360" height="14" rx="7"/>
  <rect class="fill-accent" x="20" y="330" width="216" height="14" rx="7"/>
  <text class="small" x="20" y="364">90</text>
  <text class="small" x="200" y="364" text-anchor="middle">one less each frame</text>
  <text class="small" x="380" y="364" text-anchor="end">0: it closes</text>
  <text class="p" x="20" y="400">A second and a half, then gone. The name</text>
  <text class="p" x="20" y="419">comes from the table of area names.</text>
  <text class="code" x="380" y="446" text-anchor="end">UiTimedNotice_Create</text>
</svg>
