<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">A build is judged by its fingerprint</title>
  <desc id="desc">The build never sees the original cartridge, only its fingerprint: a SHA-1 hash, 40 characters long, recorded in rom.sha1. Each built edition is hashed the same way. When the English build of The Broken Seal comes out byte for byte the same as the cartridge, its fingerprint is identical, starting 5c4695205413, and the edition prints OK. Changing a single bit anywhere in its 8 MB, as a test, gives a completely different fingerprint, starting c214a5f65e8b. The fingerprint says whether the build is exact, never where it differs.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .card-no { fill: #fff3f0; stroke: #f6c3b7; stroke-width: 1.5; }
    .rom { fill: #e5e5e5; }
    .flip { fill: #dc2626; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .hash { fill: #0a0a0a; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hash-no { fill: #b91c1c; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ok { fill: #15803d; font: 700 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .no { fill: #b91c1c; font: 700 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-ok { fill: #0f2a18; stroke: #22c55e; }
      .card-no { fill: #2a130c; stroke: #5c2a1a; }
      .rom { fill: #2a2a2a; }
      .flip { fill: #f05252; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .h, .hash { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .label { fill: #8f8f8f; }
      .hash-no, .no { fill: #f87171; }
      .ok { fill: #4ade80; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE ENGLISH BROKEN SEAL</text>
  <text class="code" x="380" y="34" text-anchor="end">rom.sha1</text>

  <!-- The record -->
  <rect class="card" x="20" y="48" width="360" height="76" rx="12"/>
  <text class="h" x="36" y="74">The original's fingerprint</text>
  <text class="hash" x="36" y="102">5c4695205413…</text>
  <text class="label" x="364" y="102" text-anchor="end">recorded, never the ROM</text>

  <!-- An exact build -->
  <text class="h" x="20" y="164">An exact build</text>
  <rect class="rom" x="20" y="176" width="200" height="22" rx="4"/>
  <text class="label" x="232" y="192">8 MB, all as shipped</text>
  <path class="wire" d="M 120 198 V 216"/>
  <path class="head" d="M 114 212 h 12 l -6 9 z"/>
  <rect class="card-ok" x="20" y="224" width="360" height="44" rx="10"/>
  <text class="hash" x="36" y="251">5c4695205413…</text>
  <text class="ok" x="364" y="251" text-anchor="end">same: OK</text>

  <!-- One bit off -->
  <text class="h" x="20" y="312">One bit changed</text>
  <rect class="rom" x="20" y="324" width="200" height="22" rx="4"/>
  <rect class="flip" x="83" y="321" width="3" height="28"/>
  <text class="label" x="232" y="340">one bit of 8 MB flipped</text>
  <path class="wire" d="M 120 346 V 364"/>
  <path class="head" d="M 114 360 h 12 l -6 9 z"/>
  <rect class="card-no" x="20" y="372" width="360" height="44" rx="10"/>
  <text class="hash-no" x="36" y="399">c214a5f65e8b…</text>
  <text class="no" x="364" y="399" text-anchor="end">different: fails</text>

  <text class="p" x="20" y="458">The fingerprint says whether a build is exact,</text>
  <text class="p" x="20" y="477">never where it differs. Finding the place takes</text>
  <text class="p" x="20" y="496">comparing the compiler's output.</text>
</svg>
