<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">Matching a function, step by step</title>
  <desc id="desc">How a function is matched. Write it in plain C. Build all twelve editions and compare each one's fingerprint with the one recorded for the original cartridge. If all twelve match, the C is the original game, byte for byte, and it is kept. If one does not, find the instructions that differ, by comparing the compiler's output with the original, and reshape the C: another plain way of writing the same thing, or an equivalent spelling. Then build and compare again. Only when no plain form matches is a steering device kept, tagged FAKEMATCH with how far the plain form is from matching.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .card-dash { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ok { fill: #15803d; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .no { fill: #c2410c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .wire-ok { fill: none; stroke: #16a34a; stroke-width: 1.5; }
    .head-ok { fill: #16a34a; }
    .wire-no { fill: none; stroke: #c2410c; stroke-width: 1.5; }
    .head-no { fill: #c2410c; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head-accent { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-ok { fill: #0f2a18; stroke: #22c55e; }
      .card-dash { fill: #0a0a0a; stroke: #525252; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .label { fill: #8f8f8f; }
      .ok { fill: #4ade80; }
      .no { fill: #fb8b5e; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .wire-ok { stroke: #22c55e; }
      .head-ok { fill: #22c55e; }
      .wire-no { stroke: #fb8b5e; }
      .head-no { fill: #fb8b5e; }
      .wire-accent { stroke: #3b8eff; }
      .head-accent { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="639" rx="16"/>
  <text class="eyebrow" x="60" y="34">MATCHING ONE FUNCTION</text>

  <!-- Write -->
  <rect class="card" x="60" y="48" width="320" height="70" rx="12"/>
  <text class="h" x="80" y="76">Write it in plain C</text>
  <text class="p" x="80" y="100">the way a person would</text>

  <path class="wire" d="M 220 118 V 134"/>
  <path class="head" d="M 214 130 h 12 l -6 9 z"/>

  <!-- Compare -->
  <rect class="card-accent" x="60" y="142" width="320" height="92" rx="12"/>
  <text class="h" x="80" y="170">Build and compare</text>
  <text class="p" x="80" y="194">Each edition's fingerprint against</text>
  <text class="p" x="80" y="213">the original cartridge's.</text>
  <text class="code" x="364" y="226" text-anchor="end">make compare-editions</text>

  <!-- All OK -->
  <path class="wire-ok" d="M 140 234 V 262"/>
  <path class="head-ok" d="M 134 258 h 12 l -6 9 z"/>
  <text class="ok" x="150" y="254">all twelve OK</text>
  <rect class="card-ok" x="60" y="270" width="140" height="70" rx="12"/>
  <text class="h" x="76" y="298">Matched</text>
  <text class="p" x="76" y="320">keep it</text>

  <!-- One fails -->
  <path class="wire-no" d="M 300 234 V 262"/>
  <path class="head-no" d="M 294 258 h 12 l -6 9 z"/>
  <text class="no" x="312" y="254">one fails</text>
  <rect class="card" x="216" y="270" width="164" height="94" rx="12"/>
  <text class="h" x="232" y="298">Find the</text>
  <text class="h" x="232" y="317">difference</text>
  <text class="label" x="232" y="340">the compiler's output</text>
  <text class="label" x="232" y="356">against the original</text>

  <path class="wire" d="M 298 364 V 390"/>
  <path class="head" d="M 292 386 h 12 l -6 9 z"/>

  <!-- Reshape -->
  <rect class="card" x="60" y="398" width="320" height="92" rx="12"/>
  <text class="h" x="80" y="426">Reshape the C</text>
  <text class="p" x="80" y="450">Another plain way of saying the</text>
  <text class="p" x="80" y="469">same thing, or another spelling.</text>

  <!-- Back to compare -->
  <path class="wire-accent" d="M 60 444 H 30 V 188 H 54"/>
  <path class="head-accent" d="M 51 182 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 316) rotate(-90)" text-anchor="middle">try again</text>

  <!-- Last resort -->
  <path class="wire" d="M 220 490 V 516"/>
  <path class="head" d="M 214 512 h 12 l -6 9 z"/>
  <text class="label" x="232" y="508">if nothing plain matches</text>
  <rect class="card-dash" x="60" y="524" width="320" height="92" rx="12"/>
  <text class="h" x="80" y="552">Keep a device, tagged</text>
  <text class="p" x="80" y="576">It says how far the plain form is</text>
  <text class="p" x="80" y="595">from matching, for whoever comes next.</text>
  <text class="code" x="364" y="552" text-anchor="end">FAKEMATCH</text>
</svg>
