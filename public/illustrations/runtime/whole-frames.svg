<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 700" role="img" aria-labelledby="title desc">
  <title id="title">Why changes wait for the blank</title>
  <desc id="desc">Three timelines of Isaac taking a step right in Vale. On time: the frame's work ends before the vertical blank, and at the blank he appears in his new place, whole. Late: the work is still running when the blank comes, so nothing is sent and the screen keeps the old picture, whole; the new one appears at the next blank. Had the work written to the hardware directly, the screen could be drawn while he was half moved, his head in the new place and his legs in the old.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .axis { stroke: #d4d4d4; stroke-width: 1.5; }
    .blank { fill: #0a72ef; fill-opacity: 0.12; }
    .work { fill: #0a72ef; }
    .late { fill: #c2410c; }
    .screen { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .px { image-rendering: pixelated; }
    .tear { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 4 3; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.2; stroke-dasharray: 2 3; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bl { fill: #0a72ef; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ok { fill: #15803d; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .no { fill: #b91c1c; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .axis { stroke: #333333; }
      .blank { fill: #3b8eff; fill-opacity: 0.2; }
      .work { fill: #3b8eff; }
      .late { fill: #fb8b5e; }
      .screen { stroke: #525252; }
      .tear { stroke: #f05252; }
      .wire { stroke: #5c5c5c; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small { fill: #8f8f8f; }
      .bl { fill: #66a6ff; }
      .ok { fill: #4ade80; }
      .no { fill: #f87171; }
      .in { fill: #0a0a0a; }
      .eyebrow, .code { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="699" rx="16"/>
  <text class="eyebrow" x="20" y="34">ISAAC TAKES A STEP RIGHT</text>

  <!-- The screens: render guide moment in Vale (MOMENT_PLACE 4,1), Isaac
       stood facing east at x 370 and then at x 386 with the camera where
       it was, each frame cropped 64x44+108+60 and drawn at twice its size.
       The torn picture is a made-up one: the new frame's top 24 lines over
       the old frame's rest, what the screen could show without the wait. -->

  <!-- Blanks centred at x 184 and 326, through the first two rows -->
  <rect class="blank" x="176" y="50" width="16" height="350"/>
  <rect class="blank" x="318" y="50" width="16" height="350"/>
  <text class="bl" x="184" y="64" text-anchor="middle">blank</text>
  <text class="bl" x="326" y="64" text-anchor="middle">blank</text>

  <!-- Row 1: on time -->
  <text class="h" x="20" y="96">On time</text>
  <path class="axis" d="M 20 116 H 380"/>
  <rect class="work" x="20" y="104" width="136" height="24" rx="6"/>
  <text class="in" x="88" y="120" text-anchor="middle">the frame's work</text>
  <path class="wire" d="M 184 128 V 140"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/runtime/step-new.png" x="120" y="142" width="128" height="88"/>
  <rect class="screen" x="120" y="142" width="128" height="88"/>
  <text class="ok" x="258" y="180">new picture,</text>
  <text class="ok" x="258" y="195">whole</text>

  <!-- Row 2: late -->
  <text class="h" x="20" y="262">Late</text>
  <path class="axis" d="M 20 282 H 380"/>
  <rect class="late" x="20" y="270" width="230" height="24" rx="6"/>
  <text class="in" x="135" y="286" text-anchor="middle">the frame's work, too long</text>
  <path class="wire" d="M 184 294 V 306 M 326 294 V 306"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/runtime/step-old.png" x="120" y="308" width="128" height="88"/>
  <rect class="screen" x="120" y="308" width="128" height="88"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/runtime/step-new.png" x="262" y="308" width="128" height="88"/>
  <rect class="screen" x="262" y="308" width="128" height="88"/>
  <text class="small" x="184" y="414" text-anchor="middle">old picture, whole</text>
  <text class="ok" x="326" y="414" text-anchor="middle">new, whole</text>

  <!-- Row 3: written straight to the hardware -->
  <text class="h" x="20" y="460">Without the wait</text>
  <text class="small" x="20" y="478">changes written straight to the screen</text>
  <image href="data:image/png;base64," class="px" data-crop="crops/runtime/step-torn.png" x="120" y="492" width="128" height="88"/>
  <rect class="screen" x="120" y="492" width="128" height="88"/>
  <path class="tear" d="M 114 540 H 254"/>
  <text class="no" x="264" y="532">half old,</text>
  <text class="no" x="264" y="547">half new</text>

  <text class="p" x="20" y="620">So the game keeps its changes in RAM and</text>
  <text class="p" x="20" y="639">sends them in the blank, only for a frame</text>
  <text class="p" x="20" y="658">whose work has finished.</text>
  <text class="code" x="380" y="686" text-anchor="end">gFrameRenderPending</text>
</svg>
