<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">What happens in one frame</title>
  <desc id="desc">One frame, in order. First the frame's work: the waiting code and the main-loop tasks change things in RAM. Then the frame's sprites are gathered into one list. Then the CPU halts until the screen has drawn its last line. In the vertical blank that follows, the VBlank handler copies the sprite list, the background scroll and the queued register writes to the hardware all at once, then runs the VBlank tasks, reads the buttons and mixes the next stretch of sound. Then the next frame begins.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .band { fill: #0a72ef; fill-opacity: 0.08; }
    .band-edge { stroke: #0a72ef; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .num { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .dot { fill: #a3a3a3; }
    .dot-accent { fill: #0a72ef; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head-accent { fill: #0a72ef; }
    .label { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .band { fill: #3b8eff; fill-opacity: 0.14; }
      .band-edge { stroke: #3b8eff; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .num { fill: #0a0a0a; }
      .dot { fill: #5c5c5c; }
      .dot-accent { fill: #3b8eff; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head-accent { fill: #3b8eff; }
      .label { fill: #66a6ff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="639" rx="16"/>
  <text class="eyebrow" x="60" y="34">ONE FRAME: ABOUT A SIXTIETH OF A SECOND</text>

  <!-- 1. The work -->
  <rect class="card" x="60" y="48" width="320" height="96" rx="12"/>
  <circle class="dot" cx="86" cy="72" r="10"/>
  <text class="num" x="86" y="76" text-anchor="middle">1</text>
  <text class="h" x="104" y="77">The frame's work</text>
  <text class="p" x="80" y="102">The waiting code and the tasks move</text>
  <text class="p" x="80" y="121">things, in copies kept in RAM.</text>
  <text class="code" x="80" y="137">SCHEDULER_KEY_MAIN_LOOP</text>

  <path class="wire" d="M 220 144 V 160"/>
  <path class="head" d="M 214 156 h 12 l -6 9 z"/>

  <!-- 2. The sprite list -->
  <rect class="card" x="60" y="168" width="320" height="78" rx="12"/>
  <circle class="dot" cx="86" cy="192" r="10"/>
  <text class="num" x="86" y="196" text-anchor="middle">2</text>
  <text class="h" x="104" y="197">The sprite list is built</text>
  <text class="p" x="80" y="222">Every sprite placed this frame, in one list.</text>
  <text class="code" x="80" y="239">Render_BuildOamList</text>

  <path class="wire" d="M 220 246 V 262"/>
  <path class="head" d="M 214 258 h 12 l -6 9 z"/>

  <!-- 3. Halt -->
  <rect class="card" x="60" y="270" width="320" height="96" rx="12"/>
  <circle class="dot" cx="86" cy="294" r="10"/>
  <text class="num" x="86" y="298" text-anchor="middle">3</text>
  <text class="h" x="104" y="299">Wait for the blank</text>
  <text class="p" x="80" y="324">The CPU halts while the screen finishes</text>
  <text class="p" x="80" y="343">drawing its picture, line by line.</text>
  <text class="code" x="80" y="359">WaitFrames</text>

  <!-- The vertical blank -->
  <rect class="band" x="1" y="384" width="398" height="200"/>
  <path class="band-edge" d="M 1 384 H 399 M 1 584 H 399"/>
  <text class="k" x="60" y="404">THE VERTICAL BLANK</text>

  <path class="wire-accent" d="M 220 366 V 404"/>
  <path class="head-accent" d="M 214 400 h 12 l -6 9 z"/>

  <!-- 4. Commit -->
  <rect class="card-accent" x="60" y="412" width="320" height="96" rx="12"/>
  <circle class="dot-accent" cx="86" cy="436" r="10"/>
  <text class="num" x="86" y="440" text-anchor="middle">4</text>
  <text class="h" x="104" y="441">Everything lands at once</text>
  <text class="p" x="80" y="466">The sprites, the scroll and the queued</text>
  <text class="p" x="80" y="485">register writes go to the hardware.</text>
  <text class="code" x="80" y="501">System_VBlankHandler</text>

  <path class="wire" d="M 220 508 V 516"/>
  <path class="head" d="M 214 512 h 12 l -6 9 z"/>

  <!-- 5. The rest -->
  <rect class="card" x="60" y="522" width="320" height="56" rx="12"/>
  <circle class="dot" cx="86" cy="550" r="10"/>
  <text class="num" x="86" y="554" text-anchor="middle">5</text>
  <text class="p" x="104" y="555">VBlank tasks, buttons, sound</text>

  <!-- Back to the top -->
  <path class="wire-accent" d="M 60 550 H 30 V 96 H 54"/>
  <path class="head-accent" d="M 51 90 v 12 l 9 -6 z"/>
  <text class="label" transform="translate(22 330) rotate(-90)" text-anchor="middle">the next frame</text>

  <text class="p" x="20" y="616">Nothing reaches the screen until step 4.</text>
</svg>
