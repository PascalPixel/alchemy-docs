<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
  <title id="title">The heap gives back from the top</title>
  <desc id="desc">Three pictures of one heap pool, which hands out memory from the bottom up and keeps one mark, the next free address. First, three blocks A, B and C taken in that order, with the mark above C. Second, releasing C moves the mark back to C's start. Third, releasing B while C is still in use moves the mark back to B's start, so C's memory is free too and the next block taken will be put on top of it. Blocks are therefore released in the reverse of the order they were taken.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .pool { fill: #ffffff; stroke: #d4d4d4; }
    .a { fill: #0a72ef; }
    .b { fill: #16a34a; }
    .c { fill: #d97706; }
    .ghost { fill: none; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .mark { stroke: #0a0a0a; stroke-width: 2; }
    .markhead { fill: #0a0a0a; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #0a0a0a; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .no { fill: #b91c1c; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .pool { fill: #111111; stroke: #333333; }
      .a { fill: #3b8eff; }
      .b { fill: #22c55e; }
      .c { fill: #f59e0b; }
      .ghost { stroke: #f05252; }
      .mark { stroke: #ededed; }
      .markhead { fill: #ededed; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .in { fill: #0a0a0a; }
      .tag { fill: #ededed; }
      .no { fill: #f87171; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="499" rx="16"/>
  <text class="eyebrow" x="20" y="34">ONE POOL OF THE HEAP</text>
  <text class="code" x="380" y="34" text-anchor="end">Runtime_ReleaseHeapBlock</text>

  <!-- Column 1: A, B, C taken. Pools 80 wide at x 40, 160, 280; bottom 330, top 120 -->
  <text class="h" x="80" y="70" text-anchor="middle">Take A, B, C</text>
  <rect class="pool" x="40" y="110" width="80" height="220"/>
  <rect class="a" x="41" y="270" width="78" height="59"/>
  <text class="in" x="80" y="304" text-anchor="middle">A</text>
  <rect class="b" x="41" y="220" width="78" height="50"/>
  <text class="in" x="80" y="250" text-anchor="middle">B</text>
  <rect class="c" x="41" y="180" width="78" height="40"/>
  <text class="in" x="80" y="205" text-anchor="middle">C</text>
  <path class="mark" d="M 30 180 H 130"/>
  <path class="markhead" d="M 122 175 l 10 5 l -10 5 z"/>

  <!-- Column 2: release C -->
  <text class="h" x="200" y="70" text-anchor="middle">Release C</text>
  <rect class="pool" x="160" y="110" width="80" height="220"/>
  <rect class="a" x="161" y="270" width="78" height="59"/>
  <text class="in" x="200" y="304" text-anchor="middle">A</text>
  <rect class="b" x="161" y="220" width="78" height="50"/>
  <text class="in" x="200" y="250" text-anchor="middle">B</text>
  <path class="mark" d="M 150 220 H 250"/>
  <path class="markhead" d="M 242 215 l 10 5 l -10 5 z"/>

  <!-- Column 3: release B while C is held -->
  <text class="h" x="320" y="62" text-anchor="middle">Release B</text>
  <text class="small" x="320" y="80" text-anchor="middle">while C is in use</text>
  <rect class="pool" x="280" y="110" width="80" height="220"/>
  <rect class="a" x="281" y="270" width="78" height="59"/>
  <text class="in" x="320" y="304" text-anchor="middle">A</text>
  <rect class="ghost" x="282" y="181" width="76" height="38"/>
  <text class="no" x="320" y="205" text-anchor="middle">C, freed</text>
  <path class="mark" d="M 270 270 H 370"/>
  <path class="markhead" d="M 362 265 l 10 5 l -10 5 z"/>

  <!-- Key -->
  <path class="mark" d="M 40 362 H 64"/>
  <path class="markhead" d="M 60 357 l 10 5 l -10 5 z"/>
  <text class="tag" x="80" y="366">next free: the next block starts here</text>

  <text class="p" x="20" y="414">Releasing a block moves the mark back to its</text>
  <text class="p" x="20" y="433">start, freeing everything above it. So blocks</text>
  <text class="p" x="20" y="452">go back in the reverse of the order they</text>
  <text class="p" x="20" y="471">were taken.</text>
</svg>
