<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 524" role="img" aria-labelledby="title desc">
  <title id="title">A lost block is sent again</title>
  <desc id="desc">Two linked consoles, one sending a run of three numbered blocks to the other, one block each frame. The first block arrives and is stored. The second is lost on the cable. The third arrives, but the receiver is still waiting for the second, so it does not store it and asks for the second again. The sender goes back and sends the second and then the third once more, and the receiver stores both. Because the sender may have to go back, the data it sends must not change until the whole run is over.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .console { fill: #ffffff; stroke: #d4d4d4; }
    .lane { stroke: #e5e5e5; stroke-width: 1.5; }
    .pad { fill: #fafafa; }
    .blk { fill: #0a72ef; }
    .wire { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #0a72ef; }
    .lost { fill: none; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .back { fill: none; stroke: #d97706; stroke-width: 1.5; }
    .backhead { fill: #d97706; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ok { fill: #15803d; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .no { fill: #b91c1c; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ask { fill: #b45309; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .console { fill: #111111; stroke: #333333; }
      .lane { stroke: #262626; }
      .pad { fill: #0a0a0a; }
      .blk { fill: #3b8eff; }
      .wire { stroke: #3b8eff; }
      .head { fill: #3b8eff; }
      .lost { stroke: #f05252; }
      .back { stroke: #f59e0b; }
      .backhead { fill: #f59e0b; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .in { fill: #0a0a0a; }
      .ok { fill: #4ade80; }
      .no { fill: #f87171; }
      .ask { fill: #fbbf24; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="523" rx="16"/>
  <text class="eyebrow" x="20" y="34">ONE BLOCK EACH FRAME</text>
  <text class="code" x="380" y="504" text-anchor="end">SerialRuntime_StepBlockTransfer</text>

  <!-- Consoles -->
  <rect class="console" x="20" y="48" width="110" height="36" rx="8"/>
  <text class="h" x="75" y="71" text-anchor="middle">Sender</text>
  <rect class="console" x="270" y="48" width="110" height="36" rx="8"/>
  <text class="h" x="325" y="71" text-anchor="middle">Receiver</text>
  <path class="lane" d="M 75 84 V 400 M 325 84 V 400"/>

  <!-- Frame rows, 60 apart from y 116 -->
  <text class="small" x="200" y="104" text-anchor="middle">frame 1</text>
  <rect class="blk" x="52" y="108" width="46" height="22" rx="5"/>
  <text class="in" x="75" y="123" text-anchor="middle">block 1</text>
  <path class="wire" d="M 100 119 H 258"/>
  <path class="head" d="M 256 114 l 9 5 l -9 5 z"/>
  <rect class="pad" x="270" y="110" width="110" height="20"/>
  <text class="ok" x="325" y="124" text-anchor="middle">stored</text>

  <text class="small" x="200" y="160" text-anchor="middle">frame 2</text>
  <rect class="blk" x="52" y="164" width="46" height="22" rx="5"/>
  <text class="in" x="75" y="179" text-anchor="middle">block 2</text>
  <path class="lost" d="M 100 175 H 200"/>
  <text class="no" x="210" y="179">lost</text>

  <text class="small" x="200" y="216" text-anchor="middle">frame 3</text>
  <rect class="blk" x="52" y="220" width="46" height="22" rx="5"/>
  <text class="in" x="75" y="235" text-anchor="middle">block 3</text>
  <path class="wire" d="M 100 231 H 258"/>
  <path class="head" d="M 256 226 l 9 5 l -9 5 z"/>
  <rect class="pad" x="270" y="222" width="110" height="20"/>
  <text class="no" x="325" y="236" text-anchor="middle">not stored</text>
  <path class="back" d="M 300 252 H 112"/>
  <path class="backhead" d="M 114 247 l -9 5 l 9 5 z"/>
  <text class="ask" x="206" y="268" text-anchor="middle">"I need block 2"</text>

  <text class="small" x="200" y="296" text-anchor="middle">frame 4</text>
  <rect class="blk" x="52" y="300" width="46" height="22" rx="5"/>
  <text class="in" x="75" y="315" text-anchor="middle">block 2</text>
  <path class="wire" d="M 100 311 H 258"/>
  <path class="head" d="M 256 306 l 9 5 l -9 5 z"/>
  <rect class="pad" x="270" y="302" width="110" height="20"/>
  <text class="ok" x="325" y="316" text-anchor="middle">stored</text>

  <text class="small" x="200" y="352" text-anchor="middle">frame 5</text>
  <rect class="blk" x="52" y="356" width="46" height="22" rx="5"/>
  <text class="in" x="75" y="371" text-anchor="middle">block 3</text>
  <path class="wire" d="M 100 367 H 258"/>
  <path class="head" d="M 256 362 l 9 5 l -9 5 z"/>
  <rect class="pad" x="270" y="358" width="110" height="20"/>
  <text class="ok" x="325" y="372" text-anchor="middle">stored: done</text>

  <text class="p" x="20" y="436">The receiver stores only the block it expects.</text>
  <text class="p" x="20" y="455">Since the sender may go back, what it sends</text>
  <text class="p" x="20" y="474">must stay unchanged until the run is over.</text>
</svg>
