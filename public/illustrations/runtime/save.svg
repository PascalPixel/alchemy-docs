<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">A save never overwrites itself</title>
  <desc id="desc">The cartridge's flash memory as 16 sectors, each holding one record. Saving a record happens in two steps. First the new copy, numbered one higher than the old, is written into a free sector chosen at random, while the old copy is left alone. Only then is the old copy's sector marked free. If the power fails between the two steps, both copies are whole, and the next time the game starts it keeps the copy with the higher number.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .sector { fill: #ffffff; stroke: #d4d4d4; }
    .used { fill: #e5e5e5; stroke: #d4d4d4; }
    .old { fill: #fde7c7; stroke: #d97706; stroke-width: 1.5; }
    .new { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .freed { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tagold { fill: #b45309; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tagnew { fill: #15803d; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .num { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .badge { fill: #0a72ef; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .warn { fill: #fff7ed; stroke: #fed7aa; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .sector { fill: #111111; stroke: #333333; }
      .used { fill: #262626; stroke: #333333; }
      .old { fill: #3a2408; stroke: #f59e0b; }
      .new { fill: #0f2a18; stroke: #22c55e; }
      .freed { fill: #111111; stroke: #f59e0b; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .tagold { fill: #fbbf24; }
      .tagnew { fill: #4ade80; }
      .num { fill: #0a0a0a; }
      .badge { fill: #3b8eff; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .warn { fill: #1f1206; stroke: #4a2a0c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE FLASH: 16 SECTORS, ONE RECORD EACH</text>
  <text class="code" x="380" y="34" text-anchor="end"></text>

  <!-- Step 1 -->
  <circle class="badge" cx="30" cy="66" r="10"/>
  <text class="num" x="30" y="70" text-anchor="middle">1</text>
  <text class="h" x="48" y="71">Write the new copy somewhere free</text>
  <!-- 8 x 2 sectors, 42 x 36, gap 2; x from 24, y 86 and 124 -->
  <g>
    <rect class="used" x="24" y="86" width="42" height="36" rx="4"/>
    <rect class="sector" x="68" y="86" width="42" height="36" rx="4"/>
    <rect class="old" x="112" y="86" width="42" height="36" rx="4"/>
    <rect class="used" x="156" y="86" width="42" height="36" rx="4"/>
    <rect class="sector" x="200" y="86" width="42" height="36" rx="4"/>
    <rect class="used" x="244" y="86" width="42" height="36" rx="4"/>
    <rect class="sector" x="288" y="86" width="42" height="36" rx="4"/>
    <rect class="sector" x="332" y="86" width="42" height="36" rx="4"/>
    <rect class="sector" x="24" y="124" width="42" height="36" rx="4"/>
    <rect class="used" x="68" y="124" width="42" height="36" rx="4"/>
    <rect class="sector" x="112" y="124" width="42" height="36" rx="4"/>
    <rect class="sector" x="156" y="124" width="42" height="36" rx="4"/>
    <rect class="used" x="200" y="124" width="42" height="36" rx="4"/>
    <rect class="new" x="244" y="124" width="42" height="36" rx="4"/>
    <rect class="sector" x="288" y="124" width="42" height="36" rx="4"/>
    <rect class="used" x="332" y="124" width="42" height="36" rx="4"/>
  </g>
  <text class="tagold" x="133" y="102" text-anchor="middle">copy</text>
  <text class="tagold" x="133" y="116" text-anchor="middle">no. 7</text>
  <text class="tagnew" x="265" y="140" text-anchor="middle">copy</text>
  <text class="tagnew" x="265" y="154" text-anchor="middle">no. 8</text>
  <text class="small" x="24" y="180">The old copy is left alone; the free sector is picked at random.</text>

  <!-- Step 2 -->
  <circle class="badge" cx="30" cy="222" r="10"/>
  <text class="num" x="30" y="226" text-anchor="middle">2</text>
  <text class="h" x="48" y="227">Only then free the old one</text>
  <g>
    <rect class="used" x="24" y="242" width="42" height="36" rx="4"/>
    <rect class="sector" x="68" y="242" width="42" height="36" rx="4"/>
    <rect class="freed" x="112" y="242" width="42" height="36" rx="4"/>
    <rect class="used" x="156" y="242" width="42" height="36" rx="4"/>
    <rect class="sector" x="200" y="242" width="42" height="36" rx="4"/>
    <rect class="used" x="244" y="242" width="42" height="36" rx="4"/>
    <rect class="sector" x="288" y="242" width="42" height="36" rx="4"/>
    <rect class="sector" x="332" y="242" width="42" height="36" rx="4"/>
    <rect class="sector" x="24" y="280" width="42" height="36" rx="4"/>
    <rect class="used" x="68" y="280" width="42" height="36" rx="4"/>
    <rect class="sector" x="112" y="280" width="42" height="36" rx="4"/>
    <rect class="sector" x="156" y="280" width="42" height="36" rx="4"/>
    <rect class="used" x="200" y="280" width="42" height="36" rx="4"/>
    <rect class="new" x="244" y="280" width="42" height="36" rx="4"/>
    <rect class="sector" x="288" y="280" width="42" height="36" rx="4"/>
    <rect class="used" x="332" y="280" width="42" height="36" rx="4"/>
  </g>
  <text class="tagold" x="133" y="265" text-anchor="middle">free</text>
  <text class="tagnew" x="265" y="296" text-anchor="middle">copy</text>
  <text class="tagnew" x="265" y="310" text-anchor="middle">no. 8</text>

  <!-- Power loss -->
  <rect class="warn" x="20" y="342" width="360" height="98" rx="12"/>
  <text class="h" x="36" y="368">If the power fails between the two</text>
  <text class="p" x="36" y="392">Both copies are whole. The next time the</text>
  <text class="p" x="36" y="411">game starts, it keeps the higher number.</text>

  <!-- Key -->
  <rect class="used" x="24" y="462" width="16" height="14" rx="3"/>
  <text class="small" x="46" y="474">other records</text>
  <rect class="sector" x="146" y="462" width="16" height="14" rx="3"/>
  <text class="small" x="168" y="474">free</text>
  <text class="code" x="380" y="474" text-anchor="end">SaveState_WriteRecord</text>
  <text class="small" x="24" y="500">Each record carries its copy number in its header.</text>
</svg>
