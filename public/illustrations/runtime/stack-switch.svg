<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">The stack set aside while code waits</title>
  <desc id="desc">The top of IWRAM, where the stack grows down from the top towards the IWRAM heap. Two lines cross it: the frame-wait top, and 512 bytes below it the heap's end. On the left, code deep in its own calls has a stack reaching below the frame-wait top when it calls WaitFrames. WaitFrames copies the part below the line aside into gSavedStack in EWRAM. On the right, while the code waits, the frame loop, its tasks and the VBlank work run from the frame-wait top and have the 512 bytes to the heap's end to themselves. When the wait ends, the saved part is copied back.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .mem { fill: #ffffff; stroke: #d4d4d4; }
    .heap { fill: #f2f2f2; }
    .old { fill: #d4d4d4; }
    .deep { fill: #f59e0b; }
    .loop { fill: #0a72ef; fill-opacity: 0.85; }
    .line { stroke: #0a72ef; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .line2 { stroke: #737373; stroke-width: 1.5; }
    .arrow { fill: #737373; }
    .wire { fill: none; stroke: #d97706; stroke-width: 1.5; }
    .head { fill: #d97706; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag2 { fill: #525252; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ind { fill: #0a0a0a; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .mem { fill: #111111; stroke: #333333; }
      .heap { fill: #1a1a1a; }
      .old { fill: #3a3a3a; }
      .deep { fill: #d97706; }
      .loop { fill: #3b8eff; }
      .line { stroke: #3b8eff; }
      .line2 { stroke: #8f8f8f; }
      .arrow { fill: #8f8f8f; }
      .wire { stroke: #f59e0b; }
      .head { fill: #f59e0b; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .tag { fill: #66a6ff; }
      .tag2 { fill: #a1a1a1; }
      .in { fill: #0a0a0a; }
      .ind { fill: #0a0a0a; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="559" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE TOP OF IWRAM</text>
  <text class="code" x="380" y="34" text-anchor="end">WaitFrames</text>

  <text class="h" x="96" y="66" text-anchor="middle">Deep code calls</text>
  <text class="h" x="96" y="84" text-anchor="middle">WaitFrames</text>
  <text class="h" x="304" y="66" text-anchor="middle">While it waits</text>

  <!-- Left column: x 36..156; stack from y 100 (top) to the heap at 330 -->
  <rect class="mem" x="36" y="100" width="120" height="250"/>
  <rect class="old" x="37" y="101" width="118" height="99"/>
  <rect class="deep" x="37" y="200" width="118" height="70"/>
  <text class="ind" x="96" y="240" text-anchor="middle">its deepest calls</text>
  <rect class="heap" x="37" y="300" width="118" height="49"/>
  <text class="small" x="96" y="330" text-anchor="middle">the heap</text>
  <text class="tag2" x="96" y="154" text-anchor="middle">its older calls</text>

  <!-- Right column: x 244..364 -->
  <rect class="mem" x="244" y="100" width="120" height="250"/>
  <rect class="old" x="245" y="101" width="118" height="99"/>
  <text class="tag2" x="304" y="154" text-anchor="middle">its older calls</text>
  <rect class="loop" x="245" y="200" width="118" height="100"/>
  <text class="in" x="304" y="236" text-anchor="middle">frame loop,</text>
  <text class="in" x="304" y="252" text-anchor="middle">tasks and</text>
  <text class="in" x="304" y="268" text-anchor="middle">VBlank work</text>
  <rect class="heap" x="245" y="300" width="118" height="49"/>
  <text class="small" x="304" y="330" text-anchor="middle">the heap</text>

  <!-- The two lines across both columns -->
  <path class="line" d="M 30 200 H 370"/>
  <path class="line2" d="M 30 300 H 370"/>
  <text class="tag" x="200" y="194" text-anchor="middle">frame-wait</text>
  <text class="tag" x="200" y="214" text-anchor="middle">top</text>
  <text class="tag2" x="200" y="254" text-anchor="middle">512 bytes</text>
  <text class="tag2" x="200" y="294" text-anchor="middle">heap's end</text>
  <path class="line2" d="M 22 108 V 186"/>
  <path class="arrow" d="M 17 182 h 10 l -5 8 z"/>
  <text class="small" transform="translate(16 148) rotate(-90)" text-anchor="middle">grows down</text>

  <!-- Copied aside -->
  <path class="wire" d="M 96 270 V 420 H 232"/>
  <path class="head" d="M 228 414 v 12 l 9 -6 z"/>
  <text class="tag2" x="104" y="410">copied aside</text>
  <rect class="mem" x="244" y="386" width="120" height="70" rx="6"/>
  <rect class="deep" x="252" y="406" width="104" height="30" rx="4"/>
  <text class="small" x="304" y="472" text-anchor="middle">gSavedStack, in EWRAM</text>

  <text class="p" x="20" y="512">Tasks always start with the same room,</text>
  <text class="p" x="20" y="531">and the saved part goes back on return.</text>
</svg>
