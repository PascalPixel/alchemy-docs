<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 484" role="img" aria-labelledby="title desc">
  <title id="title">Code waits, tasks keep going</title>
  <desc id="desc">Five frames of a field map. A script's code does some work in the first frame, then calls WaitFrames to wait three frames, and carries on in the fifth. Meanwhile two tasks run once in every one of the five frames, waiting or not: the windows' task opens, closes and types the text windows, and the map's task scrolls the map's layers with the camera. WaitFrames is what runs them.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .col { fill: #f0f0f0; }
    .work { fill: #0a72ef; }
    .wait { fill: #ffffff; stroke: #a3a3a3; stroke-dasharray: 4 3; }
    .tick { fill: #16a34a; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .inw { fill: #525252; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .rule { stroke: #e5e5e5; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .col { fill: #171717; }
      .work { fill: #3b8eff; }
      .wait { fill: #111111; stroke: #5c5c5c; }
      .tick { fill: #22c55e; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .sub { fill: #8f8f8f; }
      .inw { fill: #a1a1a1; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .rule { stroke: #262626; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="483" rx="16"/>
  <text class="eyebrow" x="20" y="34">FIVE FRAMES OF A FIELD MAP</text>

  <!-- Five frame columns, one for each frame; three rows inside them -->
  <rect class="col" x="120" y="48" width="48" height="226" rx="6"/>
  <rect class="col" x="172" y="48" width="48" height="226" rx="6"/>
  <rect class="col" x="224" y="48" width="48" height="226" rx="6"/>
  <rect class="col" x="276" y="48" width="48" height="226" rx="6"/>
  <rect class="col" x="328" y="48" width="48" height="226" rx="6"/>
  <text class="small" x="20" y="70">frame</text>
  <text class="small" x="144" y="70" text-anchor="middle">1</text>
  <text class="small" x="196" y="70" text-anchor="middle">2</text>
  <text class="small" x="248" y="70" text-anchor="middle">3</text>
  <text class="small" x="300" y="70" text-anchor="middle">4</text>
  <text class="small" x="352" y="70" text-anchor="middle">5</text>

  <!-- The event -->
  <text class="h" x="20" y="104">A script</text>
  <text class="sub" x="20" y="122">its own code</text>
  <rect class="work" x="124" y="88" width="40" height="34" rx="6"/>
  <text class="in" x="144" y="110" text-anchor="middle">work</text>
  <rect class="wait" x="176" y="88" width="144" height="34" rx="6"/>
  <text class="inw" x="248" y="110" text-anchor="middle">waits 3 frames</text>
  <rect class="work" x="332" y="88" width="40" height="34" rx="6"/>
  <text class="in" x="352" y="110" text-anchor="middle">work</text>

  <!-- The windows' task -->
  <text class="h" x="20" y="182">Windows</text>
  <text class="sub" x="20" y="200">a task</text>
  <circle class="tick" cx="144" cy="186" r="7"/>
  <circle class="tick" cx="196" cy="186" r="7"/>
  <circle class="tick" cx="248" cy="186" r="7"/>
  <circle class="tick" cx="300" cy="186" r="7"/>
  <circle class="tick" cx="352" cy="186" r="7"/>

  <!-- The map's task -->
  <text class="h" x="20" y="242">The map</text>
  <text class="sub" x="20" y="260">a task</text>
  <circle class="tick" cx="144" cy="246" r="7"/>
  <circle class="tick" cx="196" cy="246" r="7"/>
  <circle class="tick" cx="248" cy="246" r="7"/>
  <circle class="tick" cx="300" cy="246" r="7"/>
  <circle class="tick" cx="352" cy="246" r="7"/>

  <!-- What each row does -->
  <path class="rule" d="M 20 296 H 380"/>
  <circle class="tick" cx="27" cy="320" r="5"/>
  <text class="p" x="40" y="325">a task runs once in that frame</text>
  <text class="p" x="20" y="352"><tspan font-weight="600">Windows</tspan> open, close and type their text.</text>
  <text class="p" x="20" y="374"><tspan font-weight="600">The map</tspan> scrolls its layers with the camera.</text>

  <!-- The rule -->
  <text class="p" x="20" y="408">The script stops inside WaitFrames(3), and every</text>
  <text class="p" x="20" y="427">frame WaitFrames runs each task once, so the</text>
  <text class="p" x="20" y="446">screen keeps moving while the script waits.</text>
  <text class="code" x="380" y="472" text-anchor="end">Scheduler_RunPass</text>
</svg>
