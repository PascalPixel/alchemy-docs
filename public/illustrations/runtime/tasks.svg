<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">What runs each frame, and when</title>
  <desc id="desc">The tasks of a field scene, as the task table holds them. Each task's order says which pass runs it and where in that pass. Every frame, WaitFrames runs the map's task, which scrolls the map's layers, and then the windows' task, which opens, closes and types the windows; the map's has the higher order, so it runs first. In every vertical blank, the VBlank handler runs the task that copies changed window tiles to the screen. While a menu is open, the scene's own tasks, whose code is in its overlay, are suspended: both passes skip them, and they keep their place for when the menu closes. The table has 20 slots, and each scene starts with it empty.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-dash { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-grey { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .num { fill: #ffffff; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .badge { fill: #0a72ef; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-dash { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-grey { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .sub { fill: #8f8f8f; }
      .k { fill: #66a6ff; }
      .kw, .p { fill: #a1a1a1; }
      .num { fill: #0a0a0a; }
      .badge { fill: #3b8eff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="34">A FIELD SCENE'S TASKS</text>
  <text class="code" x="380" y="34" text-anchor="end">gSchedulerTaskTable</text>

  <!-- Every frame -->
  <rect class="card-accent" x="20" y="48" width="360" height="150" rx="12"/>
  <text class="h" x="36" y="74">Every frame</text>
  <text class="sub" x="132" y="74">run by WaitFrames</text>
  <rect class="chip" x="36" y="88" width="328" height="34" rx="8"/>
  <circle class="badge" cx="54" cy="105" r="9"/>
  <text class="num" x="54" y="109" text-anchor="middle">1</text>
  <text class="k" x="72" y="110">The map's layers scroll with the camera</text>
  <path class="wire" d="M 54 122 V 134"/>
  <path class="head" d="M 49 131 h 10 l -5 7 z"/>
  <rect class="chip" x="36" y="140" width="328" height="34" rx="8"/>
  <circle class="badge" cx="54" cy="157" r="9"/>
  <text class="num" x="54" y="161" text-anchor="middle">2</text>
  <text class="k" x="72" y="162">The windows open, close and type</text>
  <text class="sub" x="364" y="190" text-anchor="end">the higher order runs first</text>

  <!-- Every blank -->
  <rect class="card" x="20" y="212" width="360" height="98" rx="12"/>
  <text class="h" x="36" y="238">Every blank</text>
  <text class="sub" x="128" y="238">run by the VBlank handler</text>
  <rect class="chip" x="36" y="252" width="328" height="34" rx="8"/>
  <circle class="badge" cx="54" cy="269" r="9"/>
  <text class="num" x="54" y="273" text-anchor="middle">1</text>
  <text class="k" x="72" y="274">Changed window tiles go to the screen</text>

  <!-- Suspended -->
  <rect class="card-dash" x="20" y="324" width="360" height="110" rx="12"/>
  <text class="h" x="36" y="350">Suspended</text>
  <text class="sub" x="122" y="350">skipped by both, keeping their place</text>
  <rect class="chip-grey" x="36" y="364" width="328" height="34" rx="8"/>
  <text class="kw" x="52" y="386">The scene's own tasks, while a menu is open</text>
  <text class="code" x="364" y="422" text-anchor="end">Scheduler_SuspendOverlayTasks</text>

  <text class="p" x="20" y="470">Each task carries an order, which says which</text>
  <text class="p" x="20" y="489">pass runs it and when. The table has 20 slots.</text>
</svg>
