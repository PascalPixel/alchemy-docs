<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 644" role="img" aria-labelledby="title desc">
  <title id="title">An effect from start to end</title>
  <desc id="desc">An effect sets up first: it opens the canvas, builds its blitters, loads its pictures and places its particles. Then it repeats the same frame a fixed number of times. Each frame it moves every particle one step, stamps its pictures into the canvas, and waits for the next frame, while the canvas is copied to the screen and what stays on it fades a little. After its last frame it stops the copying and frees what it built.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h17 { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .frame { fill: none; stroke: #d4d4d4; stroke-width: 1; }
    .canvasbg { fill: #101014; }

    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .h, .h17 { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .wire { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent { fill: #3b8eff; }
      .dot { fill: #3b8eff; }
      .frame { stroke: #333333; }

    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="643" rx="16"/>

  <text class="eyebrow" x="60" y="30">ONE EFFECT, FROM START TO END</text>

  <rect class="card" x="60" y="44" width="320" height="82" rx="12"/>
  <text class="h17" x="80" y="72">Set up</text>
  <text class="p" x="80" y="96">Open the canvas, build the blitters, load</text>
  <text class="p" x="80" y="115">the pictures and place the particles.</text>

  <path class="wire" d="M 220 126 V 150"/>
  <path class="head" d="M 214 146 h 12 l -6 9 z"/>

  <rect class="card-accent" x="60" y="154" width="320" height="100" rx="12"/>
  <circle class="dot" cx="83" cy="180" r="5"/>
  <text class="h17" x="96" y="186">Move</text>
  <text class="p" x="80" y="210">Every spark, ember and shard takes one</text>
  <text class="p" x="80" y="229">step along its path.</text>
  <path class="wire-accent" d="M 350 174 a 12 12 0 1 1 -10 -5"/>
  <path class="head-accent" d="M 336 164 l 8 1 l -4 7 z"/>

  <path class="wire" d="M 220 254 V 278"/>
  <path class="head" d="M 214 274 h 12 l -6 9 z"/>

  <rect class="card" x="60" y="282" width="320" height="100" rx="12"/>
  <text class="h17" x="80" y="312">Draw on the canvas</text>
  <text class="p" x="80" y="336">Each picture is stamped into the canvas,</text>
  <text class="p" x="80" y="355">a small picture kept out of sight.</text>

  <path class="wire" d="M 220 382 V 406"/>
  <path class="head" d="M 214 402 h 12 l -6 9 z"/>

  <rect class="card" x="60" y="410" width="320" height="120" rx="12"/>
  <text class="h17" x="80" y="440">Show it, and let it fade</text>
  <text class="p" x="80" y="464">The effect waits for the next frame, while</text>
  <text class="p" x="80" y="483">the canvas is copied to the screen and</text>
  <text class="p" x="80" y="502">what stays on it fades a little.</text>

  <path class="wire-accent" d="M 60 470 H 30 V 204 H 54"/>
  <path class="head-accent" d="M 51 198 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 337) rotate(-90)" text-anchor="middle">the next frame</text>

  <path class="wire" d="M 220 530 V 554"/>
  <path class="head" d="M 214 550 h 12 l -6 9 z"/>
  <text class="label" x="232" y="548">after its last frame</text>
  <rect class="card-exit" x="60" y="562" width="320" height="62" rx="12"/>
  <text class="h17" x="80" y="588">Clean up</text>
  <text class="p" x="80" y="610">Stop the copying, free what was built.</text>
</svg>
