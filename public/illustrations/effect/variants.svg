      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
    .rock { fill: #b07a48; }
    .rock-soft { fill: #b07a48; fill-opacity: 0.25; }
    .tick { stroke: #0a0a0a; stroke-width: 2; }
    .ring { fill: none; stroke: #0a72ef; stroke-width: 2.5; }
    .ring-soft { fill: none; stroke: #0a72ef; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .downed { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .cross { stroke: #a3a3a3; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #d4d4d4; }
    .box-on { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .box-empty { fill: #fafafa; stroke: #d4d4d4; stroke-dasharray: 3 3; }
    .v { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .von { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
