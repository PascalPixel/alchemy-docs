  <text class="eyebrow" x="20" y="30">THREE ABILITIES, ONE EFFECT</text>
  <text class="p" x="20" y="56">Quake, Earthquake and Quake Sphere play</text>
  <text class="p" x="20" y="75">the same animation. A stronger one keeps its</text>
  <text class="p" x="20" y="94">rock pillars rising and sinking for longer.</text>
