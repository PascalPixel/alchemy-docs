  <text class="small" x="292" y="318">the bounce line</text>
  <text class="small" x="292" y="64">a big flash,</text>
  <text class="small" x="292" y="79">for two</text>
  <text class="small" x="292" y="94">frames</text>
  <text class="small" x="292" y="128">a ring of</text>
  <text class="small" x="292" y="143">twelve small</text>
  <text class="small" x="292" y="158">flashes, each</text>
  <text class="small" x="292" y="173">further out</text>
  <text class="small" x="292" y="188">and later</text>
  <text class="small" x="292" y="220">sparks fly out,</text>
  <text class="small" x="292" y="235">fall, bounce at</text>
  <text class="small" x="292" y="250">half speed and</text>
  <text class="small" x="292" y="265">shrink as their</text>
  <text class="small" x="292" y="280">lives run out</text>

  <rect class="card" x="20" y="348" width="360" height="176" rx="12"/>
  <text class="h" x="40" y="374">How many bursts</text>

  <text class="kw" x="40" y="406">Blast, Fire Bomb</text>
  <text class="small" x="40" y="423">one burst of 128 sparks</text><path class="star" d="M 340 392 l 4 8 l 8 3 l -8 3 l -4 8 l -4 -8 l -8 -3 l 8 -3 z"/>

  <text class="kw" x="40" y="450">Nova, Cluster Bomb</text>
  <text class="small" x="40" y="467">one burst of 255 sparks</text><path class="star" d="M 340 436 l 4 8 l 8 3 l -8 3 l -4 8 l -4 -8 l -8 -3 l 8 -3 z"/>

  <text class="kw" x="40" y="494">Supernova, Carpet Bomb</text>
  <text class="small" x="40" y="511">three of 192, eight frames apart</text><path class="star" d="M 292 480 l 4 8 l 8 3 l -8 3 l -4 8 l -4 -8 l -8 -3 l 8 -3 z"/><path class="star" d="M 316 480 l 4 8 l 8 3 l -8 3 l -4 8 l -4 -8 l -8 -3 l 8 -3 z"/><path class="star" d="M 340 480 l 4 8 l 8 3 l -8 3 l -4 8 l -4 -8 l -8 -3 l 8 -3 z"/>
