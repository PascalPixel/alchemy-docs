  <text class="small" x="34" y="228">Ten columns of flame rise</text>
  <text class="small" x="34" y="244">from the ground, one every</text>
  <text class="small" x="34" y="260">four frames, and burst</text>
  <text class="small" x="34" y="276">into motes.</text>
  <rect class="card" x="204" y="44" width="176" height="250" rx="12"/>
  <text class="h" x="218" y="70">Mercury</text>
  <image href="data:image/png;base64," x="332.67" y="54" width="33.33" height="66.67" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <path class="ground" d="M 218 204 H 366"/><circle class="foe" cx="234" cy="182" r="5"/><rect class="foe" x="228" y="188" width="12" height="16" rx="4"/><circle class="foe" cx="258" cy="182" r="5"/><rect class="foe" x="252" y="188" width="12" height="16" rx="4"/><circle class="foe" cx="282" cy="182" r="5"/><rect class="foe" x="276" y="188" width="12" height="16" rx="4"/><path class="me" d="M 358 148 H 256"/><path class="me-f" d="M 248.0 148.0 L 256.0 152.5 L 256.0 143.5 Z"/><circle class="me-f" cx="238" cy="141" r="1.6"/><circle class="me-f" cx="244" cy="144" r="1.6"/><circle class="me-f" cx="232" cy="144" r="1.6"/><circle class="me-f" cx="245" cy="151" r="1.6"/><circle class="me-f" cx="231" cy="151" r="1.6"/><circle class="me-f" cx="238" cy="155" r="1.6"/><path class="me" d="M 358 162 H 274"/><path class="me-f" d="M 266.0 162.0 L 274.0 166.5 L 274.0 157.5 Z"/><circle class="me-f" cx="256" cy="155" r="1.6"/><circle class="me-f" cx="262" cy="158" r="1.6"/><circle class="me-f" cx="250" cy="158" r="1.6"/><circle class="me-f" cx="263" cy="165" r="1.6"/><circle class="me-f" cx="249" cy="165" r="1.6"/><circle class="me-f" cx="256" cy="169" r="1.6"/><path class="me" d="M 358 176 H 292"/><path class="me-f" d="M 284.0 176.0 L 292.0 180.5 L 292.0 171.5 Z"/>
  <text class="small" x="218" y="228">The Djinni circles and</text>
  <text class="small" x="218" y="244">fires five flames across;</text>
  <text class="small" x="218" y="260">each shatters into motes</text>
  <text class="small" x="218" y="276">five frames after it leaves.</text>
  <rect class="card" x="20" y="306" width="176" height="250" rx="12"/>
  <text class="h" x="34" y="332">Mars</text>
