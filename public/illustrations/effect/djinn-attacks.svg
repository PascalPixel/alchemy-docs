  <text class="small" x="34" y="490">An orb flares, the Djinni</text>
  <text class="small" x="34" y="506">dives, and nine flames</text>
  <text class="small" x="34" y="522">erupt in a row while</text>
  <text class="small" x="34" y="538">embers rise from them.</text>
  <rect class="card" x="204" y="306" width="176" height="250" rx="12"/>
  <text class="h" x="218" y="332">Jupiter</text>
  <image href="data:image/png;base64," x="332.67" y="316" width="33.33" height="66.67" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <path class="ground" d="M 218 466 H 366"/><circle class="foe" cx="234" cy="444" r="5"/><rect class="foe" x="228" y="450" width="12" height="16" rx="4"/><circle class="foe" cx="258" cy="444" r="5"/><rect class="foe" x="252" y="450" width="12" height="16" rx="4"/><circle class="foe" cx="282" cy="444" r="5"/><rect class="foe" x="276" y="450" width="12" height="16" rx="4"/><path class="ju" d="M 342 396 L 313 454"/><path class="ju-f" d="M 309.0 462.0 L 316.6 456.9 L 308.6 452.8 Z"/><circle class="ju-f" cx="307" cy="451" r="1.6"/><circle class="ju-f" cx="313" cy="454" r="1.6"/><circle class="ju-f" cx="301" cy="454" r="1.6"/><circle class="ju-f" cx="314" cy="461" r="1.6"/><circle class="ju-f" cx="300" cy="461" r="1.6"/><circle class="ju-f" cx="307" cy="465" r="1.6"/><path class="ju" d="M 322 396 L 293 454"/><path class="ju-f" d="M 289.0 462.0 L 296.6 456.9 L 288.6 452.8 Z"/><circle class="ju-f" cx="287" cy="451" r="1.6"/><circle class="ju-f" cx="293" cy="454" r="1.6"/><circle class="ju-f" cx="281" cy="454" r="1.6"/><circle class="ju-f" cx="294" cy="461" r="1.6"/><circle class="ju-f" cx="280" cy="461" r="1.6"/><circle class="ju-f" cx="287" cy="465" r="1.6"/><path class="ju" d="M 302 396 L 287 426"/><path class="ju-f" d="M 283.0 434.0 L 290.6 428.9 L 282.6 424.8 Z"/>
  <text class="small" x="218" y="490">Eight flameballs fall from</text>
  <text class="small" x="218" y="506">the top right, one every</text>
  <text class="small" x="218" y="522">four frames, and shatter</text>
  <text class="small" x="218" y="538">into motes as they land.</text>
  <text class="p" x="20" y="590">Each draws a small Djinni of its element. The</text>
  <text class="p" x="20" y="609">flames are the effect's own particles; the motes</text>
  <text class="p" x="20" y="628">a flame breaks into take a block of 32 places in</text>
  <text class="p" x="20" y="647">the borrowed pool.</text>
</svg>
