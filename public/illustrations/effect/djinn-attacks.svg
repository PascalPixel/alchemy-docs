<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 673" role="img" aria-labelledby="title desc">
  <title id="title">Four summons, four ways to throw flames</title>
  <desc id="desc">The four summons that need one Djinni each draw a small Djinni of their element and throw flames at the enemies. Venus raises ten columns of flame from the ground, one every four frames, each bursting into motes. Mercury's Djinni circles and fires five flames across the screen, each shattering into motes five frames after it leaves. Mars flares an orb, its Djinni dives into the ground and nine flames erupt in a row while embers rise from them. Jupiter drops eight flameballs from the top right, one every four frames, each shattering into motes as it lands. The flames are the effect's own particles; the motes each flame breaks into take a block of 32 places in the borrowed pool.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h17 { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .frame { fill: none; stroke: #d4d4d4; stroke-width: 1; }
    .canvasbg { fill: #101014; }

    .ground { stroke: #d4d4d4; stroke-width: 1.5; }
    .foe { fill: #c4c4c4; }
    .ve { stroke: #ca8a04; fill: none; stroke-width: 2; stroke-linecap: round; }
    .me { stroke: #2563eb; fill: none; stroke-width: 2; stroke-linecap: round; }
    .ma { stroke: #dc2626; fill: none; stroke-width: 2; stroke-linecap: round; }
    .ju { stroke: #9333ea; fill: none; stroke-width: 2; stroke-linecap: round; }
    .ve-f { fill: #ca8a04; } .me-f { fill: #2563eb; } .ma-f { fill: #dc2626; } .ju-f { fill: #9333ea; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .h, .h17 { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .wire { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent { fill: #3b8eff; }
      .dot { fill: #3b8eff; }
      .frame { stroke: #333333; }

      .ground { stroke: #3a3a3a; }
      .foe { fill: #4a4a4a; }
      .ve { stroke: #eab308; } .me { stroke: #60a5fa; } .ma { stroke: #f87171; } .ju { stroke: #c084fc; }
      .ve-f { fill: #eab308; } .me-f { fill: #60a5fa; } .ma-f { fill: #f87171; } .ju-f { fill: #c084fc; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="672" rx="16"/>

  <text class="eyebrow" x="20" y="30">FOUR SUMMONS, FOUR WAYS TO THROW FLAMES</text>
  <rect class="card" x="20" y="44" width="176" height="250" rx="12"/>
  <text class="h" x="34" y="70">Venus</text>
