<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 480 900" role="img" aria-labelledby="title desc">
  <title id="title">Isaac behind a roof</title>
  <desc id="desc">In Vale, Isaac walks behind a house and its roof covers all but his head. Below, the same place a few steps earlier is taken apart into the four sheets the console stacks, front on top: the overhead layer on BG1 with the roof and chimney; the characters, Isaac and a villager, as sprites; the middle layer on BG2, here the tree at the side; and the ground on BG3, with the grass, path and cliff. No code works out whether Isaac is hidden: the console draws the overhead layer over the characters. Most maps stack their layers in this order; a map can give them another.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rule { fill: none; stroke: #d4d4d4; stroke-width: 1.5; }
    .head { fill: #d4d4d4; }
    .px { image-rendering: pixelated; }
    .sheet { stroke-width: 2; fill-opacity: 0.08; }
    .c-ground { stroke: #0d9488; fill: #0d9488; }
    .c-middle { stroke: #7c3aed; fill: #7c3aed; }
    .c-sprites { stroke: #d97706; fill: #d97706; }
    .c-overhead { stroke: #0a72ef; fill: #0a72ef; }
    .screen { fill: none; stroke: #a3a3a3; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .eyebrow, .code { fill: #7c7c7c; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .rule { stroke: #404040; }
      .head { fill: #404040; }
      .sheet { fill-opacity: 0.14; }
      .c-ground { stroke: #2dd4bf; fill: #2dd4bf; }
      .c-middle { stroke: #a78bfa; fill: #a78bfa; }
      .c-sprites { stroke: #fbbf24; fill: #fbbf24; }
      .c-overhead { stroke: #3b8eff; fill: #3b8eff; }
      .screen { stroke: #525252; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="479" height="899" rx="16"/>

  <!-- On screen: the leader walked down from the grass behind the house
       (`render guide moment`, MOMENT_PLACE 4,1, MOMENT_STAND 370,627,
       MOMENT_HOLD 128,30) until the game stopped him; crop 128 by 64 at
       (100, 40) of the frame, drawn at twice its size. -->
  <text class="eyebrow" x="24" y="36">VALE, AS THE PLAYER SEES IT</text>
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-roof-behind.png" x="24" y="50" width="256" height="128"/>
  <rect class="screen" x="24" y="50" width="256" height="128"/>
  <text class="h" x="298" y="72">Isaac behind a roof</text>
  <text class="p" x="298" y="94">He has walked behind</text>
  <text class="p" x="298" y="112">a house; the roof is</text>
  <text class="p" x="298" y="130">drawn over all but</text>
  <text class="p" x="298" y="148">his head.</text>

  <!-- A few steps earlier (MOMENT_HOLD 128,12), the same place on the map,
       crop 128 by 64 at (100, 56) of each plane. planes.tsv lists them back
       to front: BG3 at priority 3, BG2 at 2, the sprites at 2 (a sprite
       wins a tie), BG1 at 1. Here front is drawn first, at the top. -->
  <text class="eyebrow" x="24" y="216">A FEW STEPS EARLIER, AS FOUR SHEETS</text>

  <path class="rule" d="M 30 252 V 790"/>
  <path class="head" d="M 24 260 l 6 -10 l 6 10 z"/>
  <text class="code" x="44" y="242">front: drawn over every sheet below</text>

  <rect class="sheet c-overhead" x="44" y="252" width="256" height="128"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-roof-bg1.png" x="44" y="252" width="256" height="128"/>
  <text class="h" x="316" y="276">The overhead layer</text>
  <text class="p" x="316" y="296">the roof, the chimney</text>
  <text class="code" x="316" y="316">BG1</text>
  <text class="code" x="316" y="332">MAPGRID_LAYER_OVERHEAD</text>

  <rect class="sheet c-sprites" x="44" y="392" width="256" height="128"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-roof-sprites-p2.png" x="44" y="392" width="256" height="128"/>
  <text class="h" x="316" y="416">The characters</text>
  <text class="p" x="316" y="436">Isaac, a villager</text>
  <text class="code" x="316" y="456">sprites, level with BG2</text>
  <text class="code" x="316" y="472">and drawn over it</text>

  <rect class="sheet c-middle" x="44" y="532" width="256" height="128"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-roof-bg2.png" x="44" y="532" width="256" height="128"/>
  <text class="h" x="316" y="556">The middle layer</text>
  <text class="p" x="316" y="576">here, the tree at the side</text>
  <text class="code" x="316" y="596">BG2</text>
  <text class="code" x="316" y="612">MAPGRID_LAYER_MIDDLE</text>

  <rect class="sheet c-ground" x="44" y="672" width="256" height="128"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-roof-bg3.png" x="44" y="672" width="256" height="128"/>
  <text class="h" x="316" y="696">The ground</text>
  <text class="p" x="316" y="716">grass, the path, the cliff</text>
  <text class="code" x="316" y="736">BG3</text>
  <text class="code" x="316" y="752">MAPGRID_LAYER_GROUND</text>
  <text class="code" x="44" y="820">back</text>

  <text class="p" x="24" y="848">No code works out whether Isaac is hidden: the console</text>
  <text class="p" x="24" y="866">draws the overhead layer over the characters. Most</text>
  <text class="p" x="24" y="884">maps stack their layers this way; a map can change it.</text>
</svg>
