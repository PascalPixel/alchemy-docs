<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 486" role="img" aria-labelledby="title desc">
  <title id="title">Four parts of the field</title>
  <desc id="desc">While the party walks around a place, four parts of the program work together. The loop lets the party walk, and stops to deal with whatever comes up. The engine moves everything that moves and draws the map, every frame. The map says where the ground is, how high it is and which spots do something. The place's own code, loaded for each place, says who stands where and what happens there. The loop asks the place's code what to do; the engine reads the map.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-place { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
    .h { fill: #0a0a0a; font: 600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .dot { fill: #0a72ef; }
    .dotg { fill: #16a34a; }
    .dotn { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-place { fill: #111111; stroke: #22c55e; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .dot { fill: #3b8eff; }
      .dotg { fill: #22c55e; }
      .dotn { fill: #5c5c5c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="485" rx="16"/>
  <text class="eyebrow" x="20" y="32">WHILE THE PARTY WALKS</text>

  <!-- The loop -->
  <rect class="card-accent" x="20" y="44" width="360" height="86" rx="12"/>
  <circle class="dot" cx="40" cy="66" r="5"/>
  <text class="h" x="52" y="72">The loop</text>
  <text class="p" x="36" y="96">Lets the party walk, and stops to deal</text>
  <text class="p" x="36" y="115">with whatever comes up.</text>
  <text class="code" x="364" y="72" text-anchor="end">object</text>

  <!-- arrows from the loop -->
  <path class="wire" d="M 110 130 V 152"/>
  <path class="head" d="M 104 148 h 12 l -6 9 z"/>
  <text class="k" x="120" y="146">each frame</text>
  <path class="wire" d="M 290 130 V 152"/>
  <path class="head" d="M 284 148 h 12 l -6 9 z"/>
  <text class="k" x="300" y="146">what now?</text>

  <!-- The engine -->
  <rect class="card" x="20" y="160" width="174" height="140" rx="12"/>
  <circle class="dotn" cx="40" cy="182" r="5"/>
  <text class="h" x="52" y="188">The engine</text>
  <text class="p" x="36" y="214">Moves everything</text>
  <text class="p" x="36" y="233">that moves, and</text>
  <text class="p" x="36" y="252">draws the map.</text>
  <text class="code" x="36" y="286">field</text>

  <!-- The place -->
  <rect class="card-place" x="206" y="160" width="174" height="140" rx="12"/>
  <circle class="dotg" cx="226" cy="182" r="5"/>
  <text class="h" x="238" y="188">The place</text>
  <text class="p" x="222" y="214">Who stands where,</text>
  <text class="p" x="222" y="233">and what happens.</text>
  <text class="p" x="222" y="252">Loaded for each place.</text>
  <text class="code" x="222" y="286">scene</text>

  <!-- engine to map -->
  <path class="wire" d="M 107 300 V 322"/>
  <path class="head" d="M 101 318 h 12 l -6 9 z"/>
  <text class="k" x="117" y="316">reads</text>

  <!-- The map -->
  <rect class="card" x="20" y="330" width="360" height="104" rx="12"/>
  <circle class="dotn" cx="40" cy="352" r="5"/>
  <text class="h" x="52" y="358">The map</text>
  <text class="p" x="36" y="384">Where the ground is, how high it is,</text>
  <text class="p" x="36" y="403">and which spots do something.</text>
  <text class="code" x="364" y="358" text-anchor="end">map</text>

  <text class="p" x="20" y="464">The loop and the engine know nothing of any one place.</text>
</svg>
