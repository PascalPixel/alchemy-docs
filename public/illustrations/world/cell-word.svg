<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 456" role="img" aria-labelledby="title desc">
  <title id="title">What one cell of a map says</title>
  <desc id="desc">A map is a grid of square cells, 16 pixels on a side. Each cell says three things. What is drawn there: one block, a square of four tiles. What standing there does: nothing on open ground, or a wall, a spot this place names such as a door or a chest, or ground where battles start. And the shape of its ground: flat, a slope or a step, and how high, which decides whether the leader can step onto it.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .cell { fill: #ffffff; stroke: #d4d4d4; }
    .cell-on { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 2; }
    .tile { fill: none; stroke: #93c5fd; stroke-width: 1; stroke-dasharray: 2 2; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .lead { stroke: #0a72ef; stroke-width: 1.5; fill: none; }
    .chip { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c { fill: #525252; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .num { fill: #0a72ef; }
    .num-t { fill: #ffffff; font: 700 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .cell { fill: #111111; stroke: #333333; }
      .cell-on { fill: #0d1a2e; stroke: #3b8eff; }
      .tile { stroke: #2b5299; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .lead { stroke: #3b8eff; }
      .chip { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .p, .c { fill: #a1a1a1; }
      .tag { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .num { fill: #3b8eff; }
      .num-t { fill: #0a0a0a; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="455" rx="16"/>
  <text class="eyebrow" x="20" y="32">ONE CELL OF A MAP</text>

  <!-- the grid -->
  <rect class="cell" x="20" y="48" width="40" height="40"/><rect class="cell" x="60" y="48" width="40" height="40"/><rect class="cell" x="100" y="48" width="40" height="40"/>
  <rect class="cell" x="20" y="88" width="40" height="40"/><rect class="cell" x="100" y="88" width="40" height="40"/>
  <rect class="cell" x="20" y="128" width="40" height="40"/><rect class="cell" x="60" y="128" width="40" height="40"/><rect class="cell" x="100" y="128" width="40" height="40"/>
  <rect class="cell-on" x="60" y="88" width="40" height="40"/>
  <path class="tile" d="M 80 88 V 128 M 60 108 H 100"/>
  <text class="tag" x="80" y="186" text-anchor="middle">16 pixels square</text>
  <path class="lead" d="M 100 108 H 160"/>

  <!-- the three things -->
  <rect class="card" x="160" y="44" width="220" height="74" rx="10"/>
  <circle class="num" cx="178" cy="66" r="5"/>
  <text class="h" x="194" y="71">What is drawn</text>
  <text class="p" x="176" y="96">one block: four tiles</text>

  <rect class="card" x="160" y="126" width="220" height="74" rx="10"/>
  <circle class="num" cx="178" cy="148" r="5"/>
  <text class="h" x="194" y="153">How high the ground is</text>
  <text class="p" x="176" y="178">flat, a slope or a step</text>

  <rect class="card" x="20" y="212" width="360" height="148" rx="10"/>
  <circle class="num" cx="38" cy="234" r="5"/>
  <text class="h" x="54" y="239">What standing there does</text>
  <rect class="chip" x="36" y="254" width="96" height="26" rx="13"/><text class="c" x="84" y="271" text-anchor="middle">nothing</text>
  <rect class="chip" x="138" y="254" width="64" height="26" rx="13"/><text class="c" x="170" y="271" text-anchor="middle">a wall</text>
  <rect class="chip" x="208" y="254" width="156" height="26" rx="13"/><text class="c" x="286" y="271" text-anchor="middle">a door, a chest, a ladder</text>
  <rect class="chip" x="36" y="286" width="166" height="26" rx="13"/><text class="c" x="119" y="303" text-anchor="middle">ground where battles start</text>
  <rect class="chip" x="208" y="286" width="156" height="26" rx="13"/><text class="c" x="286" y="303" text-anchor="middle">a ledge to jump down</text>
  <text class="tag" x="36" y="340">A door or a chest means what this place's events say.</text>

  <text class="p" x="20" y="392">The engine reads the ground to decide where</text>
  <text class="p" x="20" y="411">the leader can step; the place's events read</text>
  <text class="p" x="20" y="430">what standing there does to decide what happens.</text>
  <text class="code" x="380" y="446" text-anchor="end">struct MapCell</text>
</svg>
