<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 540" role="img" aria-labelledby="title desc">
  <title id="title">What one cell of a layout says</title>
  <desc id="desc">Nine cells of Vale, a grass corner against a cliff, as the game draws them, with the middle cell outlined and its four tiles dotted. A layout is a grid of square cells, 16 pixels on a side. Each cell says three things. What is drawn there: one metatile, a picture 16 pixels square made of 2 by 2 tiles, each tile an 8-pixel square picture, the smallest piece the console builds a background from. How high its ground is: flat, a slope or a step, which decides whether the leader can step onto it. And what standing there does: nothing on open ground, or a wall, a spot this map's events name such as a door, a chest or a ladder, ground where battles start, or a ledge to jump down.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .cell-on { fill: none; stroke: #0a72ef; stroke-width: 2; }
    .px { image-rendering: pixelated; }
    .grid { fill: none; stroke: #ffffff; stroke-opacity: 0.6; stroke-width: 1; }
    .tile-on { fill: none; stroke: #ffffff; stroke-width: 1; stroke-dasharray: 2 2; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .lead { stroke: #0a72ef; stroke-width: 1.5; fill: none; }
    .chip { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .num { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .cell-on { fill: none; stroke: #3b8eff; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .lead { stroke: #3b8eff; }
      .chip { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .p, .c { fill: #a1a1a1; }
      .tag { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .num { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="539" rx="16"/>
  <text class="eyebrow" x="20" y="32">ONE CELL OF A LAYOUT</text>

  <!-- the grid: nine cells of Vale, from render place, scene ValeGate, map-0.png cut 48x48+400+432 on the 16-pixel cell grid, drawn at three times their size -->
  <image href="data:image/png;base64," class="px" data-crop="crops/world/vale-cells.png" x="20" y="48" width="144" height="144"/>
  <path class="grid" d="M 68 48 V 192 M 116 48 V 192 M 20 96 H 164 M 20 144 H 164"/>
  <path class="tile-on" d="M 92 96 V 144 M 68 120 H 116"/>
  <rect class="cell-on" x="68" y="96" width="48" height="48"/>
  <text class="tag" x="92" y="214" text-anchor="middle">a cell: 16 pixels square</text>
  <path class="lead" d="M 164 106 H 180"/>

  <!-- the three things -->
  <rect class="card" x="180" y="44" width="200" height="124" rx="10"/>
  <circle class="num" cx="198" cy="66" r="5"/>
  <text class="h" x="214" y="71">What is drawn</text>
  <text class="p" x="196" y="96">one metatile: a picture</text>
  <text class="p" x="196" y="115">16 pixels square, made</text>
  <text class="p" x="196" y="134">of 2 by 2 tiles of 8</text>
  <text class="p" x="196" y="153">pixels (dotted)</text>

  <rect class="card" x="180" y="178" width="200" height="74" rx="10"/>
  <circle class="num" cx="198" cy="200" r="5"/>
  <text class="h" x="214" y="205">How high it is</text>
  <text class="p" x="196" y="230">flat, a slope or a step</text>

  <g transform="translate(0 20)">
  <rect class="card" x="20" y="244" width="360" height="148" rx="10"/>
  <circle class="num" cx="38" cy="266" r="5"/>
  <text class="h" x="54" y="271">What standing there does</text>
  <rect class="chip" x="36" y="286" width="80" height="28" rx="14"/><text class="c" x="76" y="305" text-anchor="middle">nothing</text>
  <rect class="chip" x="122" y="286" width="68" height="28" rx="14"/><text class="c" x="156" y="305" text-anchor="middle">a wall</text>
  <rect class="chip" x="196" y="286" width="168" height="28" rx="14"/><text class="c" x="280" y="305" text-anchor="middle">a door, a chest, a ladder</text>
  <rect class="chip" x="36" y="320" width="176" height="28" rx="14"/><text class="c" x="124" y="339" text-anchor="middle">ground where battles start</text>
  <rect class="chip" x="218" y="320" width="146" height="28" rx="14"/><text class="c" x="291" y="339" text-anchor="middle">a ledge to jump down</text>
  <text class="tag" x="36" y="374">A door or a chest means what this map's events say.</text>

  <text class="p" x="20" y="426">The engine reads the ground to decide where</text>
  <text class="p" x="20" y="445">the leader can step; the map's events read</text>
  <text class="p" x="20" y="464">what standing there does to decide what happens.</text>
  </g>
  <text class="code" x="380" y="520" text-anchor="end">struct MapGridCell</text>
</svg>
