<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">What one cell of a map says</title>
  <desc id="desc">A map is a grid of square cells, 16 pixels on a side. Each cell says three things. What is drawn there: one block, a picture 16 pixels square made of 2 by 2 tiles, each tile an 8-pixel square picture, the smallest piece the console builds a background from. How high its ground is: flat, a slope or a step, which decides whether the leader can step onto it. And what standing there does: nothing on open ground, or a wall, a spot this place names such as a door, a chest or a ladder, ground where battles start, or a ledge to jump down.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .cell { fill: #ffffff; stroke: #d4d4d4; }
    .cell-on { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 2; }
    .tile { fill: none; stroke: #93c5fd; stroke-width: 1; stroke-dasharray: 2 2; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .lead { stroke: #0a72ef; stroke-width: 1.5; fill: none; }
    .chip { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .num { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .cell { fill: #111111; stroke: #333333; }
      .cell-on { fill: #0d1a2e; stroke: #3b8eff; }
      .tile { stroke: #2b5299; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .lead { stroke: #3b8eff; }
      .chip { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .p, .c { fill: #a1a1a1; }
      .tag { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .num { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="32">ONE CELL OF A MAP</text>

  <!-- the grid -->
  <rect class="cell" x="20" y="48" width="40" height="40"/><rect class="cell" x="60" y="48" width="40" height="40"/><rect class="cell" x="100" y="48" width="40" height="40"/>
  <rect class="cell" x="20" y="88" width="40" height="40"/><rect class="cell" x="100" y="88" width="40" height="40"/>
  <rect class="cell" x="20" y="128" width="40" height="40"/><rect class="cell" x="60" y="128" width="40" height="40"/><rect class="cell" x="100" y="128" width="40" height="40"/>
  <rect class="cell-on" x="60" y="88" width="40" height="40"/>
  <path class="tile" d="M 80 88 V 128 M 60 108 H 100"/>
  <text class="tag" x="80" y="190" text-anchor="middle">a cell: 16 pixels</text>
  <text class="tag" x="80" y="207" text-anchor="middle">square</text>
  <path class="lead" d="M 100 108 H 160"/>

  <!-- the three things -->
  <rect class="card" x="160" y="44" width="220" height="104" rx="10"/>
  <circle class="num" cx="178" cy="66" r="5"/>
  <text class="h" x="194" y="71">What is drawn</text>
  <text class="p" x="176" y="96">one block: a 16-pixel picture</text>
  <text class="p" x="176" y="115">of 2 by 2 tiles, each tile an</text>
  <text class="p" x="176" y="134">8-pixel square (dotted)</text>

  <rect class="card" x="160" y="158" width="220" height="74" rx="10"/>
  <circle class="num" cx="178" cy="180" r="5"/>
  <text class="h" x="194" y="185">How high the ground is</text>
  <text class="p" x="176" y="210">flat, a slope or a step</text>

  <rect class="card" x="20" y="244" width="360" height="148" rx="10"/>
  <circle class="num" cx="38" cy="266" r="5"/>
  <text class="h" x="54" y="271">What standing there does</text>
  <rect class="chip" x="36" y="286" width="80" height="28" rx="14"/><text class="c" x="76" y="305" text-anchor="middle">nothing</text>
  <rect class="chip" x="122" y="286" width="68" height="28" rx="14"/><text class="c" x="156" y="305" text-anchor="middle">a wall</text>
  <rect class="chip" x="196" y="286" width="168" height="28" rx="14"/><text class="c" x="280" y="305" text-anchor="middle">a door, a chest, a ladder</text>
  <rect class="chip" x="36" y="320" width="176" height="28" rx="14"/><text class="c" x="124" y="339" text-anchor="middle">ground where battles start</text>
  <rect class="chip" x="218" y="320" width="146" height="28" rx="14"/><text class="c" x="291" y="339" text-anchor="middle">a ledge to jump down</text>
  <text class="tag" x="36" y="374">A door or a chest means what this place's events say.</text>

  <text class="p" x="20" y="426">The engine reads the ground to decide where</text>
  <text class="p" x="20" y="445">the leader can step; the place's events read</text>
  <text class="p" x="20" y="464">what standing there does to decide what happens.</text>
  <text class="code" x="380" y="500" text-anchor="end">struct MapCell</text>
</svg>
