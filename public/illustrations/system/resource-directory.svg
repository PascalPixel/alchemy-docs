<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">How a number finds its data</title>
  <desc id="desc">How the game finds Bilibin's code by number. The scene table's row for Bilibin names its overlay by a resource number. That number is a row of the resource directory, a list with one row for every picture, map, table and overlay, in a fixed order. Bilibin's row holds where its packed data starts in the cartridge. The game reads the row, finds the packed data and unpacks it into the overlay area. Because a resource's number is its place in the list, a row added in the middle gives every later resource a new number.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .row { fill: #f5f5f5; stroke: #e5e5e5; }
    .row-hit { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .data { fill: #0a72ef; fill-opacity: 0.15; stroke: #0a72ef; stroke-width: 1.5; }
    .datafill { fill: #0a72ef; }
    .wire { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #0a72ef; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .r { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .rk { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .num { fill: #ffffff; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .badge { fill: #0a72ef; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .row { fill: #1a1a1a; stroke: #2e2e2e; }
      .row-hit { fill: #0d1a2e; stroke: #3b8eff; }
      .data { fill: #3b8eff; fill-opacity: 0.2; stroke: #3b8eff; }
      .datafill { fill: #3b8eff; }
      .wire { stroke: #3b8eff; }
      .head { fill: #3b8eff; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .r { fill: #8f8f8f; }
      .rk { fill: #66a6ff; }
      .in, .num { fill: #0a0a0a; }
      .badge { fill: #3b8eff; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="599" rx="16"/>
  <text class="eyebrow" x="20" y="34">FINDING BILIBIN'S CODE</text>

  <!-- 1. The scene table -->
  <circle class="badge" cx="30" cy="62" r="10"/>
  <text class="num" x="30" y="66" text-anchor="middle">1</text>
  <text class="h" x="48" y="67">The scene table names a number</text>
  <rect class="card" x="20" y="80" width="360" height="44" rx="10"/>
  <text class="p" x="36" y="107">Bilibin: its code is resource</text>
  <rect class="datafill" x="232" y="91" width="58" height="22" rx="11"/>
  <text class="in" x="261" y="107" text-anchor="middle">no. N</text>
  <text class="code" x="364" y="107" text-anchor="end">scenes.s</text>

  <!-- 2. The directory -->
  <circle class="badge" cx="30" cy="160" r="10"/>
  <text class="num" x="30" y="164" text-anchor="middle">2</text>
  <text class="h" x="48" y="165">Row N of the directory says where</text>
  <rect class="card" x="20" y="178" width="200" height="232" rx="10"/>
  <rect class="row" x="30" y="188" width="180" height="24" rx="4"/>
  <text class="r" x="40" y="204">a picture</text>
  <rect class="row" x="30" y="216" width="180" height="24" rx="4"/>
  <text class="r" x="40" y="232">a map</text>
  <rect class="row" x="30" y="244" width="180" height="24" rx="4"/>
  <text class="r" x="40" y="260">a table</text>
  <text class="r" x="120" y="284" text-anchor="middle">…</text>
  <rect class="row-hit" x="30" y="292" width="180" height="28" rx="4"/>
  <text class="rk" x="40" y="311">row N: Bilibin's code</text>
  <text class="r" x="120" y="342" text-anchor="middle">…</text>
  <rect class="row" x="30" y="352" width="180" height="24" rx="4"/>
  <text class="r" x="40" y="368">another overlay</text>
  <text class="code" x="120" y="400" text-anchor="middle">directory.s</text>
  <path class="wire" d="M 261 113 V 140 H 230 V 300 H 216"/>
  <path class="head" d="M 218 294 l -9 6 l 9 6 z"/>

  <!-- 3. The packed data -->
  <text class="eyebrow" x="240" y="196">THE CARTRIDGE</text>
  <rect class="card" x="240" y="206" width="140" height="204" rx="10"/>
  <rect class="row" x="252" y="218" width="116" height="40" rx="4"/>
  <rect class="data" x="252" y="264" width="116" height="66" rx="4"/>
  <text class="rk" x="310" y="294" text-anchor="middle">Bilibin's</text>
  <text class="rk" x="310" y="310" text-anchor="middle">code, packed</text>
  <rect class="row" x="252" y="336" width="116" height="62" rx="4"/>
  <path class="wire" d="M 210 314 H 242"/>
  <path class="head" d="M 242 308 l 9 6 l -9 6 z"/>

  <!-- 4. Unpacked -->
  <circle class="badge" cx="30" cy="446" r="10"/>
  <text class="num" x="30" y="450" text-anchor="middle">3</text>
  <text class="h" x="48" y="451">Unpacked where it is needed</text>
  <rect class="datafill" x="20" y="464" width="360" height="40" rx="8"/>
  <text class="in" x="200" y="489" text-anchor="middle">Bilibin's code, in the overlay area</text>

  <text class="p" x="20" y="542">A resource's number is its place in the list,</text>
  <text class="p" x="20" y="561">so a row added in the middle renumbers every</text>
  <text class="p" x="20" y="580">resource after it.</text>
</svg>
