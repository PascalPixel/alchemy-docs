<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 540" role="img" aria-labelledby="title desc">
  <title id="title">One place's code at a time</title>
  <desc id="desc">The cartridge holds each place's code packed, as one of 96 overlays: Vale, Vault, Bilibin, Bilibin's houses, Kolima, Imil and the rest. In RAM there is room for one, the 32 KB overlay area. While the party is in Bilibin, Bilibin's overlay is unpacked there. When the party walks into one of Bilibin's houses, the new scene's overlay, the houses', is unpacked into the same area over Bilibin's, which is gone until the party walks back out.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .pack { fill: #f5f5f5; stroke: #d4d4d4; }
    .pack-a { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .pack-b { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .area { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .fill-a { fill: #0a72ef; }
    .fill-b { fill: #16a34a; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kp { fill: #525252; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ka { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #15803d; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .in { fill: #ffffff; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .label { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .pack { fill: #1a1a1a; stroke: #333333; }
      .pack-a { fill: #0d1a2e; stroke: #3b8eff; }
      .pack-b { fill: #0f2a18; stroke: #22c55e; }
      .area { fill: #111111; stroke: #ededed; }
      .fill-a { fill: #3b8eff; }
      .fill-b { fill: #22c55e; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .h { fill: #ededed; }
      .p, .kp, .label { fill: #a1a1a1; }
      .ka { fill: #66a6ff; }
      .kb { fill: #4ade80; }
      .in { fill: #0a0a0a; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="539" rx="16"/>

  <!-- The cartridge -->
  <text class="eyebrow" x="20" y="34">IN THE CARTRIDGE: 96 PACKED OVERLAYS</text>
  <rect class="card" x="20" y="46" width="360" height="104" rx="12"/>
  <rect class="pack" x="34" y="60" width="56" height="34" rx="6"/>
  <text class="kp" x="62" y="81" text-anchor="middle">Vale</text>
  <rect class="pack" x="96" y="60" width="60" height="34" rx="6"/>
  <text class="kp" x="126" y="81" text-anchor="middle">Vault</text>
  <rect class="pack-a" x="162" y="60" width="70" height="34" rx="6"/>
  <text class="ka" x="197" y="81" text-anchor="middle">Bilibin</text>
  <rect class="pack-b" x="238" y="60" width="128" height="34" rx="6"/>
  <text class="kb" x="302" y="81" text-anchor="middle">Bilibin's houses</text>
  <rect class="pack" x="34" y="102" width="66" height="34" rx="6"/>
  <text class="kp" x="67" y="123" text-anchor="middle">Kolima</text>
  <rect class="pack" x="106" y="102" width="56" height="34" rx="6"/>
  <text class="kp" x="134" y="123" text-anchor="middle">Imil</text>
  <text class="small" x="174" y="123">and the rest</text>

  <!-- Step 1 -->
  <text class="eyebrow" x="20" y="186">IN RAM: ROOM FOR ONE</text>
  <text class="h" x="20" y="212">In Bilibin</text>
  <rect class="area" x="20" y="224" width="360" height="70" rx="8"/>
  <rect class="fill-a" x="30" y="234" width="340" height="50" rx="6"/>
  <text class="in" x="200" y="264" text-anchor="middle">Bilibin's code, unpacked</text>
  <path class="wire" d="M 197 94 C 197 160 120 160 120 222" stroke-dasharray="3 3"/>
  <path class="head" d="M 114 216 h 12 l -6 9 z"/>

  <path class="wire" d="M 366 77 H 390 V 413 H 386" stroke-dasharray="3 3"/>
  <path class="head" d="M 388 407 v 12 l -8 -6 z"/>

  <!-- The walk -->
  <path class="wire" d="M 200 300 V 334"/>
  <path class="head" d="M 194 330 h 12 l -6 9 z"/>
  <text class="label" x="214" y="324">the party walks into a house</text>

  <!-- Step 2 -->
  <text class="h" x="20" y="366">In one of Bilibin's houses</text>
  <rect class="area" x="20" y="378" width="360" height="70" rx="8"/>
  <rect class="fill-b" x="30" y="388" width="340" height="50" rx="6"/>
  <text class="in" x="200" y="418" text-anchor="middle">the houses' code, over Bilibin's</text>
  <text class="code" x="380" y="466" text-anchor="end">gOverlayArea · 32 KB of EWRAM</text>

  <text class="p" x="20" y="500">Every overlay is built to run at the same</text>
  <text class="p" x="20" y="519">place, so only one place's code is ever loaded.</text>
</svg>
