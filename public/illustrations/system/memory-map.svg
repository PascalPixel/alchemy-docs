<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 800" role="img" aria-labelledby="title desc">
  <title id="title">What lives where in memory</title>
  <desc id="desc">The console's two kinds of working memory, drawn to scale. EWRAM, 256 KB and slower, holds from the bottom up: the game's variables, flags and save buffer; the overlay, the code of the current place; the map's cells; battle sprite pictures; space to unpack into; the map's blocks, layers and collision; the EWRAM heap; and background tiles at the top. IWRAM, 32 KB and fast, holds the fast routines copied from the cartridge, the variables the engine uses most, the IWRAM heap, the sound mixer's code and the stacks at the top. The program itself, the pictures, maps and music stay on the cartridge, which can only be read.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .seg { fill: #e5e5e5; stroke: #ffffff; stroke-width: 1; }
    .ovl { fill: #0a72ef; stroke: #ffffff; stroke-width: 1; }
    .map { fill: #f6c87a; stroke: #ffffff; stroke-width: 1; }
    .heap { fill: #16a34a; stroke: #ffffff; stroke-width: 1; }
    .code-seg { fill: #7c3aed; stroke: #ffffff; stroke-width: 1; }
    .lead { stroke: #d4d4d4; stroke-width: 1; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #404040; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lb { fill: #0a0a0a; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .seg { fill: #333333; stroke: #111111; }
      .ovl { fill: #3b8eff; stroke: #111111; }
      .map { fill: #a16207; stroke: #111111; }
      .heap { fill: #22c55e; stroke: #111111; }
      .code-seg { fill: #a78bfa; stroke: #111111; }
      .lead { stroke: #333333; }
      .h { fill: #ededed; }
      .sub { fill: #8f8f8f; }
      .l { fill: #c4c4c4; }
      .lb { fill: #ededed; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .p { fill: #a1a1a1; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="799" rx="16"/>
  <text class="eyebrow" x="20" y="34">WORKING MEMORY, TO SCALE</text>
  <text class="code" x="380" y="34" text-anchor="end">ewram.s · iwram.s</text>

  <!-- EWRAM: 256 KB at 1.125 px a KB, top of memory at the top. Bar x 36..92, from y 108 to 396. -->
  <rect class="card" x="20" y="48" width="360" height="368" rx="12"/>
  <text class="h" x="36" y="74">EWRAM</text>
  <text class="sub" x="104" y="74">256 KB, slower</text>
  <text class="small" x="36" y="100">top</text>
  <rect class="seg" x="36" y="108" width="56" height="36"/>
  <text class="l" x="104" y="131">background tiles</text>
  <rect class="heap" x="36" y="144" width="56" height="36"/>
  <text class="lb" x="104" y="167">the EWRAM heap</text>
  <rect class="map" x="36" y="180" width="56" height="18"/>
  <text class="l" x="104" y="194">the map's collision</text>
  <rect class="map" x="36" y="198" width="56" height="18"/>
  <text class="l" x="104" y="212">the map's layers</text>
  <rect class="map" x="36" y="216" width="56" height="36"/>
  <text class="l" x="104" y="239">the map's blocks</text>
  <rect class="seg" x="36" y="252" width="56" height="18"/>
  <text class="l" x="104" y="266">space to unpack pictures into</text>
  <rect class="seg" x="36" y="270" width="56" height="18"/>
  <text class="l" x="104" y="284">battle sprite pictures</text>
  <rect class="map" x="36" y="288" width="56" height="36"/>
  <text class="l" x="104" y="311">the map's cells</text>
  <rect class="ovl" x="36" y="324" width="56" height="36"/>
  <text class="lb" x="104" y="347">the current place's code: the overlay</text>
  <rect class="seg" x="36" y="360" width="56" height="36"/>
  <text class="l" x="104" y="376">the game's variables and flags,</text>
  <text class="l" x="104" y="392">the save buffer, the sound's work</text>
  <text class="small" x="36" y="410">bottom</text>

  <!-- IWRAM: 32 KB at 7 px a KB. Bar from y 484 to 708. -->
  <rect class="card" x="20" y="432" width="360" height="296" rx="12"/>
  <text class="h" x="36" y="458">IWRAM</text>
  <text class="sub" x="104" y="458">32 KB, fast</text>
  <text class="small" x="36" y="478">top</text>
  <rect class="seg" x="36" y="484" width="56" height="14"/>
  <text class="l" x="104" y="495">the stacks</text>
  <rect class="code-seg" x="36" y="498" width="56" height="14"/>
  <text class="l" x="104" y="512">the sound mixer's code</text>
  <rect class="heap" x="36" y="512" width="56" height="140"/>
  <text class="lb" x="104" y="586">the IWRAM heap</text>
  <rect class="seg" x="36" y="652" width="56" height="21"/>
  <text class="l" x="104" y="667">the engine's busiest variables</text>
  <rect class="code-seg" x="36" y="673" width="56" height="35"/>
  <text class="l" x="104" y="695">fast routines, copied at power-on</text>
  <text class="small" x="36" y="722">bottom</text>

  <text class="p" x="20" y="760">The program, pictures, maps and music stay on</text>
  <text class="p" x="20" y="779">the cartridge, which the CPU reads directly.</text>
</svg>
