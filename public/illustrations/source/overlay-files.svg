<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 590" role="img" aria-labelledby="title desc">
  <title id="title">One map, three files</title>
  <desc id="desc">Bilibin's overlay is three files. The entry table, map/entry/bilibin.s, comes first: six stubs the field code calls to start the map and to get its warp destinations, warps, object event templates, map events and warp regions. Then the map's own code and tables, map/bilibin.c. Last the import table, map/import/bilibin.s, which lists the main-image routines Bilibin's code calls, such as waiting a number of frames or setting a game flag, each reached through its far-call entry. The engine and the map meet only at these two tables.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .ovl { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .tab { fill: #ffffff; stroke: #bcd7fb; }
    .main { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .wire { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #0a72ef; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .f { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .ovl { fill: #0f2a18; stroke: #22c55e; }
      .tab { fill: #111111; stroke: #1e3a66; }
      .main { fill: #1a1a1a; stroke: #333333; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .wire { stroke: #3b8eff; }
      .head { fill: #3b8eff; }
      .h { fill: #ededed; }
      .p, .l { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .f, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="589" rx="16"/>
  <text class="eyebrow" x="20" y="34">BILIBIN'S OVERLAY</text>

  <!-- The engine -->
  <rect class="main" x="20" y="46" width="360" height="40" rx="10"/>
  <text class="h" x="36" y="71">The field code</text>

  <path class="wire" d="M 200 86 V 108"/>
  <path class="head" d="M 194 104 h 12 l -6 9 z"/>
  <text class="l" x="212" y="102">calls in through</text>

  <!-- The overlay -->
  <rect class="ovl" x="20" y="114" width="360" height="330" rx="12"/>

  <rect class="tab" x="32" y="126" width="336" height="134" rx="8"/>
  <text class="h" x="46" y="150">The entry table</text>
  <text class="f" x="354" y="150" text-anchor="end">entry/bilibin.s</text>
  <rect class="chip" x="46" y="162" width="70" height="24" rx="12"/><text class="k" x="81" y="179" text-anchor="middle">start-up</text>
  <rect class="chip" x="122" y="162" width="130" height="24" rx="12"/><text class="k" x="187" y="179" text-anchor="middle">warp destinations</text>
  <rect class="chip" x="258" y="162" width="56" height="24" rx="12"/><text class="k" x="286" y="179" text-anchor="middle">warps</text>
  <rect class="chip" x="46" y="192" width="160" height="24" rx="12"/><text class="k" x="126" y="209" text-anchor="middle">object event templates</text>
  <rect class="chip" x="212" y="192" width="90" height="24" rx="12"/><text class="k" x="257" y="209" text-anchor="middle">map events</text>
  <rect class="chip" x="46" y="222" width="104" height="24" rx="12"/><text class="k" x="98" y="239" text-anchor="middle">warp regions</text>

  <rect class="tab" x="32" y="270" width="336" height="56" rx="8"/>
  <text class="h" x="46" y="294">Bilibin's code and tables</text>
  <text class="f" x="354" y="294" text-anchor="end">bilibin.c</text>
  <text class="l" x="46" y="314">its people, events and cutscenes</text>

  <rect class="tab" x="32" y="336" width="336" height="96" rx="8"/>
  <text class="h" x="46" y="360">The import table</text>
  <text class="f" x="354" y="360" text-anchor="end">import/bilibin.s</text>
  <text class="l" x="46" y="382">the engine's routines Bilibin calls:</text>
  <rect class="chip" x="46" y="392" width="132" height="24" rx="12"/><text class="k" x="112" y="409" text-anchor="middle">wait some frames</text>
  <rect class="chip" x="184" y="392" width="112" height="24" rx="12"/><text class="k" x="240" y="409" text-anchor="middle">set a flag</text>
  <text class="l" x="306" y="409">…</text>

  <path class="wire" d="M 200 444 V 466"/>
  <path class="head" d="M 194 462 h 12 l -6 9 z"/>
  <text class="l" x="212" y="460">calls out through</text>

  <rect class="main" x="20" y="472" width="360" height="40" rx="10"/>
  <text class="h" x="36" y="497">The main image's far-call entries</text>

  <text class="p" x="20" y="548">The engine and a map meet only at these</text>
  <text class="p" x="20" y="567">two tables, each in a fixed order.</text>
</svg>
