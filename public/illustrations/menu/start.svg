<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Start closes a screen from any depth</title>
  <desc id="desc">On the Psynergy screen, loops sit inside one another: the screen runs its steps in a loop, and the step that asks whom to use the Psynergy on runs a loop of its own, waiting for a button. A small watcher runs every frame beside the screen. When Start is pressed it plays the cancel sound and raises a flag. Every loop checks that flag beside its own buttons and, seeing it, returns as if cancelled, the innermost first, so the loops unwind one after another and the screen closes back to the icons without any of them knowing how deep the player was.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-exit { fill: none; stroke: #c2410c; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .head-exit { fill: #c2410c; }
    .dot { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .h2 { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .kx { fill: #fb8b5e; }
      .wire { stroke: #5c5c5c; }
      .wire-exit { stroke: #fb8b5e; }
      .head { fill: #5c5c5c; }
      .dot { fill: #3b8eff; }
      .head-exit { fill: #fb8b5e; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="32">LOOPS INSIDE LOOPS ON THE PSYNERGY SCREEN</text>

  <!-- nested loops -->
  <rect class="card" x="20" y="46" width="250" height="250" rx="14"/>
  <text class="h2" x="36" y="72">The Psynergy screen</text>
  <rect class="card" x="40" y="88" width="210" height="190" rx="12"/>
  <text class="h2" x="56" y="114">Its steps, in turn</text>
  <rect class="card-accent" x="60" y="130" width="170" height="130" rx="10"/>
  <text class="h2" x="76" y="156">Use it on whom?</text>
  <text class="small" x="76" y="178">waiting for a button</text>
  <circle class="dot" cx="145" cy="210" r="6"/>

  <!-- the watcher -->
  <rect class="chip-exit" x="290" y="46" width="90" height="96" rx="10"/>
  <text class="kx" x="335" y="72" text-anchor="middle">Watcher</text>
  <text class="small" x="335" y="92" text-anchor="middle">every frame:</text>
  <text class="small" x="335" y="108" text-anchor="middle">Start? Then</text>
  <text class="small" x="335" y="124" text-anchor="middle">raise a flag</text>
  <rect class="chip-exit" x="290" y="168" width="90" height="34" rx="17"/>
  <text class="kx" x="335" y="190" text-anchor="middle">flag up</text>
  <path class="wire-exit" d="M 335 142 V 162"/>
  <path class="head-exit" d="M 329 158 h 12 l -6 9 z"/>

  <!-- unwinding -->
  <path class="wire-exit" d="M 230 238 H 282"/>
  <path class="wire-exit" d="M 250 270 H 282"/>
  <path class="wire-exit" d="M 270 290 H 282"/>
  <path class="wire-exit" d="M 282 202 V 290"/>
  <text class="kx" x="146" y="250" text-anchor="middle">the chooser returns</text>
  <text class="kx" x="146" y="272" text-anchor="middle">the steps stop</text>
  <text class="kx" x="146" y="292" text-anchor="middle">the screen closes</text>

  <!-- result -->
  <path class="wire" d="M 145 296 V 330"/>
  <path class="head" d="M 139 326 h 12 l -6 9 z"/>
  <rect class="card-exit" x="20" y="338" width="360" height="58" rx="12"/>
  <text class="h2" x="36" y="364">Back to the icons</text>
  <text class="small" x="36" y="382">as if the player had backed out</text>

  <!-- the rule -->
  <text class="p" x="20" y="430">Every loop checks the flag beside its own</text>
  <text class="p" x="20" y="449">buttons, so they unwind one after another,</text>
  <text class="p" x="20" y="468">the innermost first, without knowing how</text>
  <text class="p" x="20" y="487">deep the player was.</text>
  <text class="code" x="380" y="508" text-anchor="end">FLAG_MENU_START_PRESSED</text>
</svg>
