<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">Start closes a screen from any depth</title>
  <desc id="desc">On the Psynergy screen, loops sit inside one another: the screen runs its steps in a loop, and the step that asks whom to use the Psynergy on runs a loop of its own, waiting for a button. A small watcher runs every frame beside the screen. When Start is pressed it plays the cancel sound and raises a flag. Every loop checks that flag beside its own buttons and, seeing it, returns as if cancelled, the innermost first: 1, the chooser returns; 2, the steps stop; 3, the screen closes. So the loops unwind one after another and the screen closes back to the icons without any of them knowing how deep the player was.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .badge { fill: #c2410c; }
    .bn { fill: #ffffff; font: 700 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-exit { fill: none; stroke: #c2410c; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .head { fill: #a3a3a3; }
    .head-exit { fill: #c2410c; }
    .dot { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .badge { fill: #fb8b5e; }
      .bn { fill: #0a0a0a; }
      .h2 { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .kx { fill: #fb8b5e; }
      .wire { stroke: #5c5c5c; }
      .wire-exit { stroke: #fb8b5e; }
      .head { fill: #5c5c5c; }
      .dot { fill: #3b8eff; }
      .head-exit { fill: #fb8b5e; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="599" rx="16"/>
  <text class="eyebrow" x="20" y="32">LOOPS INSIDE LOOPS ON THE PSYNERGY SCREEN</text>

  <!-- nested loops, each with its number in its own corner -->
  <rect class="card" x="20" y="46" width="250" height="262" rx="14"/>
  <text class="h2" x="36" y="72">The Psynergy screen</text>
  <rect class="card" x="40" y="88" width="210" height="190" rx="12"/>
  <text class="h2" x="56" y="114">Its steps, in turn</text>
  <rect class="card-accent" x="60" y="130" width="170" height="112" rx="10"/>
  <text class="h2" x="76" y="156">Use it on whom?</text>
  <text class="small" x="76" y="178">waiting for a button</text>
  <circle class="dot" cx="145" cy="206" r="6"/>
  <circle class="badge" cx="212" cy="224" r="10"/><text class="bn" x="212" y="228.5" text-anchor="middle">1</text>
  <circle class="badge" cx="232" cy="260" r="10"/><text class="bn" x="232" y="264.5" text-anchor="middle">2</text>
  <circle class="badge" cx="252" cy="290" r="10"/><text class="bn" x="252" y="294.5" text-anchor="middle">3</text>

  <!-- the watcher -->
  <rect class="chip-exit" x="290" y="46" width="90" height="96" rx="10"/>
  <text class="kx" x="335" y="72" text-anchor="middle">Watcher</text>
  <text class="small" x="335" y="92" text-anchor="middle">every frame:</text>
  <text class="small" x="335" y="108" text-anchor="middle">Start? Then</text>
  <text class="small" x="335" y="124" text-anchor="middle">raise a flag</text>
  <path class="wire" d="M 335 142 V 160"/>
  <path class="head" d="M 329 156 h 12 l -6 9 z"/>
  <rect class="chip-exit" x="290" y="168" width="90" height="34" rx="17"/>
  <text class="kx" x="335" y="190" text-anchor="middle">flag up</text>
  <text class="small" x="335" y="224" text-anchor="middle">every loop</text>
  <text class="small" x="335" y="240" text-anchor="middle">checks it</text>

  <!-- unwinding, innermost first -->
  <text class="eyebrow" x="20" y="340">SEEING THE FLAG, INNERMOST FIRST</text>
  <circle class="badge" cx="30" cy="361" r="10"/><text class="bn" x="30" y="365.5" text-anchor="middle">1</text>
  <text class="p" x="48" y="366">the chooser returns, as if cancelled</text>
  <circle class="badge" cx="30" cy="389" r="10"/><text class="bn" x="30" y="393.5" text-anchor="middle">2</text>
  <text class="p" x="48" y="394">the screen's steps stop</text>
  <circle class="badge" cx="30" cy="417" r="10"/><text class="bn" x="30" y="421.5" text-anchor="middle">3</text>
  <text class="p" x="48" y="422">the screen closes</text>

  <!-- result -->
  <rect class="card-exit" x="20" y="442" width="360" height="58" rx="12"/>
  <text class="h2" x="36" y="468">Back to the icons</text>
  <text class="small" x="36" y="487">as if the player had backed out</text>

  <!-- the rule -->
  <text class="p" x="20" y="530">The loops unwind one after another without</text>
  <text class="p" x="20" y="549">any of them knowing how deep the player was.</text>
  <text class="code" x="380" y="584" text-anchor="end">FLAG_MENU_START_PRESSED</text>
</svg>
