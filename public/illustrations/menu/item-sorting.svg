<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 498" role="img" aria-labelledby="title desc">
  <title id="title">Four ways to sort a bag</title>
  <desc id="desc">Isaac's eleven items as he holds them, and after each of four presses of A with L held on the Item screen's member row. Each press sorts the bag by the next of four orders. First: the four things he wears, then the items that are not equipment (Antidote, Nut, Herb), then the rest. Second: what he wears, then the other equipment, then the Orb of Force and the items. Third: equipment first, by kind, weapons, helms, shields and armor, then the rest. Fourth: the items that are not equipment first.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .f0 { fill: #d97706; }
    .f1 { fill: #16a34a; }
    .f2 { fill: #7c3aed; }
    .f3 { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .f0 { fill: #b45309; }
      .f1 { fill: #15803d; }
      .f2 { fill: #6d28d9; }
      .f3 { fill: #1d5fc4; }
    }
  </style>
