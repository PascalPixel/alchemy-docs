<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 628" role="img" aria-labelledby="title desc">
  <title id="title">From the field menu to a screen and back</title>
  <desc id="desc">In the game, before the first Djinni joins: three icons, Psynergy, Item and Status, the chosen one raised with its name beside it. The field menu is a row of icons: Psynergy, Djinn, Item and Status, with the Djinn icon left out until the first Djinni joins. Choosing one opens that screen, which runs its own steps a frame at a time. Backing out of a screen, or pressing Start, brings the icons back, and the Djinn screen always comes back to them. Choosing Psynergy or an item meant for the field closes the menu instead, and the field uses it, as Move pushes a stone pillar. Backing out of the icons returns to walking.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .px { image-rendering: pixelated; }
    .edge { fill: none; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .dot-grey { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .edge { stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k { fill: #66a6ff; }
      .wire { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head, .dot-grey { fill: #5c5c5c; }
      .head-accent, .dot { fill: #3b8eff; }
    }
    /* render guide menus: menus.gif frames 13 to 83, cropped 152x30+60+132 */
    .icons { transform: translateY(-1020px); animation: icons 2.67s step-end infinite; }
    @keyframes icons { 0.00% { transform: translateY(0px); } 1.50% { transform: translateY(-60px); } 2.62% { transform: translateY(-120px); } 3.75% { transform: translateY(-180px); } 5.24% { transform: translateY(-240px); } 6.37% { transform: translateY(-300px); } 7.49% { transform: translateY(-360px); } 8.99% { transform: translateY(-420px); } 10.11% { transform: translateY(-480px); } 11.24% { transform: translateY(-540px); } 12.73% { transform: translateY(-600px); } 13.86% { transform: translateY(-660px); } 14.98% { transform: translateY(-720px); } 16.48% { transform: translateY(-780px); } 17.60% { transform: translateY(-840px); } 18.73% { transform: translateY(-900px); } 20.22% { transform: translateY(-960px); } 21.35% { transform: translateY(-1020px); } 22.47% { transform: translateY(-1080px); } 23.97% { transform: translateY(-1140px); } 25.09% { transform: translateY(-1200px); } 26.22% { transform: translateY(-1260px); } 27.72% { transform: translateY(-1320px); } 28.84% { transform: translateY(-1380px); } 29.96% { transform: translateY(-1440px); } 31.46% { transform: translateY(-1500px); } 32.58% { transform: translateY(-1560px); } 33.71% { transform: translateY(-1620px); } 35.21% { transform: translateY(-1680px); } 36.33% { transform: translateY(-1740px); } 37.45% { transform: translateY(-1800px); } 38.95% { transform: translateY(-1860px); } 40.07% { transform: translateY(-1920px); } 41.20% { transform: translateY(-1980px); } 42.70% { transform: translateY(-2040px); } 43.82% { transform: translateY(-2100px); } 44.94% { transform: translateY(-2160px); } 46.44% { transform: translateY(-2220px); } 47.57% { transform: translateY(-2280px); } 48.69% { transform: translateY(-2340px); } 50.19% { transform: translateY(-2400px); } 51.31% { transform: translateY(-2460px); } 52.43% { transform: translateY(-2520px); } 53.93% { transform: translateY(-2580px); } 55.06% { transform: translateY(-2640px); } 56.18% { transform: translateY(-2700px); } 57.68% { transform: translateY(-2760px); } 58.80% { transform: translateY(-2820px); } 59.93% { transform: translateY(-2880px); } 61.42% { transform: translateY(-2940px); } 62.55% { transform: translateY(-3000px); } 63.67% { transform: translateY(-3060px); } 65.17% { transform: translateY(-3120px); } 66.29% { transform: translateY(-3180px); } 67.42% { transform: translateY(-3240px); } 68.91% { transform: translateY(-3300px); } 70.04% { transform: translateY(-3360px); } 71.16% { transform: translateY(-3420px); } 72.66% { transform: translateY(-3480px); } 73.78% { transform: translateY(-3540px); } 74.91% { transform: translateY(-3600px); } 76.40% { transform: translateY(-3660px); } 77.53% { transform: translateY(-3720px); } 80.15% { transform: translateY(-3780px); } 82.40% { transform: translateY(-3840px); } 85.02% { transform: translateY(-3900px); } 87.64% { transform: translateY(-3960px); } 89.89% { transform: translateY(-4020px); } 92.51% { transform: translateY(-4080px); } 95.13% { transform: translateY(-4140px); } 97.38% { transform: translateY(-4200px); } 100% { transform: translateY(-4200px); } }
    @media (prefers-reduced-motion: reduce) { .icons { animation: none; } }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="627" rx="16"/>
  <text class="eyebrow" x="60" y="32">THE FIELD MENU</text>

  <!-- the icons -->
  <rect class="card-accent" x="60" y="44" width="320" height="172" rx="12"/>
  <text class="h" x="80" y="72">A row of icons</text>
    <svg x="68" y="84" width="304" height="60" viewBox="0 0 304 60" overflow="hidden">
    <image href="data:image/png;base64," class="px icons" data-crop="crops/menu/field-menu-icons.png" width="304" height="4260" preserveAspectRatio="none"/>
  </svg>
  <g transform="translate(0 68)">
  <rect class="chip" x="76" y="86" width="78" height="28" rx="14"/>
  <text class="k" x="115" y="105" text-anchor="middle">Psynergy</text>
  <rect class="chip-wait" x="160" y="86" width="60" height="28" rx="14" stroke-dasharray="3 3"/>
  <text class="kw" x="190" y="105" text-anchor="middle">Djinn</text>
  <rect class="chip" x="226" y="86" width="56" height="28" rx="14"/>
  <text class="k" x="254" y="105" text-anchor="middle">Item</text>
  <rect class="chip" x="288" y="86" width="72" height="28" rx="14"/>
  <text class="k" x="324" y="105" text-anchor="middle">Status</text>
  <text class="small" x="80" y="136">Djinn shows once the first Djinni joins.</text>
  </g>
  <g transform="translate(0 68)">

  <!-- to a screen -->
  <path class="wire" d="M 220 148 V 186"/>
  <path class="head" d="M 214 182 h 12 l -6 9 z"/>
  <text class="label" x="232" y="172">one is chosen</text>

  <!-- the screen -->
  <rect class="card" x="60" y="194" width="320" height="104" rx="12"/>
  <text class="h" x="80" y="222">Its screen opens</text>
  <text class="p" x="80" y="246">The field holds still behind it. The</text>
  <text class="p" x="80" y="265">screen works through its own steps.</text>
  <text class="code" x="80" y="287">PsynergyMenu_Run and the others</text>

  <!-- back to the icons -->
  <path class="wire-accent" d="M 60 246 H 30 V 96 H 54"/>
  <path class="head-accent" d="M 51 90 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 172) rotate(-90)" text-anchor="middle">back out or Start</text>

  <!-- to the field -->
  <path class="wire" d="M 220 298 V 336"/>
  <path class="head" d="M 214 332 h 12 l -6 9 z"/>
  <text class="label" x="232" y="316">Psynergy or an item</text>
  <text class="label" x="232" y="331">meant for the field</text>
  <rect class="card-exit" x="60" y="344" width="320" height="86" rx="12"/>
  <text class="h" x="80" y="372">The menu closes</text>
  <text class="p" x="80" y="396">and the field uses it: Move pushes</text>
  <text class="p" x="80" y="415">the stone pillar the leader faces.</text>

  <!-- notes -->
  <circle class="dot" cx="66" cy="462" r="4"/>
  <text class="p" x="78" y="467">The Djinn screen always comes back to</text>
  <text class="p" x="78" y="485">the icons.</text>
  <circle class="dot-grey" cx="66" cy="510" r="4"/>
  <text class="p" x="78" y="515">Backing out of the icons: walking again.</text>
  </g>
  <text class="code" x="380" y="32" text-anchor="end">Menu_RunTopSelection</text>
</svg>
