<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 452" role="img" aria-labelledby="title desc">
  <title id="title">One panel, five lower halves</title>
  <desc id="desc">The member panel on the Item and Psynergy screens always shows the member's portrait, name and level at the top; the screen chooses what fills the lower half. Choosing a member: class, HP, PP and experience. With R held: Attack, Defense, Agility and Luck. With the hand on equipment: the stats it would change, here Attack falling from 121 to 90 with a Long Sword. With the hand on an item that teaches Psynergy: "Force, Will learn" for the Orb of Force. A fifth kind, class, HP and PP alone, is never asked for.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .frame { fill: none; stroke: #d4d4d4; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .frame { stroke: #333333; }
      .h2 { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="451" rx="16"/>
  <text class="eyebrow" x="20" y="32">ISAAC'S PANEL: THE TOP STAYS, THE BOTTOM CHANGES</text>

  <image href="data:image/png;base64," x="20" y="48" width="104" height="96" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="48" width="104" height="96"/>
  <text class="h2" x="20" y="164">Choosing who</text>
  <text class="small" x="20" y="180">HP, PP, exp</text>

  <image href="data:image/png;base64," x="148" y="48" width="104" height="96" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="148" y="48" width="104" height="96"/>
  <text class="h2" x="148" y="164">R held</text>
  <text class="small" x="148" y="180">the four stats</text>

  <image href="data:image/png;base64," x="276" y="48" width="104" height="96" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="276" y="48" width="104" height="96"/>
  <text class="h2" x="276" y="164">On equipment</text>
  <text class="small" x="276" y="180">what it changes</text>

  <image href="data:image/png;base64," x="20" y="204" width="104" height="96" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="204" width="104" height="96"/>
  <text class="h2" x="20" y="320">On an Orb</text>
  <text class="small" x="20" y="336">what it teaches</text>

  <image href="data:image/png;base64," x="148" y="204" width="104" height="96" style="image-rendering: pixelated" preserveAspectRatio="none" opacity="0.55"/>
  <rect class="frame" x="148" y="204" width="104" height="96" stroke-dasharray="4 4"/>
  <text class="h2" x="148" y="320">Never asked for</text>
  <text class="small" x="148" y="336">class, HP, PP</text>

  <text class="p" x="20" y="376">To show a change, the panel puts the item on</text>
  <text class="p" x="20" y="395">for a moment, reads the stats, and puts the</text>
  <text class="p" x="20" y="414">member back as they were.</text>
  <text class="code" x="380" y="440" text-anchor="end">Menu_DrawOwnerStatusPanel</text>
</svg>
