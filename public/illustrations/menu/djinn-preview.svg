<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">The Djinn screen shows a change before making it</title>
  <desc id="desc">The Djinn screen in Xian, about to put Isaac's Djinni Flint on standby. It asks "Is this OK?" and shows Isaac as he would be: his class from Knight to Squire, HP from 178 to 141, PP from 61 to 51, Attack from 121 to 107, Defense from 80 to 73 and Agility from 69 to 63, his Luck and his Psynergy unchanged. Nothing has changed yet: Isaac stays as he was until A confirms it.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .frame { fill: none; stroke: #d4d4d4; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .frame { stroke: #333333; }
      .p, .kw { fill: #a1a1a1; }
      .small, .eyebrow { fill: #7c7c7c; }
      .k { fill: #66a6ff; }
      .wire { stroke: #5c5c5c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="469" rx="16"/>
  <text class="eyebrow" x="20" y="32">FLINT TO STANDBY: IS THIS OK?</text>

  <image href="data:image/png;base64," x="20" y="44" width="360" height="60" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="44" width="360" height="60"/>

  <image href="data:image/png;base64," x="20" y="116" width="180" height="180" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="116" width="180" height="180"/>

  <text class="eyebrow" x="216" y="134">AS HE WOULD BE</text>
  <text class="p" x="216" y="158">Knight</text><text class="k" x="380" y="158" text-anchor="end">Squire</text>
  <text class="p" x="216" y="182">HP 178</text><text class="k" x="380" y="182" text-anchor="end">141</text>
  <text class="p" x="216" y="206">PP 61</text><text class="k" x="380" y="206" text-anchor="end">51</text>
  <text class="p" x="216" y="230">Attack 121</text><text class="k" x="380" y="230" text-anchor="end">107</text>
  <text class="p" x="216" y="254">Defense 80</text><text class="k" x="380" y="254" text-anchor="end">73</text>
  <text class="p" x="216" y="278">Agility 69</text><text class="k" x="380" y="278" text-anchor="end">63</text>
  <path class="wire" d="M 300 154 H 330 M 300 178 H 340 M 300 202 H 350 M 306 226 H 344 M 306 250 H 350 M 306 274 H 350" stroke-dasharray="2 3"/>

  <!-- the rule -->
  <rect class="card" x="20" y="316" width="360" height="104" rx="12"/>
  <rect class="chip-wait" x="36" y="330" width="110" height="28" rx="14"/>
  <text class="kw" x="91" y="349" text-anchor="middle">While it asks</text>
  <text class="p" x="158" y="349">Isaac is as he was</text>
  <rect class="chip" x="36" y="370" width="110" height="28" rx="14"/>
  <text class="k" x="91" y="389" text-anchor="middle">A</text>
  <text class="p" x="158" y="389">only now is the change made</text>
  <text class="small" x="20" y="446">Setting, giving and trading a Djinni are previewed the same way.</text>
</svg>
