<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 456" role="img" aria-labelledby="title desc">
  <title id="title">One block, taken in turns</title>
  <desc id="desc">The menu screens and the shop counters share one block of memory, 2,672 bytes. Whichever is open takes the block as it opens and gives it back as it closes, and reads it in its own way: the Item screen as its windows and the items listed, the Psynergy screen as the Psynergy listed, a shop as its stock and cursor. Over time the block passes from one to the next, never held by two at once, which is why a shop and the field menu are never open together.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .fill-soft { fill: #f5f5f5; }
    .h { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-exit { fill: none; stroke: #c2410c; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .head { fill: #a3a3a3; }
    .dot { fill: #0a72ef; }
    .dot-no { fill: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .fill-soft { fill: #1a1a1a; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .k { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .wire-exit { stroke: #fb8b5e; }
      .head { fill: #5c5c5c; }
      .dot { fill: #3b8eff; }
      .dot-no { fill: #f05252; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="455" rx="16"/>
  <text class="eyebrow" x="20" y="32">THE MENU WORK, OVER TIME</text>

  <!-- the block -->
  <rect class="card-accent" x="20" y="46" width="360" height="72" rx="12"/>
  <text class="h" x="36" y="74">One block of memory</text>
  <text class="small" x="36" y="96">2,672 bytes, for whichever screen is open</text>

  <!-- time line -->
  <path class="wire" d="M 20 236 H 372"/>
  <path class="head" d="M 370 230 v 12 l 9 -6 z"/>
  <text class="small" x="380" y="260" text-anchor="end">time</text>

  <!-- turns -->
  <rect class="chip" x="20" y="150" width="96" height="70" rx="8"/>
  <text class="k" x="68" y="176" text-anchor="middle">Item</text>
  <text class="k" x="68" y="192" text-anchor="middle">screen</text>
  <text class="small" x="68" y="210" text-anchor="middle">items listed</text>
  <path class="wire-accent" d="M 68 220 V 236"/>

  <rect class="fill-soft" x="122" y="150" width="24" height="70" rx="6"/>
  <text class="small" transform="translate(138 186) rotate(-90)" text-anchor="middle">free</text>

  <rect class="chip" x="152" y="150" width="96" height="70" rx="8"/>
  <text class="k" x="200" y="176" text-anchor="middle">Psynergy</text>
  <text class="k" x="200" y="192" text-anchor="middle">screen</text>
  <text class="small" x="200" y="210" text-anchor="middle">Psynergy listed</text>
  <path class="wire-accent" d="M 200 220 V 236"/>

  <rect class="fill-soft" x="254" y="150" width="24" height="70" rx="6"/>
  <text class="small" transform="translate(270 186) rotate(-90)" text-anchor="middle">free</text>

  <rect class="chip-exit" x="284" y="150" width="96" height="70" rx="8"/>
  <text class="kx" x="332" y="176" text-anchor="middle">a shop</text>
  <text class="kx" x="332" y="192" text-anchor="middle">counter</text>
  <text class="small" x="332" y="210" text-anchor="middle">stock, cursor</text>
  <path class="wire-exit" d="M 332 220 V 236"/>

  <path class="wire-dash" d="M 68 150 V 118 M 200 150 V 118 M 332 150 V 118"/>

  <!-- the rule -->
  <circle class="dot" cx="26" cy="300" r="4"/>
  <text class="p" x="38" y="305">Each takes the block as it opens and</text>
  <text class="p" x="38" y="323">gives it back as it closes.</text>
  <circle class="dot" cx="26" cy="348" r="4"/>
  <text class="p" x="38" y="353">Each reads it its own way.</text>
  <circle class="dot-no" cx="26" cy="378" r="4"/>
  <text class="p" x="38" y="383">Never two at once: a shop and the field</text>
  <text class="p" x="38" y="401">menu are never open together.</text>
  <text class="code" x="380" y="440" text-anchor="end">HEAP_SLOT_MENU, gMenuWork</text>
</svg>
