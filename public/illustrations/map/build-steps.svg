<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 576" role="img" aria-labelledby="title desc">
  <title id="title">From a table to the game's bytes</title>
  <desc id="desc">How the build turns one of a layout's tables into what the game reads, using Suhalla Desert's shapes as the example. The file shapes.tsv is a table anyone can edit, one shape a row: its kind and three heights. The build tool writes the bytes the game reads, shapes.table, one record a row. Then it packs them, shapes.table.lz, exactly as Camelot's packer did, so the packed bytes are the same as on the cartridge. Last, the layout's layout.s places them behind its header. The name of each file says what to make: the table's name, then its form, then the packing.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .rule { stroke: #ededed; stroke-width: 1; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .n0 { fill: #0a72ef; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n1 { fill: #d97706; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n2 { fill: #7c3aed; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d0 { fill: #0a72ef; } .d1 { fill: #d97706; } .d2 { fill: #7c3aed; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { fill: #525252; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hex { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .rule { stroke: #1f1f1f; }
      .wire { stroke: #5c5c5c; } .head { fill: #5c5c5c; }
      .n0 { fill: #66a6ff; } .n1 { fill: #f59e0b; } .n2 { fill: #a78bfa; }
      .d0 { fill: #3b8eff; } .d1 { fill: #f59e0b; } .d2 { fill: #a78bfa; }
      .h2 { fill: #ededed; }
      .p, .s, .mono { fill: #a1a1a1; }
      .small, .hex, .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="575" rx="16"/>
  <text class="eyebrow" x="20" y="32">HOW A LAYOUT'S SHAPES ARE BUILT</text>

  <!-- The file name, coloured by part -->
  <text x="200" y="66" text-anchor="middle"><tspan class="n0">shapes</tspan><tspan class="n1">.table</tspan><tspan class="n2">.lz</tspan></text>
  <circle class="d0" cx="62" cy="88" r="4"/><text class="small" x="70" y="92">which table</text>
  <circle class="d1" cx="166" cy="88" r="4"/><text class="small" x="174" y="92">what to make</text>
  <circle class="d2" cx="272" cy="88" r="4"/><text class="small" x="280" y="92">how to pack</text>

  <!-- 1: the table -->
  <rect class="card" x="20" y="108" width="360" height="96" rx="12"/>
  <text class="n0" x="36" y="132">shapes.tsv</text>
  <text class="s" x="364" y="132" text-anchor="end">a table to edit</text>
  <text class="mono" y="156"><tspan x="36">shape</tspan><tspan x="110">height0</tspan><tspan x="190">height1</tspan><tspan x="270">height2</tspan></text>
  <path class="rule" d="M 36 163 H 364"/>
  <text class="mono" y="180"><tspan x="36">0</tspan><tspan x="110">4</tspan><tspan x="190">0</tspan><tspan x="270">0</tspan></text>
  <text class="mono" y="196"><tspan x="36">0</tspan><tspan x="110">0</tspan><tspan x="190">0</tspan><tspan x="270">0</tspan></text>

  <path class="wire" d="M 200 208 V 226"/><path class="head" d="M 194 224 L 200 234 L 206 224 Z"/>
  <text class="small" x="212" y="226">the build tool writes each row</text>

  <!-- 2: the bytes -->
  <rect class="card" x="20" y="240" width="360" height="72" rx="12"/>
  <text class="n1" x="36" y="264">shapes.table</text>
  <text class="s" x="364" y="264" text-anchor="end">the bytes the game reads</text>
  <text class="hex" x="36" y="294">00 04 00 00  00 00 00 00  …</text>

  <path class="wire" d="M 200 316 V 334"/><path class="head" d="M 194 332 L 200 342 L 206 332 Z"/>
  <text class="small" x="212" y="334">packed as Camelot's packer did</text>

  <!-- 3: packed -->
  <rect class="card" x="20" y="348" width="360" height="72" rx="12"/>
  <text class="n2" x="36" y="372">shapes.table.lz</text>
  <text class="s" x="364" y="372" text-anchor="end">smaller, for the cartridge</text>
  <text class="small" x="36" y="402">must come out the same, byte for byte</text>

  <path class="wire" d="M 200 424 V 442"/><path class="head" d="M 194 440 L 200 450 L 206 440 Z"/>
  <text class="small" x="212" y="442">placed by its layout.s</text>

  <!-- 4: in the map -->
  <rect class="card" x="20" y="456" width="360" height="48" rx="12"/>
  <text class="h2" x="36" y="486">In the game, behind the layout's header</text>

  <text class="small" x="20" y="528">The other parts are built alike, but the</text>
  <text class="small" x="20" y="544">markers are left unpacked.</text>
  <text class="code" x="380" y="564" text-anchor="end">ags-graphics</text>
</svg>
