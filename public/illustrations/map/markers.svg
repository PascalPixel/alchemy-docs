<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">Where chests can stand</title>
  <desc id="desc">Two scenes on Crossbone Isle, CrossboneIsleKeys and CrossboneIsleBane, use the same map, and the map lists eight spots where a chest can stand, each with the event that would place one there. CrossboneIsleKeys has events for four of them, in a row along the room's north side: 333 coins, a Fairy Ring, a Cookie and a Smoke Bomb. CrossboneIsleBane has events for the other four: 666 coins and an Elixir on its raised floor, a Water of Life below them, and the Demon Axe, whose chest is carried on a stone pillar. A spot a scene has no event for stays empty.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .spot { fill: none; stroke: #c4c4c4; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .chest { fill: #b7791f; stroke: #7c4a03; stroke-width: 1.2; }
    .lid { stroke: #7c4a03; stroke-width: 1.2; }
    .lead { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .item { fill: #0a0a0a; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .scene { fill: #0a72ef; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .spot { stroke: #4a4a4a; }
      .chest { fill: #a16207; stroke: #fbbf24; }
      .lid { stroke: #fbbf24; }
      .lead { stroke: #5c5c5c; }
      .item, .h2 { fill: #ededed; }
      .scene { fill: #66a6ff; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>
  <defs>
    <g id="chest"><rect class="chest" x="-7" y="-6" width="14" height="11" rx="2"/><path class="lid" d="M -7 -1.5 H 7"/></g>
    <circle id="spot" class="spot" r="6"/>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="399" height="559" rx="16"/>
  <text class="eyebrow" x="20" y="32">CROSSBONE ISLE: ONE MAP, TWO SCENES</text>

  <!-- Spots: cell (x, z) at 20 + (x - 10.5) * 7.5, top + (z - 32.5) * 7.5 -->
  <!-- Panel 1, top 48: CrossboneIsleKeys uses 100 to 103 -->
  <rect class="card" x="20" y="48" width="360" height="212" rx="12"/>
  <text class="scene" x="36" y="72">CrossboneIsleKeys</text>
  <use href="#chest" x="38.8" y="99.3"/>
  <use href="#chest" x="68.8" y="99.3"/>
  <use href="#chest" x="98.8" y="99.3"/>
  <use href="#chest" x="128.8" y="99.3"/>
  <use href="#spot" x="241.3" y="166.8"/>
  <use href="#spot" x="308.8" y="166.8"/>
  <use href="#spot" x="278.8" y="211.8"/>
  <use href="#spot" x="356" y="84.3"/>
  <path class="lead" d="M 38.8 108 L 44 150 M 68.8 108 L 92 178 M 98.8 108 L 140 150 M 128.8 108 L 190 178"/>
  <text class="item" x="44" y="164" text-anchor="middle">333 coins</text>
  <text class="item" x="92" y="192" text-anchor="middle">Fairy Ring</text>
  <text class="item" x="140" y="164" text-anchor="middle">Cookie</text>
  <text class="item" x="190" y="192" text-anchor="middle">Smoke Bomb</text>
  <text class="small" x="364" y="246" text-anchor="end">four spots left empty</text>

  <!-- Panel 2, top 272: CrossboneIsleBane uses 104 to 107 -->
  <rect class="card" x="20" y="272" width="360" height="212" rx="12"/>
  <text class="scene" x="36" y="296">CrossboneIsleBane</text>
  <use href="#spot" x="38.8" y="323.3"/>
  <use href="#spot" x="68.8" y="323.3"/>
  <use href="#spot" x="98.8" y="323.3"/>
  <use href="#spot" x="128.8" y="323.3"/>
  <use href="#chest" x="241.3" y="390.8"/>
  <use href="#chest" x="308.8" y="390.8"/>
  <use href="#chest" x="278.8" y="435.8"/>
  <use href="#chest" x="356" y="308.3"/>
  <text class="item" x="241.3" y="374" text-anchor="middle">666 coins</text>
  <text class="item" x="320" y="374" text-anchor="middle">Elixir</text>
  <text class="item" x="278.8" y="466" text-anchor="middle">Water of Life</text>
  <text class="item" x="364" y="336" text-anchor="end">Demon Axe</text>
  <text class="small" x="364" y="352" text-anchor="end">carried on a stone pillar</text>
  <text class="small" x="36" y="466">four spots left empty</text>

  <text class="p" x="20" y="512">The map lists the spots, each with an event;</text>
  <text class="p" x="20" y="531">a scene puts a chest only where it has one.</text>
  <text class="code" x="380" y="550" text-anchor="end">Field_PlaceMapMarkers</text>
</svg>
