<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 432" role="img" aria-labelledby="title desc">
  <title id="title">How high a step can go</title>
  <desc id="desc">The ground seen from the side, with the leader, Isaac, standing on it at the same scale. A band around the leader's feet reaches 8 pixels up and 12 pixels down. Ground ahead whose height falls inside the band can be stepped onto: a ledge 8 pixels up and a dip 8 pixels down. Ground outside it blocks the leader as a wall would: a rim 32 pixels high, like the ones at the foot of Goma Cave's cliffs, and a drop of 16 pixels. Each cell is 16 pixels wide.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .earth { fill: #ececec; }
    .band { fill: #0a72ef; fill-opacity: 0.08; }
    .band-edge { stroke: #0a72ef; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .ok { stroke: #16a34a; stroke-width: 4; stroke-linecap: round; fill: none; }
    .no { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; fill: none; }
    .riser { stroke: #a3a3a3; stroke-width: 1.5; fill: none; }
    .cell { stroke: #d4d4d4; stroke-width: 1; }
    .px { image-rendering: pixelated; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag-ok { fill: #15803d; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag-no { fill: #b91c1c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tag { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .dot-ok { fill: #16a34a; }
    .dot-no { fill: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .earth { fill: #1c1c1c; }
      .band { fill: #3b8eff; fill-opacity: 0.14; }
      .band-edge { stroke: #3b8eff; }
      .ok { stroke: #22c55e; }
      .no { stroke: #f05252; }
      .riser { stroke: #5c5c5c; }
      .cell { stroke: #333333; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .tag-ok { fill: #4ade80; }
      .tag-no { fill: #f87171; }
      .tag { fill: #66a6ff; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .dot-ok { fill: #22c55e; }
      .dot-no { fill: #f05252; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="431" rx="16"/>
  <text class="eyebrow" x="20" y="34">SEEN FROM THE SIDE</text>

  <!-- 3 svg units = 1 game pixel; a cell (16 px) is 48 units wide.
       Floor at y 230: +32 at 134, +8 at 206, -8 at 254, -16 at 278.
       The band: +8 (y 206) to -12 (y 266). -->

  <!-- the earth under the profile -->
  <path class="earth" d="M 20 278 H 68 V 254 H 116 V 230 H 260 V 206 H 308 V 134 H 380 V 320 H 20 Z"/>
  <!-- cell lines -->
  <path class="cell" d="M 164 300 V 320 M 212 300 V 320 M 260 300 V 320 M 308 300 V 320 M 356 300 V 320"/>
  <text class="small" x="188" y="350" text-anchor="middle">one cell: 16 px</text>
  <path class="riser" d="M 212 328 V 334 H 164 V 328"/>

  <!-- the band a step may land in -->
  <rect class="band" x="20" y="206" width="360" height="60"/>
  <path class="band-edge" d="M 20 206 H 380 M 20 266 H 380"/>
  <text class="tag" x="26" y="200">8 px up</text>
  <text class="tag" x="188" y="282" text-anchor="middle">12 px down</text>

  <!-- the risers -->
  <path class="riser" d="M 68 278 V 254 M 116 254 V 230 M 260 230 V 206 M 308 206 V 134"/>

  <!-- the tops, coloured by whether the leader can step there -->
  <path class="no" d="M 22 278 H 66"/>
  <path class="ok" d="M 70 254 H 114"/>
  <path class="ok" d="M 118 230 H 258"/>
  <path class="ok" d="M 262 206 H 306"/>
  <path class="no" d="M 310 134 H 378"/>

  <!-- the leader: Isaac's field sprite facing east, from render guide
       moment in Vale, at the same 3 units a pixel, his feet on the floor -->
  <image href="data:image/png;base64," class="px" data-crop="crops/field/isaac-facing-east.png" x="167" y="134" width="42" height="96"/>

  <!-- tags -->
  <text class="tag-no" x="344" y="124" text-anchor="middle">too high</text>
  <text class="small" x="344" y="110" text-anchor="middle">32 px rim</text>
  <text class="tag-ok" x="284" y="196" text-anchor="middle">up 8</text>
  <text class="tag-ok" x="92" y="244" text-anchor="middle">down 8</text>
  <text class="tag-no" x="44" y="296" text-anchor="middle">too low</text>
  <text class="small" x="44" y="312" text-anchor="middle">down 16</text>

  <!-- the rule -->
  <circle class="dot-ok" cx="26" cy="380" r="5"/>
  <text class="p" x="38" y="385">Within 8 px up or 12 px down: a step.</text>
  <circle class="dot-no" cx="26" cy="404" r="5"/>
  <text class="p" x="38" y="409">Further: blocked, as surely as a wall.</text>
  <text class="code" x="380" y="34" text-anchor="end">MapGrid_CheckObjectStep</text>
</svg>
