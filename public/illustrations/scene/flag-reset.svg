<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 512" role="img" aria-labelledby="title desc">
  <title id="title">What a map forgets, and when</title>
  <desc id="desc">Two sets of flags let a map remember things for a while without ever undoing them. Map flags are forgotten every time the party enters a map, even the one it just left: the plant Growth raised on Crossbone Isle is a sprout again, as the picture of it on its cliff ledge shows. Map section flags are kept while the party moves between the maps of one map section and forgotten when it enters another map section: Vault's mayor remembers having welcomed Isaac back while the party stays in Vault, and welcomes him again on the next visit. Coming back from a battle forgets neither, so the room is as the party left it.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .chip-gone { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-kept { fill: #f0fdf4; stroke: #bbf7d0; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .col { fill: #737373; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .gone { fill: #c2410c; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kept { fill: #15803d; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .px { image-rendering: pixelated; }
    .edge { fill: none; stroke: #e5e5e5; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .chip-gone { fill: #2a130c; stroke: #5c2a1a; }
      .chip-kept { fill: #0b2015; stroke: #1d4d2e; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .col { fill: #8f8f8f; }
      .gone { fill: #fb8b5e; }
      .kept { fill: #4ade80; }
      .edge { stroke: #2e2e2e; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="511" rx="16"/>
  <text class="eyebrow" x="20" y="40">WHEN THE PARTY...</text>
  <text class="col" x="260" y="26" text-anchor="middle">map</text>
  <text class="col" x="260" y="40" text-anchor="middle">flags</text>
  <text class="col" x="336" y="26" text-anchor="middle">map section</text>
  <text class="col" x="336" y="40" text-anchor="middle">flags</text>
  <g transform="translate(0 8)">

  <!-- Any arrival -->
  <rect class="card" x="20" y="46" width="360" height="186" rx="12"/>
  <text class="h" x="36" y="72">enters a map,</text>
  <text class="h" x="36" y="90">even the same one</text>
  <rect class="chip-gone" x="224" y="60" width="72" height="22" rx="11"/>
  <text class="gone" x="260" y="75" text-anchor="middle">forgotten</text>
  <rect class="chip-kept" x="300" y="60" width="72" height="22" rx="11"/>
  <text class="kept" x="336" y="75" text-anchor="middle">kept</text>
  <text class="p" x="36" y="120">The plant Growth raised on Crossbone</text>
  <text class="p" x="36" y="139">Isle is a sprout again.</text>
  <!-- render place CrossboneIsle, map-1.png cropped 48x32+81+248: one of the plants Growth grows, on its ledge -->
  <image href="data:image/png;base64," class="px" data-crop="crops/scene/crossbone-sprout.png" x="36" y="152" width="96" height="64" preserveAspectRatio="none"/>
  <rect class="edge" x="36" y="152" width="96" height="64"/>
  <text class="p" x="148" y="180">Each time the party</text>
  <text class="p" x="148" y="199">arrives, a sprout.</text>

  <g transform="translate(0 74)">
  <!-- Another map section -->
  <rect class="card" x="20" y="168" width="360" height="108" rx="12"/>
  <text class="h" x="36" y="194">enters another</text>
  <text class="h" x="36" y="212">map section</text>
  <rect class="chip-gone" x="224" y="182" width="72" height="22" rx="11"/>
  <text class="gone" x="260" y="197" text-anchor="middle">forgotten</text>
  <rect class="chip-gone" x="300" y="182" width="72" height="22" rx="11"/>
  <text class="gone" x="336" y="197" text-anchor="middle">forgotten</text>
  <text class="p" x="36" y="240">Vault's mayor, who remembered welcoming</text>
  <text class="p" x="36" y="259">Isaac back, welcomes him back again.</text>

  <!-- Battle -->
  <rect class="card" x="20" y="286" width="360" height="76" rx="12"/>
  <text class="h" x="36" y="312">comes back from a battle</text>
  <rect class="chip-kept" x="224" y="300" width="72" height="22" rx="11"/>
  <text class="kept" x="260" y="315" text-anchor="middle">kept</text>
  <rect class="chip-kept" x="300" y="300" width="72" height="22" rx="11"/>
  <text class="kept" x="336" y="315" text-anchor="middle">kept</text>
  <text class="p" x="36" y="348">The room is as the party left it.</text>

  <!-- foot -->
  <text class="p" x="20" y="392">A map never undoes what it changed.</text>
  <text class="code" x="380" y="416" text-anchor="end">Map_ResetFlagsOnEnter</text>
  </g>
  </g>
</svg>
