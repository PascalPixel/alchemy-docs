<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">Code two places share is copied into both</title>
  <desc id="desc">Two overlays side by side: Vault's town and Vault's houses. Each holds its own code, and each also holds a copy of the same two pieces: showing a villager's thought read with Mind Read, and Ivan handing back Isaac's Djinni before he leaves the party. Below them is the main program, which is always loaded and which both call. Only one overlay is loaded at a time, and an overlay can call only the main program, never another overlay, so code that two places need is written once and compiled into each of them.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .own { fill: #f5f5f5; stroke: #d4d4d4; }
    .shared { fill: #f0f6ff; stroke: #bcd7fb; }
    .main { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .o { fill: #737373; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .no { fill: none; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .nox { fill: #b91c1c; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .own { fill: #1a1a1a; stroke: #333333; }
      .shared { fill: #0d1a2e; stroke: #1e3a66; }
      .main { fill: #111111; stroke: #3b8eff; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .o { fill: #8f8f8f; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .no { stroke: #f05252; }
      .nox { fill: #f87171; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="469" rx="16"/>
  <text class="eyebrow" x="20" y="32">TWO PLACES' CODE, NEVER LOADED TOGETHER</text>

  <!-- Vault -->
  <rect class="card" x="20" y="44" width="174" height="226" rx="12"/>
  <text class="h" x="34" y="70">Vault's town</text>
  <rect class="own" x="32" y="82" width="150" height="52" rx="6"/>
  <text class="o" x="44" y="104">its own events</text>
  <text class="o" x="44" y="122">and tables</text>
  <rect class="shared" x="32" y="142" width="150" height="54" rx="6"/>
  <text class="k" x="44" y="164">a villager's thought,</text>
  <text class="k" x="44" y="182">read with Mind Read</text>
  <rect class="shared" x="32" y="204" width="150" height="54" rx="6"/>
  <text class="k" x="44" y="226">Ivan hands back</text>
  <text class="k" x="44" y="244">Isaac's Djinni</text>

  <!-- Vault's houses -->
  <rect class="card" x="206" y="44" width="174" height="226" rx="12"/>
  <text class="h" x="220" y="70">Vault's houses</text>
  <rect class="own" x="218" y="82" width="150" height="52" rx="6"/>
  <text class="o" x="230" y="104">its own events</text>
  <text class="o" x="230" y="122">and tables</text>
  <rect class="shared" x="218" y="142" width="150" height="54" rx="6"/>
  <text class="k" x="230" y="164">a villager's thought,</text>
  <text class="k" x="230" y="182">read with Mind Read</text>
  <rect class="shared" x="218" y="204" width="150" height="54" rx="6"/>
  <text class="k" x="230" y="226">Ivan hands back</text>
  <text class="k" x="230" y="244">Isaac's Djinni</text>

  <!-- no calls between them -->
  <path class="no" d="M 182 169 H 218"/>
  <text class="nox" x="200" y="160" text-anchor="middle">✕</text>

  <!-- both call the main program -->
  <path class="wire" d="M 107 270 V 300"/>
  <path class="head" d="M 101 296 h 12 l -6 9 z"/>
  <path class="wire" d="M 293 270 V 300"/>
  <path class="head" d="M 287 296 h 12 l -6 9 z"/>
  <rect class="main" x="20" y="308" width="360" height="58" rx="12"/>
  <text class="h" x="36" y="334">The main program</text>
  <text class="p" x="36" y="354">always loaded; both call it</text>

  <text class="p" x="20" y="398">Only one place's code is loaded at a time,</text>
  <text class="p" x="20" y="417">and it can call only the main program. So</text>
  <text class="p" x="20" y="436">shared code is written once and copied in.</text>
  <text class="code" x="380" y="458" text-anchor="end">common/vault_talk.h · common/vault_djinn.h</text>
</svg>
