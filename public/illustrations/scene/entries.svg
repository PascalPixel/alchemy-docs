<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Six questions a place answers</title>
  <desc id="desc">The field engine knows a place only through six questions it asks the place's own code. When the party arrives it asks, in order: what happens here (the events, kept for the whole visit), where the party arrives (the entrances), who stands where (the placements), and whether anything needs setting up (the initialization, which can play an arrival cutscene). At every step it asks whether the leader stands in an exit area. As the party leaves it asks where the exit leads. Each answer comes from a function, so a place can answer differently as the story moves on.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .band { fill: #ffffff; stroke: #e5e5e5; }
    .q { fill: #f0f6ff; stroke: #bcd7fb; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .band { fill: #111111; stroke: #2e2e2e; }
      .q { fill: #0d1a2e; stroke: #1e3a66; }
      .h { fill: #ededed; }
      .k { fill: #66a6ff; }
      .p { fill: #a1a1a1; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>

  <!-- On arrival -->
  <rect class="band" x="20" y="20" width="360" height="224" rx="12"/>
  <text class="eyebrow" x="36" y="44">AS THE PARTY ARRIVES</text>
  <rect class="q" x="36" y="56" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="81">What happens here?</text>
  <text class="code" x="352" y="80" text-anchor="end">events</text>
  <rect class="q" x="36" y="102" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="127">Where does the party arrive?</text>
  <text class="code" x="352" y="126" text-anchor="end">entrances</text>
  <rect class="q" x="36" y="148" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="173">Who stands where?</text>
  <text class="code" x="352" y="172" text-anchor="end">placements</text>
  <rect class="q" x="36" y="194" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="219">Anything to set up first?</text>
  <text class="code" x="352" y="218" text-anchor="end">initialization</text>

  <path class="wire" d="M 200 244 V 258"/>
  <path class="head" d="M 194 254 h 12 l -6 9 z"/>

  <!-- Every step -->
  <rect class="band" x="20" y="266" width="360" height="86" rx="12"/>
  <text class="eyebrow" x="36" y="290">AT EVERY STEP</text>
  <rect class="q" x="36" y="302" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="327">Is the leader in an exit area?</text>
  <text class="code" x="352" y="326" text-anchor="end">regions</text>

  <path class="wire" d="M 200 352 V 366"/>
  <path class="head" d="M 194 362 h 12 l -6 9 z"/>

  <!-- On leaving -->
  <rect class="band" x="20" y="374" width="360" height="86" rx="12"/>
  <text class="eyebrow" x="36" y="398">AS THE PARTY LEAVES</text>
  <rect class="q" x="36" y="410" width="328" height="40" rx="8"/>
  <text class="k" x="50" y="435">Where does this exit lead?</text>
  <text class="code" x="352" y="434" text-anchor="end">exits</text>

  <text class="p" x="20" y="486">Each answer comes from a function, so a</text>
  <text class="p" x="20" y="505">place can answer differently as the story goes on.</text>
</svg>
