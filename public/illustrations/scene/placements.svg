<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 714" role="img" aria-labelledby="title desc">
  <title id="title">Every object event template owns a slot</title>
  <desc id="desc">The blue statue as the game shows it, on its ledge under a jet of water and fallen to the floor below, then the object event templates of Mercury Lighthouse's upper floor, row by row, and the object event slot each row fills before and after the blue statue falls from its ledge. The party's eight slots come first. The first row, the statue fallen to the floor below, appears only once it has fallen; the second, the statue on its ledge, only until then. The rows after them, two pipe sections, three pipe ends and six stone statues, always appear. A row whose condition fails leaves its slot empty rather than handing it to the next row, so every object event keeps the same slot whatever the story has done, and the pipes are always the third and fourth placed object events.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .row { fill: #ffffff; stroke: #e5e5e5; }
    .party { fill: #f5f5f5; stroke: #d4d4d4; }
    .slot { fill: #0a72ef; }
    .empty { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .when { fill: #0a72ef; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .col { fill: #737373; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .px { image-rendering: pixelated; }
    .edge { fill: none; stroke: #e5e5e5; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .row { fill: #111111; stroke: #2e2e2e; }
      .party { fill: #1a1a1a; stroke: #333333; }
      .slot { fill: #3b8eff; }
      .empty { stroke: #5c5c5c; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .when { fill: #66a6ff; }
      .col { fill: #8f8f8f; }
      .edge { stroke: #2e2e2e; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="713" rx="16"/>
  <text class="eyebrow" x="20" y="32">MERCURY LIGHTHOUSE, UPPER FLOOR</text>

  <!-- The blue statue in the game: render place MercuryLighthouseUpper, map-14.png cropped 48x64+96+276
       (on its ledge at (808, 712)), and render guide moment at its entrance 7 with
       FLAG_MERCURY_LIGHTHOUSE_STATUE_FELL, the last frame cropped 48x64+128+36 (fallen, at (200, 360)) -->
  <image href="data:image/png;base64," class="px" data-crop="crops/scene/mercury-statue-ledge.png" x="52" y="48" width="96" height="128" preserveAspectRatio="none"/>
  <rect class="edge" x="52" y="48" width="96" height="128"/>
  <image href="data:image/png;base64," class="px" data-crop="crops/scene/mercury-statue-fallen.png" x="252" y="48" width="96" height="128" preserveAspectRatio="none"/>
  <rect class="edge" x="252" y="48" width="96" height="128"/>
  <text class="h" x="100" y="200" text-anchor="middle">On its ledge</text>
  <text class="p" x="100" y="219" text-anchor="middle">until it falls</text>
  <text class="h" x="300" y="200" text-anchor="middle">Fallen</text>
  <text class="p" x="300" y="219" text-anchor="middle">to the floor below</text>

  <g transform="translate(0 194)">
  <!-- Column heads -->
  <text class="col" x="304" y="60" text-anchor="middle">statue</text>
  <text class="col" x="304" y="75" text-anchor="middle">up</text>
  <text class="col" x="356" y="60" text-anchor="middle">statue</text>
  <text class="col" x="356" y="75" text-anchor="middle">fallen</text>

  <!-- The party -->
  <rect class="party" x="20" y="86" width="360" height="40" rx="8"/>
  <text class="p" x="34" y="111">The party's eight slots</text>
  <rect class="slot" x="294" y="98" width="20" height="16" rx="3" opacity="0.35"/>
  <rect class="slot" x="346" y="98" width="20" height="16" rx="3" opacity="0.35"/>

  <!-- Row: fallen statue -->
  <rect class="row" x="20" y="134" width="360" height="48" rx="8"/>
  <text class="h" x="34" y="154">The blue statue, fallen</text>
  <text class="when" x="34" y="172">only once it has fallen</text>
  <rect class="empty" x="294" y="148" width="20" height="20" rx="3"/>
  <rect class="slot" x="346" y="148" width="20" height="20" rx="3"/>

  <!-- Row: statue on ledge -->
  <rect class="row" x="20" y="188" width="360" height="48" rx="8"/>
  <text class="h" x="34" y="208">The blue statue on its ledge</text>
  <text class="when" x="34" y="226">only until it falls</text>
  <rect class="slot" x="294" y="202" width="20" height="20" rx="3"/>
  <rect class="empty" x="346" y="202" width="20" height="20" rx="3"/>

  <!-- Row: pipes -->
  <rect class="row" x="20" y="242" width="360" height="48" rx="8"/>
  <text class="h" x="34" y="262">Two pipe sections</text>
  <text class="when" x="34" y="280">always</text>
  <rect class="slot" x="289" y="259" width="14" height="14" rx="3"/>
  <rect class="slot" x="305" y="259" width="14" height="14" rx="3"/>
  <rect class="slot" x="341" y="259" width="14" height="14" rx="3"/>
  <rect class="slot" x="357" y="259" width="14" height="14" rx="3"/>

  <!-- Row: pipe ends and statues -->
  <rect class="row" x="20" y="296" width="360" height="48" rx="8"/>
  <text class="h" x="34" y="316">Three pipe ends, six statues</text>
  <text class="when" x="34" y="334">always</text>
  <rect class="slot" x="294" y="310" width="20" height="20" rx="3" opacity="0.35"/>
  <rect class="slot" x="346" y="310" width="20" height="20" rx="3" opacity="0.35"/>

  <text class="p" x="20" y="378">A row whose condition fails leaves its</text>
  <text class="p" x="20" y="397">slot empty. Nothing moves up to fill it, so</text>
  <text class="p" x="20" y="416">every object event keeps one slot all game,</text>
  <text class="p" x="20" y="435">and the map's code can name it once: the pipes</text>
  <text class="p" x="20" y="454">are always the third and fourth object events.</text>
  <text class="code" x="380" y="496" text-anchor="end">FieldScript_SpawnObjectTable</text>
  </g>
</svg>
