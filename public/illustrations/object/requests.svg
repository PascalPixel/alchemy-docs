<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 572" role="img" aria-labelledby="title desc">
  <title id="title">What can stop the walk, in the order the game deals with it</title>
  <desc id="desc">Twelve things can interrupt the walk, and the game checks them from the top of the list down, dealing with the first one it finds and then starting again from the top. Leaving the map comes first, then a script that something asked for (a fall to poison, the world map screen), then a battle. Then the ground: the cell the leader stepped onto, and a ledge or climbing spot pushed against. Then the buttons: A, which becomes talking to someone, searching the spot ahead or the menu; the menu; talking; searching; Psynergy; an item; and Start. When nothing is left, walking resumes.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .row { fill: #ffffff; stroke: #e5e5e5; }
    .row-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .row-ground { fill: #f0f6ff; stroke: #bcd7fb; }
    .p { fill: #0a0a0a; font: 500 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .px { fill: #c2410c; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .pk { fill: #0a72ef; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .note { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .group { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .loop { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .loop-head { fill: #0a72ef; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .row { fill: #111111; stroke: #2e2e2e; }
      .row-exit { fill: #2a130c; stroke: #5c2a1a; }
      .row-ground { fill: #0d1a2e; stroke: #1e3a66; }
      .p { fill: #ededed; }
      .px { fill: #fb8b5e; }
      .pk { fill: #66a6ff; }
      .note { fill: #a1a1a1; }
      .group, .code, .eyebrow { fill: #7c7c7c; }
      .loop { stroke: #3b8eff; }
      .loop-head { fill: #3b8eff; }
      .k { fill: #66a6ff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="571" rx="16"/>
  <text class="eyebrow" x="60" y="32">CHECKED FROM THE TOP, ONE AT A TIME</text>

  <!-- Leaving -->
  <text class="group" x="60" y="58">LEAVING, SCRIPTS AND BATTLES</text>
  <rect class="row-exit" x="60" y="66" width="320" height="30" rx="8"/>
  <text class="px" x="74" y="86">Leave the map</text>
  <text class="code" x="368" y="85" text-anchor="end">warp</text>
  <rect class="row" x="60" y="100" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="120">Run a script something asked for</text>
  <text class="code" x="368" y="119" text-anchor="end">event</text>
  <rect class="row-exit" x="60" y="134" width="320" height="30" rx="8"/>
  <text class="px" x="74" y="154">Start a battle</text>
  <text class="code" x="368" y="153" text-anchor="end">battle</text>

  <!-- The ground -->
  <text class="group" x="60" y="188">THE GROUND</text>
  <rect class="row-ground" x="60" y="196" width="320" height="30" rx="8"/>
  <text class="pk" x="74" y="216">The cell just stepped onto</text>
  <text class="code" x="368" y="215" text-anchor="end">action</text>
  <rect class="row-ground" x="60" y="230" width="320" height="30" rx="8"/>
  <text class="pk" x="74" y="250">A ledge or climb pushed against</text>
  <text class="code" x="368" y="249" text-anchor="end">pushTile</text>

  <!-- The buttons -->
  <text class="group" x="60" y="284">THE BUTTONS</text>
  <rect class="row" x="60" y="292" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="312">A: talk, search or menu?</text>
  <text class="code" x="368" y="311" text-anchor="end">examine</text>
  <rect class="row" x="60" y="326" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="346">Open the menu</text>
  <text class="code" x="368" y="345" text-anchor="end">menu</text>
  <rect class="row" x="60" y="360" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="380">Talk to someone</text>
  <text class="code" x="368" y="379" text-anchor="end">talk</text>
  <rect class="row" x="60" y="394" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="414">Search the spot ahead</text>
  <text class="code" x="368" y="413" text-anchor="end">tile</text>
  <rect class="row" x="60" y="428" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="448">Use Psynergy</text>
  <text class="code" x="368" y="447" text-anchor="end">psynergy</text>
  <rect class="row" x="60" y="462" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="482">Use an item</text>
  <text class="code" x="368" y="481" text-anchor="end">item</text>
  <rect class="row" x="60" y="496" width="320" height="30" rx="8"/>
  <text class="p" x="74" y="516">Start: the pause menu</text>
  <text class="code" x="368" y="515" text-anchor="end">start</text>

  <!-- After each, back to the top -->
  <path class="loop" d="M 60 511 H 30 V 81 H 54"/>
  <path class="loop-head" d="M 51 75 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 296) rotate(-90)" text-anchor="middle">after each one, back to the top</text>
  <text class="note" x="60" y="552">Nothing left: the player walks again.</text>
</svg>
