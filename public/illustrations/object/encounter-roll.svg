<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 592" role="img" aria-labelledby="title desc">
  <title id="title">How a random battle starts</title>
  <desc id="desc">Each frame the leader moves, a counter fills by a step, and a battle starts when it is full. The step is bigger on ground whose zone has a higher rate, bigger when the party's level is above the zone's, and varies by a random amount drawn again after each battle; it grows with the leader's speed, so the counter measures distance walked rather than time. There are no battles at all while Cloak is active, on ground with no zone, while a flag turns them off, or with Avoid active where the party's level is above the zone's. When the counter is full, one of the zone's enemy groups is drawn by weight. In the Sol Sanctum's corridor, Vermin come one time in six, Bats one in three, Wild Mushrooms one in three, and a mix of the three one in six.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .meter { fill: #f5f5f5; stroke: #d4d4d4; }
    .fill1 { fill: #0a72ef; fill-opacity: 0.85; }
    .fill2 { fill: #0a72ef; fill-opacity: 0.55; }
    .tick { stroke: #ffffff; stroke-width: 2; }
    .full { stroke: #c2410c; stroke-width: 2; stroke-dasharray: 3 3; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .w0 { fill: #f0f6ff; stroke: #bcd7fb; }
    .w1 { fill: #dbeafe; stroke: #93c5fd; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .tagx { fill: #c2410c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .dot { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .meter { fill: #1a1a1a; stroke: #333333; }
      .fill1 { fill: #3b8eff; }
      .fill2 { fill: #3b8eff; }
      .tick { stroke: #111111; }
      .full { stroke: #fb8b5e; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .w0 { fill: #0d1a2e; stroke: #1e3a66; }
      .w1 { fill: #13274a; stroke: #2b5299; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .kx, .tagx { fill: #fb8b5e; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
      .dot { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="591" rx="16"/>
  <text class="eyebrow" x="20" y="32">EACH FRAME THE LEADER MOVES</text>

  <!-- The counter -->
  <rect class="card" x="20" y="44" width="360" height="200" rx="12"/>
  <text class="h" x="36" y="70">A counter fills a step at a time</text>
  <rect class="meter" x="36" y="84" width="300" height="22" rx="6"/>
  <rect class="fill1" x="36" y="84" width="196" height="22" rx="6"/>
  <path class="tick" d="M 70 84 V 106 M 108 84 V 106 M 140 84 V 106 M 178 84 V 106 M 212 84 V 106"/>
  <path class="full" d="M 336 78 V 112"/>
  <text class="tagx" x="344" y="100">full</text>
  <text class="small" x="36" y="124">one step each frame</text>
  <text class="small" x="336" y="124" text-anchor="end">a battle starts</text>
  <circle class="dot" cx="42" cy="148" r="3.5"/>
  <text class="p" x="52" y="153">The ground's zone sets the size of a step.</text>
  <circle class="dot" cx="42" cy="172" r="3.5"/>
  <text class="p" x="52" y="177">Steps grow when the party outlevels it.</text>
  <circle class="dot" cx="42" cy="196" r="3.5"/>
  <text class="p" x="52" y="201">A random part, drawn after each battle,</text>
  <text class="p" x="52" y="219">varies the gap between battles.</text>
  <text class="code" x="364" y="236" text-anchor="end">gGameState.encounterSteps</text>

  <!-- No battles -->
  <rect class="card-exit" x="20" y="256" width="360" height="136" rx="12"/>
  <text class="h" x="36" y="282">No battles at all</text>
  <rect class="chip-exit" x="36" y="294" width="64" height="26" rx="13"/>
  <text class="kx" x="68" y="312" text-anchor="middle">Cloak</text>
  <rect class="chip-exit" x="106" y="294" width="150" height="26" rx="13"/>
  <text class="kx" x="181" y="312" text-anchor="middle">ground with no zone</text>
  <rect class="chip-exit" x="36" y="326" width="156" height="26" rx="13"/>
  <text class="kx" x="114" y="344" text-anchor="middle">a flag turns them off</text>
  <rect class="chip-exit" x="36" y="358" width="292" height="26" rx="13"/>
  <text class="kx" x="182" y="376" text-anchor="middle">Avoid, where the party outlevels the zone</text>

  <!-- Which enemies -->
  <rect class="card" x="20" y="404" width="360" height="172" rx="12"/>
  <text class="h" x="36" y="430">When it is full: which enemies?</text>
  <text class="p" x="36" y="452">One of the zone's groups, drawn by weight.</text>
  <text class="eyebrow" x="36" y="480">THE SOL SANCTUM'S CORRIDOR</text>
  <rect class="w0" x="36" y="490" width="54" height="34" rx="6"/>
  <rect class="w1" x="92" y="490" width="106" height="34" rx="6"/>
  <rect class="w0" x="200" y="490" width="106" height="34" rx="6"/>
  <rect class="w1" x="308" y="490" width="56" height="34" rx="6"/>
  <text class="k" x="63" y="512" text-anchor="middle">Vermin</text>
  <text class="k" x="145" y="512" text-anchor="middle">Bats</text>
  <text class="k" x="253" y="512" text-anchor="middle">Wild Mushrooms</text>
  <text class="k" x="336" y="512" text-anchor="middle">a mix</text>
  <text class="small" x="63" y="542" text-anchor="middle">1 in 6</text>
  <text class="small" x="145" y="542" text-anchor="middle">1 in 3</text>
  <text class="small" x="253" y="542" text-anchor="middle">1 in 3</text>
  <text class="small" x="336" y="542" text-anchor="middle">1 in 6</text>
  <text class="code" x="364" y="566" text-anchor="end">Encounter_SelectEnemyGroup · encounter.tsv</text>
</svg>
