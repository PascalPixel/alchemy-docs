<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">The main program, bank by bank</title>
  <desc id="desc">The code of the main program as it lies on the English cartridge, about 1 MB, drawn to scale from start to end and cut into fourteen banks, each starting at a fixed address. Each large bank has a folder of the source: runtime (start-up, frames and memory), field (moving and drawing the map), window (windows, fonts and all the game's text, the largest), game (the rules: stats, items, Djinn), object (running a place, and random battles), menu, shop, battle, and effect (battle animations). Five small banks follow, the last of them the sound bank. Each bank opens with a table of jumps, one for each of its functions that another bank calls. A call from another bank, a far call, goes to that jump, and the jump goes on to the function: the object bank starts a battle by calling a jump in the battle bank's table, which leads to the battle code further down. The sound code, the music and the game's packed data come after these banks on the cartridge.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .b { fill: #f0f6ff; stroke: #bcd7fb; }
    .b2 { fill: #c7ddfc; stroke: #93c5fd; }
    .small { fill: #f5f5f5; stroke: #d4d4d4; }
    .table { fill: #0a72ef; }
    .lead { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .n { fill: #0a0a0a; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .call { fill: none; stroke: #0a72ef; stroke-width: 2; }
    .call-head { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .b { fill: #0d1a2e; stroke: #1e3a66; }
      .b2 { fill: #1d3d73; stroke: #3b6bc4; }
      .small { fill: #1a1a1a; stroke: #333333; }
      .table { fill: #3b8eff; }
      .lead { stroke: #525252; }
      .n { fill: #ededed; }
      .d { fill: #8f8f8f; }
      .p { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .call { stroke: #3b8eff; }
      .call-head { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="559" rx="16"/>
  <text class="eyebrow" x="20" y="32">THE MAIN PROGRAM'S CODE, TO SCALE</text>
  <text class="d" x="20" y="52">about 1 MB, from start to end</text>

  <!-- banks: 0.34 units a KB, English edition; a bank runs from its table to the next bank's start -->
  <rect class="b" x="70" y="70" width="80" height="12.2"/>
  <rect class="b2" x="70" y="82.2" width="80" height="16.3"/>
  <rect class="b" x="70" y="98.5" width="80" height="133.3"/>
  <rect class="b2" x="70" y="231.8" width="80" height="25.8"/>
  <rect class="b" x="70" y="257.6" width="80" height="31.3"/>
  <rect class="b2" x="70" y="288.9" width="80" height="20.4"/>
  <rect class="b" x="70" y="309.3" width="80" height="6.8"/>
  <rect class="b2" x="70" y="316.1" width="80" height="27.2"/>
  <rect class="b" x="70" y="343.3" width="80" height="53"/>
  <rect class="small" x="70" y="396.3" width="80" height="12.9"/>
  <!-- each bank's jump table, at its start -->
  <rect class="table" x="70" y="98.5" width="24" height="3"/>
  <rect class="table" x="70" y="82.2" width="24" height="3"/>
  <rect class="table" x="70" y="231.8" width="24" height="3"/>
  <rect class="table" x="70" y="257.6" width="24" height="3"/>
  <rect class="table" x="70" y="288.9" width="24" height="3"/>
  <rect class="table" x="70" y="309.3" width="24" height="3"/>
  <rect class="table" x="70" y="316.1" width="24" height="3"/>
  <rect class="table" x="70" y="343.3" width="24" height="3"/>

  <!-- labels: each leader line ends in the middle of its band -->
  <path class="lead" d="M 150 76 H 162 M 150 90.3 L 156 94 H 162 M 150 165 H 162 M 150 244.7 H 162 M 150 273.2 H 162 M 150 299 L 156 296 H 162 M 150 312.7 L 156 314 H 162 M 150 329.7 L 156 332 H 162 M 150 369.8 H 162 M 150 402.7 H 162"/>
  <text class="n" x="166" y="81">runtime</text><text class="d" x="234" y="81">start-up, frames</text>
  <text class="n" x="166" y="99">field</text><text class="d" x="216" y="99">moving and drawing</text>
  <text class="n" x="166" y="162">window</text><text class="d" x="226" y="162">windows, fonts and</text>
  <text class="d" x="226" y="178">all the game's text</text>
  <text class="n" x="166" y="249">game</text><text class="d" x="210" y="249">rules: stats, items</text>
  <text class="n" x="166" y="278">object</text><text class="d" x="226" y="278">running a place</text>
  <text class="n" x="166" y="298">menu</text>
  <text class="n" x="166" y="316">shop</text>
  <text class="n" x="166" y="334">battle</text>
  <text class="n" x="166" y="374">effect</text><text class="d" x="226" y="374">battle animations</text>
  <text class="d" x="166" y="407">five small banks, the last for sound</text>

  <!-- a far call: from the object bank to the battle bank's jump table -->
  <path class="call" d="M 70 273.2 H 40 V 317.1 H 62"/>
  <path class="call-head" d="M 60 312.1 v 10 l 9 -5 z"/>
  <path class="call" d="M 82 320 V 330"/>
  <path class="call-head" d="M 77 328 h 10 l -5 8 z"/>

  <!-- key -->
  <rect class="table" x="20" y="430" width="24" height="3"/>
  <text class="p" x="54" y="436">a bank's jump table, at its start</text>
  <path class="call" d="M 20 456 H 40"/>
  <path class="call-head" d="M 38 451 v 10 l 9 -5 z"/>
  <text class="p" x="54" y="461">a far call, from one bank into another</text>

  <text class="p" x="20" y="490">The object bank starts a battle by calling</text>
  <text class="p" x="20" y="509">the battle bank's jump table, which leads on</text>
  <text class="p" x="20" y="528">to the battle code wherever it lies.</text>
  <text class="code" x="380" y="548" text-anchor="end">Battle_RunEncounterFar · main.ld</text>
</svg>
