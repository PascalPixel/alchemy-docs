<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 452" role="img" aria-labelledby="title desc">
  <title id="title">One warp, three destinations</title>
  <desc id="desc">The way down from Sol Sanctum's entrance has three rows in the warp table, read from the top. The first leads to Vale, and is taken until the sanctum erupts. The second leads to Vale during the eruption, and is taken until the party leaves Vale. The third leads to Vale, with no condition. The first row whose condition still holds is taken, so the same path leads to Vale before the eruption, to Vale erupting while the story is there, and to Vale again for the rest of the game.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .row { fill: #ffffff; stroke: #e5e5e5; }
    .door { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .dest { fill: #f0fdf4; stroke: #bbf7d0; }
    .dest-x { fill: #fff3f0; stroke: #f6c3b7; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .when { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .g { fill: #15803d; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .x { fill: #c2410c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .loop { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .loop-head { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .row { fill: #111111; stroke: #2e2e2e; }
      .door { fill: #0d1a2e; stroke: #3b8eff; }
      .dest { fill: #0b2015; stroke: #1d4d2e; }
      .dest-x { fill: #2a130c; stroke: #5c2a1a; }
      .h { fill: #ededed; }
      .when { fill: #66a6ff; }
      .g { fill: #4ade80; }
      .x { fill: #fb8b5e; }
      .p { fill: #a1a1a1; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .loop { stroke: #3b8eff; }
      .loop-head { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="451" rx="16"/>
  <text class="eyebrow" x="20" y="32">SOL SANCTUM'S ENTRANCE</text>

  <rect class="door" x="20" y="44" width="360" height="44" rx="10"/>
  <text class="h" x="36" y="71">The party takes the way down</text>
  <path class="wire" d="M 200 88 V 102"/>
  <path class="head" d="M 194 98 h 12 l -6 9 z"/>

  <!-- rows -->
  <path class="loop" d="M 32 120 V 300"/>
  <path class="loop-head" d="M 26 296 h 12 l -6 9 z"/>

  <rect class="row" x="46" y="110" width="334" height="58" rx="8"/>
  <text class="when" x="60" y="132">until the sanctum erupts</text>
  <rect class="dest" x="60" y="140" width="56" height="20" rx="10"/>
  <text class="g" x="88" y="155" text-anchor="middle">Vale</text>

  <rect class="row" x="46" y="176" width="334" height="58" rx="8"/>
  <text class="when" x="60" y="198">until the party leaves Vale</text>
  <rect class="dest-x" x="60" y="206" width="172" height="20" rx="10"/>
  <text class="x" x="146" y="221" text-anchor="middle">Vale, during the eruption</text>

  <rect class="row" x="46" y="242" width="334" height="58" rx="8"/>
  <text class="when" x="60" y="264">always</text>
  <rect class="dest" x="60" y="272" width="56" height="20" rx="10"/>
  <text class="g" x="88" y="287" text-anchor="middle">Vale</text>

  <text class="p" x="20" y="342">The rows are read from the top, and the first</text>
  <text class="p" x="20" y="361">whose condition still holds is taken. The same</text>
  <text class="p" x="20" y="380">path leads to Vale, then to Vale erupting, then</text>
  <text class="p" x="20" y="399">to Vale again for the rest of the game.</text>
  <text class="code" x="380" y="434" text-anchor="end">Map_TakeWarp · MAP_WARP_IF</text>
</svg>
