<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Each map's code and map section</title>
  <desc id="desc">Four maps and what the map table gives each. Bilibin's town, its treasury and the Bilibin Barricade all run on Bilibin's code; Bilibin's houses have code of their own. Bilibin's town, houses and treasury are one map section, Bilibin, which chooses their music, the area name shown on arrival and the flags kept while the party is inside. The Bilibin Barricade shares Bilibin's code but is a map section of its own. Which code a map runs and which map section it belongs to are chosen separately.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .row { fill: #ffffff; stroke: #e5e5e5; }
    .c1 { fill: #f0f6ff; stroke: #bcd7fb; }
    .c2 { fill: #f5f5f5; stroke: #d4d4d4; }
    .p1 { fill: #f0fdf4; stroke: #bbf7d0; }
    .p2 { fill: #faf5ff; stroke: #e9d5ff; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k1 { fill: #0a72ef; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k2 { fill: #525252; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .g1 { fill: #15803d; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .g2 { fill: #7e22ce; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .col { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .row { fill: #111111; stroke: #2e2e2e; }
      .c1 { fill: #0d1a2e; stroke: #1e3a66; }
      .c2 { fill: #1a1a1a; stroke: #333333; }
      .p1 { fill: #0b2015; stroke: #1d4d2e; }
      .p2 { fill: #1f1030; stroke: #4c2a70; }
      .h { fill: #ededed; }
      .k1 { fill: #66a6ff; }
      .k2 { fill: #a1a1a1; }
      .g1 { fill: #4ade80; }
      .g2 { fill: #c084fc; }
      .p { fill: #a1a1a1; }
      .col, .code { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="399" rx="16"/>
  <text class="col" x="20" y="32">MAP</text>
  <text class="col" x="247" y="32" text-anchor="middle">CODE</text>
  <text class="col" x="336" y="32" text-anchor="middle">MAP SECTION</text>

  <rect class="row" x="20" y="44" width="360" height="44" rx="8"/>
  <text class="h" x="32" y="71">Bilibin</text>
  <rect class="c1" x="200" y="55" width="94" height="22" rx="11"/>
  <text class="k1" x="247" y="70" text-anchor="middle">Bilibin's</text>
  <rect class="p1" x="300" y="55" width="72" height="22" rx="11"/>
  <text class="g1" x="336" y="70" text-anchor="middle">Bilibin</text>

  <rect class="row" x="20" y="96" width="360" height="44" rx="8"/>
  <text class="h" x="32" y="123">Bilibin's houses</text>
  <rect class="c2" x="200" y="107" width="94" height="22" rx="11"/>
  <text class="k2" x="247" y="122" text-anchor="middle">their own</text>
  <rect class="p1" x="300" y="107" width="72" height="22" rx="11"/>
  <text class="g1" x="336" y="122" text-anchor="middle">Bilibin</text>

  <rect class="row" x="20" y="148" width="360" height="44" rx="8"/>
  <text class="h" x="32" y="175">Bilibin's treasury</text>
  <rect class="c1" x="200" y="159" width="94" height="22" rx="11"/>
  <text class="k1" x="247" y="174" text-anchor="middle">Bilibin's</text>
  <rect class="p1" x="300" y="159" width="72" height="22" rx="11"/>
  <text class="g1" x="336" y="174" text-anchor="middle">Bilibin</text>

  <rect class="row" x="20" y="200" width="360" height="56" rx="8"/>
  <text class="h" x="32" y="233">Bilibin Barricade</text>
  <rect class="c1" x="200" y="217" width="94" height="22" rx="11"/>
  <text class="k1" x="247" y="232" text-anchor="middle">Bilibin's</text>
  <rect class="p2" x="300" y="211" width="72" height="34" rx="11"/>
  <text class="g2" x="336" y="225" text-anchor="middle">Bilibin</text>
  <text class="g2" x="336" y="239" text-anchor="middle">Barricade</text>

  <text class="p" x="20" y="290">The code says what happens there. The map</text>
  <text class="p" x="20" y="309">section chooses the music, the name shown on</text>
  <text class="p" x="20" y="328">arrival and the flags kept while the party is</text>
  <text class="p" x="20" y="347">inside. The two are chosen separately.</text>
  <text class="code" x="380" y="384" text-anchor="end">gField_MapTable · field/maps.s</text>
</svg>
