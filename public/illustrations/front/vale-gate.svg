<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 470" role="img" aria-labelledby="title desc">
  <title id="title">One scene, five moments in the story</title>
  <desc id="desc">Vale's town gate is one scene for the whole game, and each time the party arrives it asks the story which set of events to use, testing in order. Has the party reached Kalay? Then the events after Kalay. Has the party left Vale? Then the events after leaving. Has the party come from the Sanctum? Then the farewell. Is it the stormy night? Then the storm. Otherwise, the events of the day the story begins.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .q { fill: #ffffff; stroke: #e5e5e5; }
    .ans { fill: #f0f6ff; stroke: #bcd7fb; }
    .last { fill: #f5f5f5; stroke: #d4d4d4; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s { fill: #737373; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .yes { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .yes-head { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .q { fill: #111111; stroke: #2e2e2e; }
      .ans { fill: #0d1a2e; stroke: #1e3a66; }
      .last { fill: #1a1a1a; stroke: #333333; }
      .h { fill: #ededed; }
      .k { fill: #66a6ff; }
      .s { fill: #8f8f8f; }
      .p { fill: #a1a1a1; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .yes { stroke: #3b8eff; }
      .yes-head { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="469" rx="16"/>
  <text class="eyebrow" x="20" y="32">VALE'S TOWN GATE: WHICH EVENTS?</text>
  <text class="s" x="282" y="56" text-anchor="middle">if yes</text>

  <!-- q1 -->
  <rect class="q" x="20" y="64" width="190" height="46" rx="8"/>
  <text class="h" x="34" y="92">Reached Kalay?</text>
  <path class="yes" d="M 210 87 H 230"/>
  <path class="yes-head" d="M 228 82 v 10 l 8 -5 z"/>
  <rect class="ans" x="240" y="70" width="140" height="34" rx="8"/>
  <text class="k" x="310" y="92" text-anchor="middle">after Kalay</text>
  <path class="wire" d="M 60 110 V 122"/>
  <path class="head" d="M 55 119 h 10 l -5 8 z"/>

  <!-- q2 -->
  <rect class="q" x="20" y="128" width="190" height="46" rx="8"/>
  <text class="h" x="34" y="156">Left Vale?</text>
  <path class="yes" d="M 210 151 H 230"/>
  <path class="yes-head" d="M 228 146 v 10 l 8 -5 z"/>
  <rect class="ans" x="240" y="134" width="140" height="34" rx="8"/>
  <text class="k" x="310" y="156" text-anchor="middle">after leaving</text>
  <path class="wire" d="M 60 174 V 186"/>
  <path class="head" d="M 55 183 h 10 l -5 8 z"/>

  <!-- q3 -->
  <rect class="q" x="20" y="192" width="190" height="46" rx="8"/>
  <text class="h" x="34" y="220">From the Sanctum?</text>
  <path class="yes" d="M 210 215 H 230"/>
  <path class="yes-head" d="M 228 210 v 10 l 8 -5 z"/>
  <rect class="ans" x="240" y="198" width="140" height="34" rx="8"/>
  <text class="k" x="310" y="220" text-anchor="middle">the farewell</text>
  <path class="wire" d="M 60 238 V 250"/>
  <path class="head" d="M 55 247 h 10 l -5 8 z"/>

  <!-- q4 -->
  <rect class="q" x="20" y="256" width="190" height="46" rx="8"/>
  <text class="h" x="34" y="284">The stormy night?</text>
  <path class="yes" d="M 210 279 H 230"/>
  <path class="yes-head" d="M 228 274 v 10 l 8 -5 z"/>
  <rect class="ans" x="240" y="262" width="140" height="34" rx="8"/>
  <text class="k" x="310" y="284" text-anchor="middle">the storm</text>
  <path class="wire" d="M 60 302 V 314"/>
  <path class="head" d="M 55 311 h 10 l -5 8 z"/>

  <!-- otherwise -->
  <rect class="last" x="20" y="320" width="360" height="40" rx="8"/>
  <text class="h" x="34" y="345">Otherwise: the day the story begins</text>

  <text class="p" x="20" y="396">The newest moment is tested first, so one</text>
  <text class="p" x="20" y="415">scene can serve the whole game. Its exits and</text>
  <text class="p" x="20" y="434">people are chosen the same way.</text>
  <text class="code" x="380" y="456" text-anchor="end">ValeGate_GetEvents</text>
</svg>
