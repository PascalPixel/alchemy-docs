<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 604" role="img" aria-labelledby="title desc">
  <title id="title">The credits draw just ahead</title>
  <desc id="desc">The staff names are drawn into a ring of 32 rows of tiles, one line of text to a row. 16 rows are on screen at a time and the other 16 are hidden below. The names move up a pixel every fourth frame, so a new line comes into view every 32 frames. Each time one does, the next line of names is drawn into the first hidden row, just below the screen, over a line that scrolled off the top long before. Past the last row the ring wraps to the first, so the credits never need more than 32 rows of tile memory, however long the list of names.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .row { fill: #ffffff; stroke: #e5e5e5; }
    .screen { fill: #0a72ef; fill-opacity: 0.08; stroke: #0a72ef; stroke-width: 2; }
    .txt { fill: #a3a3a3; }
    .txt-new { fill: #f59e0b; }
    .txt-old { fill: #d4d4d4; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .wire2 { fill: none; stroke: #d97706; stroke-width: 1.5; }
    .head2 { fill: #d97706; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kn { fill: #b45309; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .l { fill: #525252; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .row { fill: #111111; stroke: #262626; }
      .screen { fill: #3b8eff; fill-opacity: 0.14; stroke: #3b8eff; }
      .txt { fill: #737373; }
      .txt-old { fill: #333333; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .wire2 { stroke: #f59e0b; }
      .head2 { fill: #f59e0b; }
      .h { fill: #ededed; }
      .p, .l { fill: #a1a1a1; }
      .k { fill: #66a6ff; }
      .kn { fill: #fbbf24; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="603" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE RING OF 32 ROWS</text>
  <text class="code" x="380" y="586" text-anchor="end">DisplayScroll_RenderEnteringLine</text>

  <!-- 32 rows, 13 units each, from y 52 to 468; ring x 40..200 -->
  <g>
    <rect class="row" x="40" y="52" width="160" height="13"/>
    <rect class="row" x="40" y="65" width="160" height="13"/>
    <rect class="row" x="40" y="78" width="160" height="13"/>
    <rect class="row" x="40" y="91" width="160" height="13"/>
    <rect class="row" x="40" y="104" width="160" height="13"/>
    <rect class="row" x="40" y="117" width="160" height="13"/>
    <rect class="row" x="40" y="130" width="160" height="13"/>
    <rect class="row" x="40" y="143" width="160" height="13"/>
    <rect class="row" x="40" y="156" width="160" height="13"/>
    <rect class="row" x="40" y="169" width="160" height="13"/>
    <rect class="row" x="40" y="182" width="160" height="13"/>
    <rect class="row" x="40" y="195" width="160" height="13"/>
    <rect class="row" x="40" y="208" width="160" height="13"/>
    <rect class="row" x="40" y="221" width="160" height="13"/>
    <rect class="row" x="40" y="234" width="160" height="13"/>
    <rect class="row" x="40" y="247" width="160" height="13"/>
    <rect class="row" x="40" y="260" width="160" height="13"/>
    <rect class="row" x="40" y="273" width="160" height="13"/>
    <rect class="row" x="40" y="286" width="160" height="13"/>
    <rect class="row" x="40" y="299" width="160" height="13"/>
    <rect class="row" x="40" y="312" width="160" height="13"/>
    <rect class="row" x="40" y="325" width="160" height="13"/>
    <rect class="row" x="40" y="338" width="160" height="13"/>
    <rect class="row" x="40" y="351" width="160" height="13"/>
    <rect class="row" x="40" y="364" width="160" height="13"/>
    <rect class="row" x="40" y="377" width="160" height="13"/>
    <rect class="row" x="40" y="390" width="160" height="13"/>
    <rect class="row" x="40" y="403" width="160" height="13"/>
    <rect class="row" x="40" y="416" width="160" height="13"/>
    <rect class="row" x="40" y="429" width="160" height="13"/>
    <rect class="row" x="40" y="442" width="160" height="13"/>
    <rect class="row" x="40" y="455" width="160" height="13"/>
  </g>

  <!-- Lines already scrolled off: rows 0..5, faded -->
  <rect class="txt-old" x="76" y="56" width="88" height="5" rx="2"/>
  <rect class="txt-old" x="64" y="82" width="112" height="5" rx="2"/>
  <rect class="txt-old" x="70" y="95" width="100" height="5" rx="2"/>
  <!-- On screen: rows 6..21 -->
  <rect class="screen" x="34" y="130" width="172" height="208" rx="4"/>
  <rect class="txt" x="80" y="147" width="80" height="5" rx="2"/>
  <rect class="txt" x="62" y="173" width="116" height="5" rx="2"/>
  <rect class="txt" x="68" y="186" width="104" height="5" rx="2"/>
  <rect class="txt" x="84" y="225" width="72" height="5" rx="2"/>
  <rect class="txt" x="58" y="251" width="124" height="5" rx="2"/>
  <rect class="txt" x="74" y="264" width="92" height="5" rx="2"/>
  <rect class="txt" x="66" y="277" width="108" height="5" rx="2"/>
  <rect class="txt" x="86" y="316" width="68" height="5" rx="2"/>
  <!-- Hidden: rows 22..31; the line being drawn is the first hidden row -->
  <rect class="txt-new" x="70" y="342" width="100" height="5" rx="2"/>

  <!-- Labels -->
  <path class="wire" d="M 212 136 V 332"/>
  <text class="k" x="222" y="226">16 rows on screen</text>
  <text class="small" x="222" y="244">the names move up a pixel</text>
  <text class="small" x="222" y="260">every fourth frame</text>
  <path class="wire2" d="M 252 345 H 210"/>
  <path class="head2" d="M 212 339 l -9 6 l 9 6 z"/>
  <text class="kn" x="260" y="341">drawn now, just</text>
  <text class="kn" x="260" y="357">below the screen</text>
  <text class="small" x="222" y="420">hidden below</text>
  <text class="small" x="222" y="84">scrolled off: free</text>
  <text class="small" x="222" y="100">to be drawn over</text>

  <!-- Wrap -->
  <path class="wire" d="M 40 462 H 24 V 58 H 34"/>
  <path class="head" d="M 31 52 v 12 l 9 -6 z"/>
  <text class="small" transform="translate(18 262) rotate(-90)" text-anchor="middle">the ring wraps</text>

  <text class="p" x="20" y="500">Each time the scroll moves on a line, the next</text>
  <text class="p" x="20" y="519">line of names is drawn just below the screen.</text>
  <text class="p" x="20" y="538">However long the list, the credits never need</text>
  <text class="p" x="20" y="557">more than 32 rows of tiles.</text>
</svg>
