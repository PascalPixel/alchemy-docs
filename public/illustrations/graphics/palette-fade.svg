<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 420" role="img" aria-labelledby="title desc">
  <title id="title">Every colour a step at a time</title>
  <desc id="desc">The title intro's fade-in, shown on three of its colours: the sky's blue, a cloud's pale lilac and the mountain's purple. At the start every colour is the same near-black, a very dark red. Each frame every colour moves an equal step towards its own colour in the picture, so after 20 frames each is a third of the way there, after 40 two thirds, and after 60 frames each has reached the picture's colour. All 512 background and sprite colours move this way together.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .sw { stroke: #d4d4d4; stroke-width: 1; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .h { fill: #0a0a0a; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .sw { stroke: #333333; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small { fill: #8f8f8f; }
      .code, .eyebrow { fill: #7c7c7c; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="419" rx="16"/>
  <text class="eyebrow" x="20" y="34">THE TITLE INTRO FADES IN</text>
  <text class="code" x="380" y="34" text-anchor="end">PaletteFade_Update</text>

  <!-- Column heads: swatches 56 wide at x 110, 180, 250, 320 -->
  <text class="small" x="138" y="66" text-anchor="middle">start</text>
  <text class="small" x="208" y="66" text-anchor="middle">20 frames</text>
  <text class="small" x="278" y="66" text-anchor="middle">40 frames</text>
  <text class="small" x="348" y="66" text-anchor="middle">60 frames</text>
  <path class="wire" d="M 110 80 H 372"/>
  <path class="head" d="M 370 75 l 9 5 l -9 5 z"/>

  <!-- Sky -->
  <text class="h" x="20" y="126">Sky</text>
  <rect class="sw" x="110" y="96" width="56" height="48" rx="8" fill="#100000"/>
  <rect class="sw" x="180" y="96" width="56" height="48" rx="8" fill="#233b53"/>
  <rect class="sw" x="250" y="96" width="56" height="48" rx="8" fill="#3575a5"/>
  <rect class="sw" x="320" y="96" width="56" height="48" rx="8" fill="#48b0f8"/>

  <!-- Cloud -->
  <text class="h" x="20" y="186">Cloud</text>
  <rect class="sw" x="110" y="156" width="56" height="48" rx="8" fill="#100000"/>
  <rect class="sw" x="180" y="156" width="56" height="48" rx="8" fill="#554553"/>
  <rect class="sw" x="250" y="156" width="56" height="48" rx="8" fill="#9b8ba5"/>
  <rect class="sw" x="320" y="156" width="56" height="48" rx="8" fill="#e0d0f8"/>

  <!-- Mountain -->
  <text class="h" x="20" y="246">Mountain</text>
  <rect class="sw" x="110" y="216" width="56" height="48" rx="8" fill="#100000"/>
  <rect class="sw" x="180" y="216" width="56" height="48" rx="8" fill="#2b1d33"/>
  <rect class="sw" x="250" y="216" width="56" height="48" rx="8" fill="#453b65"/>
  <rect class="sw" x="320" y="216" width="56" height="48" rx="8" fill="#605898"/>

  <text class="small" x="138" y="284" text-anchor="middle">near-black</text>
  <text class="small" x="348" y="284" text-anchor="middle">the picture's</text>

  <text class="p" x="20" y="330">Each colour moves an equal step every frame</text>
  <text class="p" x="20" y="349">towards its target, so all of them arrive</text>
  <text class="p" x="20" y="368">together. The fade moves all 512 background</text>
  <text class="p" x="20" y="387">and sprite colours at once.</text>
</svg>
