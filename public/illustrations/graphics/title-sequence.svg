<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">What plays at power-on</title>
  <desc id="desc">The title sequence at power-on. First the Nintendo logo with its jingle, then the Camelot logo for two seconds. If a save file exists, the title intro follows: the backgrounds scroll down while the sun rises, a white flash brings up the title picture, and Press Start pulses. Pressing A or Start goes on to the file select screen. If a minute passes with nothing pressed, the screen fades out and the sequence starts again from the Nintendo logo. With no save file, the logos lead straight to the file select screen.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .head { fill: #a3a3a3; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .head-accent { fill: #0a72ef; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .h { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .label { fill: #8f8f8f; }
      .k { fill: #66a6ff; }
      .code, .eyebrow { fill: #7c7c7c; }
      .wire { stroke: #5c5c5c; }
      .head { fill: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head-accent { fill: #3b8eff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="559" rx="16"/>
  <text class="eyebrow" x="60" y="34">POWER ON</text>
  <text class="code" x="380" y="34" text-anchor="end">Title_Run</text>

  <rect class="card" x="60" y="48" width="320" height="66" rx="12"/>
  <text class="h" x="80" y="74">The Nintendo logo</text>
  <text class="p" x="80" y="97">with its jingle</text>
  <text class="code" x="364" y="97" text-anchor="end">Title_ShowSplashScreen</text>

  <path class="wire" d="M 220 114 V 130"/>
  <path class="head" d="M 214 126 h 12 l -6 9 z"/>

  <rect class="card" x="60" y="138" width="320" height="66" rx="12"/>
  <text class="h" x="80" y="164">The Camelot logo</text>
  <text class="p" x="80" y="187">for two seconds</text>

  <path class="wire" d="M 220 204 V 230"/>
  <path class="head" d="M 214 226 h 12 l -6 9 z"/>
  <text class="label" x="232" y="222">if a save file exists</text>

  <rect class="card-accent" x="60" y="238" width="320" height="118" rx="12"/>
  <text class="h" x="80" y="264">The title intro</text>
  <text class="p" x="80" y="288">The sky scrolls down as the sun rises,</text>
  <text class="p" x="80" y="307">a white flash shows the title picture,</text>
  <text class="p" x="80" y="326">and Press Start pulses.</text>
  <text class="code" x="80" y="346">Title_ShowIntro</text>

  <!-- A minute with nothing pressed: back to the top -->
  <path class="wire-accent" d="M 60 330 H 30 V 81 H 54"/>
  <path class="head-accent" d="M 51 75 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 206) rotate(-90)" text-anchor="middle">a minute, nothing pressed</text>

  <path class="wire" d="M 220 356 V 382"/>
  <path class="head" d="M 214 378 h 12 l -6 9 z"/>
  <text class="label" x="232" y="374">A or Start</text>

  <rect class="card-exit" x="60" y="390" width="320" height="56" rx="12"/>
  <text class="h" x="80" y="423">The file select screen</text>

  <!-- No save -->
  <path class="wire" d="M 380 171 H 392 V 418 H 386"/>
  <path class="head" d="M 388 412 v 12 l -8 -6 z"/>

  <text class="p" x="20" y="486">With no save file, the logos lead straight to</text>
  <text class="p" x="20" y="505">the file select screen. After the prologue the</text>
  <text class="p" x="20" y="524">intro plays once more, without the prompt.</text>
</svg>
