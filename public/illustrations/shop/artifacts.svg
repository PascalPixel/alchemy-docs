<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">Rare items are counted, not stocked</title>
  <desc id="desc">Each rare item has one counter for the whole game. The first time a shop that lists it is opened, its counter goes up by one; buying one takes one off; selling or dropping one puts one back. A shop's Artifacts list is every item of its kind whose counter is above zero. The party reaches Vault before Bilibin. Vault's weapon shop lists one rare item, the Magic Rod, which its first visit counts, so its Artifacts list shows the Magic Rod. Bilibin's weapon shop lists one rare item, the Witch's Wand, which its first visit counts; its Artifacts list shows the Witch's Wand and, still counted from Vault unless the party bought it there, the Magic Rod.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .tile { fill: #f0f6ff; stroke: #bcd7fb; }
    .tile-new { fill: #effaf2; stroke: #86d19d; }
    .chip-ok { fill: #effaf2; stroke: #b5e3c2; }
    .chip-no { fill: #fdf0f0; stroke: #f2c0c0; }
    .seg-item { fill: #0a72ef; }
    .seg-rare { fill: #d97706; }
    .seg-kind { fill: #7c3aed; }
    .seg-empty { fill: #ffffff; stroke: #d4d4d4; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .name { fill: #0a0a0a; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kn { fill: #b91c1c; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ki { fill: #0a72ef; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kr { fill: #b45309; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kk { fill: #7c3aed; font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .tile { fill: #0d1a2e; stroke: #1e3a66; }
      .tile-new { fill: #0c2214; stroke: #1d4d2c; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .chip-no { fill: #2a0f0f; stroke: #5c2020; }
      .seg-item { fill: #3b8eff; }
      .seg-rare { fill: #f59e0b; }
      .seg-kind { fill: #a78bfa; }
      .seg-empty { fill: #111111; stroke: #333333; }
      .h2, .name { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #8f8f8f; }
      .ko { fill: #4ade80; }
      .kn { fill: #f87171; }
      .ki { fill: #66a6ff; }
      .kr { fill: #fbbf24; }
      .kk { fill: #c4b5fd; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="639" rx="16"/>
  <text class="eyebrow" x="20" y="32">ONE COUNTER FOR EACH RARE ITEM</text>

  <rect class="card-accent" x="20" y="44" width="360" height="138" rx="12"/>
  <rect class="chip-ok" x="36" y="58" width="44" height="28" rx="14"/>
  <text class="ko" x="58" y="77" text-anchor="middle">+1</text>
  <text class="p" x="92" y="71">a shop that lists it opens for the</text>
  <text class="p" x="92" y="88">first time</text>
  <rect class="chip-no" x="36" y="102" width="44" height="28" rx="14"/>
  <text class="kn" x="58" y="121" text-anchor="middle">−1</text>
  <text class="p" x="92" y="121">the party buys one</text>
  <rect class="chip-ok" x="36" y="140" width="44" height="28" rx="14"/>
  <text class="ko" x="58" y="159" text-anchor="middle">+1</text>
  <text class="p" x="92" y="159">the party sells or drops one</text>

  <text class="h2" x="20" y="214">A shop's Artifacts list:</text>
  <text class="p" x="20" y="234">every item of its kind counted above 0.</text>

  <!-- Vault first -->
  <text class="eyebrow" x="20" y="268">1 · VAULT'S WEAPON SHOP, FIRST VISIT</text>
  <rect class="card" x="20" y="278" width="360" height="112" rx="12"/>
  <rect class="tile-new" x="36" y="290" width="64" height="64" rx="10"/>
  <image href="data:image/png;base64," x="44" y="298" width="48" height="48" style="image-rendering: pixelated"/>
  <text class="name" x="68" y="374" text-anchor="middle">Magic Rod</text>
  <text class="small" x="116" y="318">Counted on this visit:</text>
  <text class="small" x="116" y="336">Vault's own rare item.</text>

  <!-- then Bilibin -->
  <text class="eyebrow" x="20" y="424">2 · BILIBIN'S WEAPON SHOP, LATER</text>
  <rect class="card" x="20" y="434" width="360" height="132" rx="12"/>
  <rect class="tile" x="36" y="446" width="64" height="64" rx="10"/>
  <image href="data:image/png;base64," x="44" y="454" width="48" height="48" style="image-rendering: pixelated"/>
  <text class="name" x="68" y="530" text-anchor="middle">Magic</text>
  <text class="name" x="68" y="546" text-anchor="middle">Rod</text>
  <rect class="tile-new" x="112" y="446" width="64" height="64" rx="10"/>
  <image href="data:image/png;base64," x="120" y="454" width="48" height="48" style="image-rendering: pixelated"/>
  <text class="name" x="144" y="530" text-anchor="middle">Witch's</text>
  <text class="name" x="144" y="546" text-anchor="middle">Wand</text>
  <text class="small" x="196" y="468">The Wand is counted</text>
  <text class="small" x="196" y="486">now; the Rod is still</text>
  <text class="small" x="196" y="504">counted from Vault,</text>
  <text class="small" x="196" y="522">unless it was bought</text>
  <text class="small" x="196" y="540">there.</text>

  <rect class="tile-new" x="20" y="580" width="14" height="14" rx="3"/>
  <text class="small" x="42" y="592">counted by this shop's first visit</text>
  <text class="code" x="380" y="628" text-anchor="end">Item_AdjustCounter</text>
</svg>
