<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">Rare items are counted, not stocked</title>
  <desc id="desc">Each rare item has one counter for the whole game. The first time a shop that lists it is opened, its counter goes up by one; buying one takes one off; selling or dropping one puts one back. A shop's Artifacts list is every item of its kind whose counter is above zero. On a new game, Bilibin's weapon shop lists the Witch's Wand alone, which its first visit has just counted. If Vault's weapon shop was opened first, the Magic Rod is already counted, and Bilibin's Artifacts list shows the Magic Rod as well.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .chip-ok { fill: #effaf2; stroke: #b5e3c2; }
    .chip-no { fill: #fdf0f0; stroke: #f2c0c0; }
    .frame { fill: none; stroke: #d4d4d4; }
    .h2 { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kn { fill: #b91c1c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .chip-no { fill: #2a0f0f; stroke: #5c2020; }
      .frame { stroke: #333333; }
      .h2 { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .ko { fill: #4ade80; }
      .kn { fill: #f87171; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="599" rx="16"/>
  <text class="eyebrow" x="20" y="32">ONE COUNTER PER RARE ITEM, FOR THE WHOLE GAME</text>

  <rect class="card-accent" x="20" y="44" width="360" height="138" rx="12"/>
  <rect class="chip-ok" x="36" y="58" width="44" height="28" rx="14"/>
  <text class="ko" x="58" y="77" text-anchor="middle">+1</text>
  <text class="p" x="92" y="71">a shop that lists it opens for the</text>
  <text class="p" x="92" y="88">first time</text>
  <rect class="chip-no" x="36" y="102" width="44" height="28" rx="14"/>
  <text class="kn" x="58" y="121" text-anchor="middle">−1</text>
  <text class="p" x="92" y="121">the party buys one</text>
  <rect class="chip-ok" x="36" y="140" width="44" height="28" rx="14"/>
  <text class="ko" x="58" y="159" text-anchor="middle">+1</text>
  <text class="p" x="92" y="159">the party sells or drops one</text>

  <text class="h2" x="20" y="216">A shop's Artifacts list:</text>
  <text class="p" x="20" y="236">every item of its kind counted above 0.</text>

  <!-- example 1 -->
  <text class="eyebrow" x="20" y="272">BILIBIN'S WEAPON SHOP, ON A NEW GAME</text>
  <image href="data:image/png;base64," x="20" y="282" width="360" height="46.5" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="282" width="360" height="46.5"/>
  <text class="small" x="20" y="350">Its first visit counts its own rare item: the Witch's Wand.</text>

  <!-- example 2 -->
  <text class="eyebrow" x="20" y="398">THE SAME SHOP, AFTER VAULT'S</text>
  <image href="data:image/png;base64," x="20" y="408" width="360" height="46.5" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="408" width="360" height="46.5"/>
  <text class="small" x="20" y="476">Vault's visit already counted the Magic Rod, so it is</text>
  <text class="small" x="20" y="492">here too, beside the Witch's Wand.</text>

  <text class="p" x="20" y="540">A rare item is sold by every shop of its kind,</text>
  <text class="p" x="20" y="559">and one the party gives up comes back on sale.</text>
  <text class="code" x="380" y="586" text-anchor="end">Item_AdjustCounter</text>
</svg>
