<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">What a night at an inn costs</title>
  <desc id="desc">Bilibin's innkeeper asks "It's 21 coins for a room. Would you like to stay?": Bilibin's inn charges 7 coins a guest, and three members are standing. A night costs the inn's price for each member still standing. A member who is down is neither charged for nor healed: after the night, every standing member has full HP and PP, and a downed one is still down. Prices run from 2 coins a guest in Vale to 25 in Lalivero.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .frame { fill: none; stroke: #d4d4d4; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .dot-ok { fill: #16a34a; }
    .dot-grey { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .frame { stroke: #333333; }
      .big { fill: #ededed; }
      .p { fill: #a1a1a1; }
      .small, .code, .eyebrow { fill: #7c7c7c; }
      .dot-grey { fill: #5c5c5c; }
      .dot-ok { fill: #22c55e; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="519" rx="16"/>
  <text class="eyebrow" x="20" y="28">BILIBIN'S INN</text>

  <image href="data:image/png;base64," x="20" y="40" width="360" height="240" style="image-rendering: pixelated" preserveAspectRatio="none"/>
  <rect class="frame" x="20" y="40" width="360" height="240"/>

  <!-- the sum -->
  <rect class="card-accent" x="20" y="296" width="360" height="74" rx="12"/>
  <text class="big" x="36" y="334">7 × 3 = 21</text>
  <text class="small" x="36" y="356">coins a guest, times the members standing</text>

  <!-- the rule -->
  <circle class="dot-ok" cx="26" cy="398" r="4"/>
  <text class="p" x="38" y="403">Standing: pays, and wakes with full HP and PP.</text>
  <circle class="dot-grey" cx="26" cy="426" r="4"/>
  <text class="p" x="38" y="431">Down: not charged, and still down.</text>
  <text class="small" x="20" y="466">Each town's inn has its own price, from 2 coins</text>
  <text class="small" x="20" y="482">a guest in Vale to 25 in Lalivero.</text>
  <text class="code" x="380" y="508" text-anchor="end">Inn_RoomPrice</text>
</svg>
