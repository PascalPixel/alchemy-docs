<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 578" role="img" aria-labelledby="title desc">
  <title id="title">After each target</title>
  <desc id="desc">Isaac, haunted by an evil spirit, casts Quake at Garet, Ivan and Mia, and Ivan is asleep; here every roll comes up. A sleeping target that loses HP wakes one time in four, unless it fell asleep this round. One time in four for each target, the evil spirit keeps a quarter of what that target lost, at least 1. Garet loses 14 HP and is awake; the spirit's total is 3 HP. Ivan loses 15 HP and wakes up; the total is 6 HP. Mia loses 12 HP; the total is 9 HP. At the end of Isaac's turn, a curse does 9 damage to Isaac, and his HP falls from 625 to 616.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
    .rock { fill: #b07a48; }
    .rock-soft { fill: #b07a48; fill-opacity: 0.25; }
    .tick { stroke: #0a0a0a; stroke-width: 2; }
    .ring { fill: none; stroke: #0a72ef; stroke-width: 2.5; }
    .ring-soft { fill: none; stroke: #0a72ef; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .downed { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .cross { stroke: #a3a3a3; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #d4d4d4; }
    .box-on { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .box-empty { fill: #fafafa; stroke: #d4d4d4; stroke-dasharray: 3 3; }
    .v { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .von { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .rock { fill: #c58f5c; }
      .rock-soft { fill: #c58f5c; fill-opacity: 0.25; }
      .tick { stroke: #ededed; }
      .ring { stroke: #3b8eff; }
      .ring-soft { stroke: #3b8eff; }
      .downed, .cross { stroke: #5c5c5c; }
      .box { fill: #111111; stroke: #333333; }
      .box-on { fill: #0d1a2e; stroke: #3b8eff; }
      .box-empty { fill: #0a0a0a; stroke: #333333; }
      .v { fill: #ededed; }
      .von { fill: #66a6ff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="577" rx="16"/>
  <text class="eyebrow" x="20" y="30">AFTER EACH TARGET</text>
  <text class="p" x="20" y="56">Isaac is haunted by an evil spirit and casts</text>
  <text class="p" x="20" y="75">Quake at Garet, Ivan and Mia. Ivan is asleep.</text>
  <text class="p" x="20" y="94">Here every roll comes up.</text>
  <rect class="chip" x="20" y="110" width="174" height="116" rx="10"/>
  <text class="k" x="34" y="134">Waking up</text>
  <text class="sub" x="34" y="156">A sleeper that loses HP</text>
  <text class="sub" x="34" y="174">wakes 1 time in 4, unless</text>
  <text class="sub" x="34" y="192">it fell asleep this round.</text>
  <rect class="chip-exit" x="206" y="110" width="174" height="116" rx="10"/>
  <text class="kx" x="220" y="134">The evil spirit</text>
  <text class="sub" x="220" y="156">1 time in 4 per target,</text>
  <text class="sub" x="220" y="174">it keeps a quarter of</text>
  <text class="sub" x="220" y="192">what that target lost,</text>
  <text class="sub" x="220" y="210">at least 1.</text>
  <text class="kw" x="36" y="254">Target</text>
  <text class="kw" x="124" y="254">loses</text>
  <text class="kw" x="204" y="254">wakes?</text>
  <text class="kw" x="364" y="254" text-anchor="end">spirit's total</text>
  <rect class="card" x="20" y="266" width="360" height="44" rx="10"/>
  <text class="h" x="36" y="293">Garet</text>
  <text class="p" x="124" y="293">14 HP</text>
  <text class="sub" x="204" y="293">awake</text>
  <text class="kx" x="364" y="293" text-anchor="end">3 HP</text>
  <rect class="card" x="20" y="318" width="360" height="44" rx="10"/>
  <text class="h" x="36" y="345">Ivan</text>
  <text class="p" x="124" y="345">15 HP</text>
  <text class="k" x="204" y="345">wakes up</text>
  <text class="kx" x="364" y="345" text-anchor="end">6 HP</text>
  <rect class="card" x="20" y="370" width="360" height="44" rx="10"/>
  <text class="h" x="36" y="397">Mia</text>
  <text class="p" x="124" y="397">12 HP</text>
  <text class="sub" x="204" y="397">awake</text>
  <text class="kx" x="364" y="397" text-anchor="end">9 HP</text>
  <text class="small" x="36" y="428">Each share is a quarter of the loss, rounded down: 3, 3 and 3.</text>
  <path class="wire" d="M 200 446 V 464"/>
  <path class="head" d="M 194 460 h 12 l -6 9 z"/>
  <rect class="card-accent" x="20" y="474" width="360" height="84" rx="12"/>
  <text class="h" x="36" y="500">At the end of Isaac's turn</text>
  <text class="p" x="36" y="524">A curse does 9 damage to Isaac!</text>
  <text class="sub" x="36" y="544">His HP falls from 625 to 616.</text>
</svg>
