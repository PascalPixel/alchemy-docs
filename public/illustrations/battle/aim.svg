<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 631" role="img" aria-labelledby="title desc">
  <title id="title">Who an ability reaches</title>
  <desc id="desc">Reach is counted in places along the enemies' line, not in distance on the screen. Quake reaches the aimed enemy and one place either side. Aimed in the middle of five enemies, it hits three. Aimed at the end of the line it hits only two, the aimed one and its one neighbour: the reach does not go round to the other end. A downed enemy beside the aim is passed over, but its place still counts, so the enemy beyond it is missed. While the player aims, the cursor steps along the line and wraps from the last place to the first.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
    .rock { fill: #b07a48; }
    .rock-soft { fill: #b07a48; fill-opacity: 0.25; }
    .tick { stroke: #0a0a0a; stroke-width: 2; }
    .ring { fill: none; stroke: #0a72ef; stroke-width: 2.5; }
    .ring-soft { fill: none; stroke: #0a72ef; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .downed { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .cross { stroke: #a3a3a3; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #d4d4d4; }
    .box-on { fill: #f0f6ff; stroke: #0a72ef; stroke-width: 1.5; }
    .box-empty { fill: #fafafa; stroke: #d4d4d4; stroke-dasharray: 3 3; }
    .v { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .von { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .rock { fill: #c58f5c; }
      .rock-soft { fill: #c58f5c; fill-opacity: 0.25; }
      .tick { stroke: #ededed; }
      .ring { stroke: #3b8eff; }
      .ring-soft { stroke: #3b8eff; }
      .downed, .cross { stroke: #5c5c5c; }
      .box { fill: #111111; stroke: #333333; }
      .box-on { fill: #0d1a2e; stroke: #3b8eff; }
      .box-empty { fill: #0a0a0a; stroke: #333333; }
      .v { fill: #ededed; }
      .von { fill: #66a6ff; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="630" rx="16"/>
  <text class="eyebrow" x="20" y="30">WHO AN ABILITY REACHES</text>
  <text class="p" x="20" y="56">Reach is counted in places along the enemies'</text>
  <text class="p" x="20" y="75">line, not in distance on the screen. Quake</text>
  <text class="p" x="20" y="94">reaches the aimed enemy and one place either side.</text>
  <rect class="card" x="20" y="112" width="360" height="119" rx="12"/>
  <text class="h" x="36" y="138">Aimed in the middle</text>
  <circle class="foe-soft" cx="72" cy="170" r="12"/>
  <circle class="unit" cx="136" cy="170" r="12"/>
  <circle class="unit" cx="200" cy="170" r="12"/>
  <circle class="ring" cx="200" cy="170" r="19"/>
  <circle class="unit" cx="264" cy="170" r="12"/>
  <circle class="foe-soft" cx="328" cy="170" r="12"/>
  <text class="p" x="36" y="214">Three enemies are hit.</text>
  <rect class="card" x="20" y="243" width="360" height="138" rx="12"/>
  <text class="h" x="36" y="269">Aimed at the end of the line</text>
  <circle class="foe-soft" cx="72" cy="301" r="12"/>
  <circle class="foe-soft" cx="136" cy="301" r="12"/>
  <circle class="foe-soft" cx="200" cy="301" r="12"/>
  <circle class="unit" cx="264" cy="301" r="12"/>
  <circle class="unit" cx="328" cy="301" r="12"/>
  <circle class="ring" cx="328" cy="301" r="19"/>
  <text class="p" x="36" y="345">Two are hit: the reach does not go</text>
  <text class="p" x="36" y="364">round to the other end.</text>
  <rect class="card" x="20" y="393" width="360" height="138" rx="12"/>
  <text class="h" x="36" y="419">A downed enemy beside the aim</text>
  <circle class="foe-soft" cx="72" cy="451" r="12"/>
  <circle class="downed" cx="136" cy="451" r="12"/>
  <path class="cross" d="M 130 445 L 142 457 M 142 445 L 130 457"/>
  <circle class="unit" cx="200" cy="451" r="12"/>
  <circle class="ring" cx="200" cy="451" r="19"/>
  <circle class="unit" cx="264" cy="451" r="12"/>
  <circle class="foe-soft" cx="328" cy="451" r="12"/>
  <text class="p" x="36" y="495">It is passed over, but its place still</text>
  <text class="p" x="36" y="514">counts, so the enemy beyond it is missed.</text>
  <circle class="unit" cx="32" cy="553" r="7"/><circle class="ring" cx="32" cy="553" r="11"/>
  <text class="p" x="50" y="557">aimed</text>
  <circle class="unit" cx="116" cy="553" r="7"/>
  <text class="p" x="130" y="557">hit</text>
  <circle class="foe-soft" cx="182" cy="553" r="7"/>
  <text class="p" x="196" y="557">missed</text>
  <circle class="downed" cx="272" cy="553" r="7"/>
  <text class="p" x="286" y="557">downed</text>
  <text class="p" x="20" y="589">While the player aims, the cursor steps along</text>
  <text class="p" x="20" y="608">the line and wraps from the last to the first.</text>
</svg>
