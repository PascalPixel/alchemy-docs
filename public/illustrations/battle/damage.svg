<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 546" role="img" aria-labelledby="title desc">
  <title id="title">How Psynergy damage is worked out</title>
  <desc id="desc">Isaac casts Avalanche at three enemies in a row, aiming at the first. Avalanche's power is 160, the damage at an even match. Isaac's Venus Power is 20 points ahead of each target's Venus Resist, which multiplies it by about 1.1, to 175. The distance from the aimed enemy then keeps 100 percent for the aimed one, 80 percent one place away and 60 percent two places away: 175, 140 and 105. Last, 0 to 3 is added at random, so the three take 175 to 178, 140 to 143 and 105 to 108. A defending target takes half of that, and one behind Total Defense a tenth.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="545" rx="16"/>
  <text class="eyebrow" x="20" y="30">ISAAC CASTS AVALANCHE</text>

  <!-- the three targets -->
  <circle class="unit" cx="216" cy="62" r="13"/>
  <circle class="foe" cx="286" cy="62" r="11"/>
  <circle class="foe-soft" cx="356" cy="62" r="9"/>
  <text class="k" x="216" y="96" text-anchor="middle">aimed</text>
  <text class="small" x="286" y="96" text-anchor="middle">next to it</text>
  <text class="small" x="356" y="96" text-anchor="middle">two away</text>

  <!-- step 1: power -->
  <path class="rule" d="M 20 112 H 380"/>
  <text class="h" x="20" y="138">Its power</text>
  <text class="sub" x="20" y="156">the damage at an even match</text>
  <text class="kw" x="216" y="146" text-anchor="middle">160</text>
  <text class="kw" x="286" y="146" text-anchor="middle">160</text>
  <text class="kw" x="356" y="146" text-anchor="middle">160</text>

  <!-- step 2: element -->
  <path class="rule" d="M 20 172 H 380"/>
  <text class="h" x="20" y="198">× the element</text>
  <text class="sub" x="20" y="216">Power 20 ahead of Resist:</text>
  <text class="sub" x="20" y="233">about × 1.1</text>
  <text class="kw" x="216" y="212" text-anchor="middle">175</text>
  <text class="kw" x="286" y="212" text-anchor="middle">175</text>
  <text class="kw" x="356" y="212" text-anchor="middle">175</text>

  <!-- step 3: distance -->
  <path class="rule" d="M 20 250 H 380"/>
  <text class="h" x="20" y="276">× the distance</text>
  <text class="sub" x="20" y="294">a share for each place</text>
  <text class="sub" x="20" y="311">away from the aimed one</text>
  <rect class="bar" x="196" y="262" width="40" height="8" rx="2"/>
  <rect class="bar" x="266" y="262" width="32" height="8" rx="2"/>
  <rect class="bar" x="336" y="262" width="24" height="8" rx="2"/>
  <text class="small" x="216" y="288" text-anchor="middle">100%</text>
  <text class="small" x="286" y="288" text-anchor="middle">80%</text>
  <text class="small" x="356" y="288" text-anchor="middle">60%</text>
  <text class="kw" x="216" y="310" text-anchor="middle">175</text>
  <text class="kw" x="286" y="310" text-anchor="middle">140</text>
  <text class="kw" x="356" y="310" text-anchor="middle">105</text>

  <!-- step 4: random -->
  <path class="rule" d="M 20 328 H 380"/>
  <text class="h" x="20" y="354">+ a little luck</text>
  <text class="sub" x="20" y="372">0 to 3 more at random</text>

  <!-- result -->
  <rect class="chip" x="184" y="338" width="64" height="44" rx="10"/>
  <rect class="chip" x="254" y="338" width="64" height="44" rx="10"/>
  <rect class="chip" x="324" y="338" width="64" height="44" rx="10"/>
  <text class="kb" x="216" y="358" text-anchor="middle">175</text>
  <text class="small" x="216" y="374" text-anchor="middle">to 178</text>
  <text class="kb" x="286" y="358" text-anchor="middle">140</text>
  <text class="small" x="286" y="374" text-anchor="middle">to 143</text>
  <text class="kb" x="356" y="358" text-anchor="middle">105</text>
  <text class="small" x="356" y="374" text-anchor="middle">to 108</text>

  <!-- the guard -->
  <path class="rule" d="M 20 398 H 380"/>
  <text class="h" x="20" y="424">If the target defends</text>
  <text class="p" x="20" y="448">A target that defends takes half;</text>
  <text class="p" x="20" y="467">behind Total Defense, a tenth.</text>

  <!-- the rule -->
  <rect class="card-exit" x="20" y="486" width="360" height="40" rx="12"/>
  <text class="p" x="36" y="511">Every step rounds down.</text>
</svg>
