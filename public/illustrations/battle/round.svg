<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">A battle, round by round</title>
  <desc id="desc">A battle is a loop of rounds. At the start of each round everyone chooses an action: the party in the command menu, each enemy from its own list. The actions are lined up fastest first, by Agility. Then each action plays in turn: it is announced, its animation plays, and while it plays each target takes its damage and the messages show, and the unit's turn ends. After every action the game checks whether one side has nobody left standing; if so, or if the party ran away, the battle ends, with coins, experience and items if the party won. When everyone has acted, the round ends, statuses count down, and the next round begins.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="639" rx="16"/>
  <text class="eyebrow" x="60" y="34">ONE BATTLE</text>

  <!-- Choose -->
  <rect class="card-accent" x="60" y="48" width="320" height="96" rx="12"/>
  <circle class="dot" cx="83" cy="74" r="5"/>
  <text class="big" x="96" y="80">Everyone chooses</text>
  <text class="p" x="80" y="105">The party picks in the command menu,</text>
  <text class="p" x="80" y="124">each enemy from its own list.</text>

  <path class="wire" d="M 220 144 V 166"/>
  <path class="head" d="M 214 162 h 12 l -6 9 z"/>

  <!-- Sort -->
  <rect class="card" x="60" y="174" width="320" height="78" rx="12"/>
  <text class="big" x="80" y="202">Fastest first</text>
  <text class="p" x="80" y="226">The actions line up by Agility.</text>

  <path class="wire" d="M 220 252 V 274"/>
  <path class="head" d="M 214 270 h 12 l -6 9 z"/>

  <!-- Each action -->
  <rect class="card" x="60" y="282" width="320" height="210" rx="12"/>
  <text class="big" x="80" y="310">Each action in turn</text>
  <rect class="chip" x="88" y="324" width="272" height="30" rx="8"/>
  <text class="k" x="102" y="344">Announce it</text>
  <rect class="chip" x="88" y="362" width="272" height="30" rx="8"/>
  <text class="k" x="102" y="382">Play its animation</text>
  <rect class="chip" x="88" y="400" width="272" height="30" rx="8"/>
  <text class="k" x="102" y="420">Hit each target</text>
  <rect class="chip" x="88" y="438" width="272" height="30" rx="8"/>
  <text class="k" x="102" y="458">Its turn ends</text>
  <!-- next action -->
  <path class="wire-accent" d="M 88 453 H 74 V 339 H 82"/>
  <path class="head-accent" d="M 80 333 v 12 l 8 -6 z"/>
  <text class="small" x="220" y="484" text-anchor="middle">then the next action</text>

  <!-- Next round -->
  <path class="wire-accent" d="M 60 400 H 30 V 96 H 54"/>
  <path class="head-accent" d="M 51 90 v 12 l 9 -6 z"/>
  <text class="k" transform="translate(22 248) rotate(-90)" text-anchor="middle">everyone has acted: the next round</text>

  <!-- End -->
  <path class="wire" d="M 220 492 V 548"/>
  <path class="head" d="M 214 544 h 12 l -6 9 z"/>
  <text class="label" x="232" y="514">after any action: one side</text>
  <text class="label" x="232" y="532">is down, or the party ran</text>
  <rect class="card-exit" x="60" y="556" width="320" height="66" rx="12"/>
  <text class="big" x="80" y="584">The battle ends</text>
  <text class="p" x="80" y="606">A win brings coins, experience, items.</text>
</svg>
