<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 420" role="img" aria-labelledby="title desc">
  <title id="title">How long a status lasts</title>
  <desc id="desc">Seven round ends after a status or a stat change lands. A status such as Delude or Sleep, or a lowered stat, lasts 7 turns, counted down at the end of each round. After the first round end it is certain to last; once 5 turns or fewer are left, each round end rolls whether it ends early, more often for a lucky unit and as the turns run down. At the seventh it ends anyway. A raised stat never ends early: it always lasts all its turns.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="419" rx="16"/>
  <text class="eyebrow" x="20" y="30">THE END OF EACH ROUND, AFTER IT LANDS</text>

  <!-- 7 cells, 48 units apart from x 32 -->
  <text class="small" x="44" y="58" text-anchor="middle">1st</text>
  <text class="small" x="92" y="58" text-anchor="middle">2nd</text>
  <text class="small" x="140" y="58" text-anchor="middle">3rd</text>
  <text class="small" x="188" y="58" text-anchor="middle">4th</text>
  <text class="small" x="236" y="58" text-anchor="middle">5th</text>
  <text class="small" x="284" y="58" text-anchor="middle">6th</text>
  <text class="small" x="332" y="58" text-anchor="middle">7th</text>

  <!-- status or lowered stat -->
  <text class="h" x="20" y="92">A status, or a lowered stat</text>
  <rect class="bar" x="22" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-soft" x="70" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-soft" x="118" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-soft" x="166" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-soft" x="214" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-soft" x="262" y="104" width="44" height="30" rx="6"/>
  <rect class="bar-exit" x="310" y="104" width="44" height="30" rx="6"/>
  <text class="small" x="44" y="152" text-anchor="middle">6 left</text>
  <text class="small" x="92" y="152" text-anchor="middle">5</text>
  <text class="small" x="140" y="152" text-anchor="middle">4</text>
  <text class="small" x="188" y="152" text-anchor="middle">3</text>
  <text class="small" x="236" y="152" text-anchor="middle">2</text>
  <text class="small" x="284" y="152" text-anchor="middle">1</text>
  <text class="kx" x="332" y="152" text-anchor="middle">ends</text>
  <path class="axis" d="M 70 168 V 174 H 306 V 168"/>
  <text class="k" x="188" y="192" text-anchor="middle">may end early at each of these</text>
  <text class="sub" x="188" y="210" text-anchor="middle">more often for a lucky unit, and as turns run out</text>

  <!-- raised stat -->
  <text class="h" x="20" y="256">A raised stat</text>
  <rect class="bar" x="22" y="268" width="44" height="30" rx="6"/>
  <rect class="bar" x="70" y="268" width="44" height="30" rx="6"/>
  <rect class="bar" x="118" y="268" width="44" height="30" rx="6"/>
  <rect class="bar" x="166" y="268" width="44" height="30" rx="6"/>
  <rect class="bar" x="214" y="268" width="44" height="30" rx="6"/>
  <rect class="bar" x="262" y="268" width="44" height="30" rx="6"/>
  <rect class="bar-exit" x="310" y="268" width="44" height="30" rx="6"/>
  <text class="sub" x="20" y="320">always lasts all 7 turns</text>

  <rect class="card-exit" x="20" y="340" width="360" height="62" rx="12"/>
  <text class="p" x="36" y="364">One stage moves Attack or Defense by</text>
  <text class="p" x="36" y="383">an eighth; four stages at most.</text>
</svg>
