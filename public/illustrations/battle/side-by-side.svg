<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 588" role="img" aria-labelledby="title desc">
  <title id="title">The animation and the damage, side by side</title>
  <desc id="desc">One action, with time running down the page. On the left the animation runs in its own loop, frame after frame. On the right the damage task waits. When the blow lands the animation says so, and from then on both run at once: the animation keeps drawing while the task works out the first target's damage and shows its messages, then the next target's, then the last. The battle moves on only when both are done. The animation decides when the damage appears; the rules alone decide how much it is.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="587" rx="16"/>
  <text class="eyebrow" x="20" y="30">ONE ACTION, TIME RUNNING DOWN</text>

  <!-- column heads -->
  <text class="h" x="20" y="60">The animation</text>
  <text class="small" x="20" y="77">the effect's own loop</text>
  <text class="h" x="212" y="60">The damage</text>
  <text class="small" x="212" y="77">a task, once a frame</text>

  <!-- left lane -->
  <rect class="chip" x="20" y="92" width="168" height="66" rx="10"/>
  <text class="k" x="34" y="118">Quake: rock rises</text>
  <text class="sub" x="34" y="140">frame after frame</text>

  <rect class="card-accent" x="20" y="172" width="168" height="66" rx="10"/>
  <circle class="dot" cx="38" cy="194" r="5"/>
  <text class="h" x="50" y="199">The blow lands</text>
  <text class="sub" x="34" y="222">and says so</text>

  <rect class="chip" x="20" y="252" width="168" height="220" rx="10"/>
  <text class="k" x="34" y="278">Keeps drawing</text>
  <text class="sub" x="34" y="300">to its last frame,</text>
  <text class="sub" x="34" y="318">without waiting for</text>
  <text class="sub" x="34" y="336">the damage</text>
  <path class="wire-accent" d="M 104 348 V 440"/>
  <path class="head-accent" d="M 98 436 h 12 l -6 9 z"/>

  <!-- right lane -->
  <rect class="chip-wait" x="212" y="92" width="168" height="66" rx="10"/>
  <text class="kw" x="226" y="118">Waits</text>
  <text class="sub" x="226" y="140">nothing to show yet</text>

  <!-- the signal -->
  <path class="wire-accent" d="M 188 205 H 204"/>
  <path class="head-accent" d="M 202 199 v 12 l 9 -6 z"/>

  <rect class="card" x="212" y="172" width="168" height="90" rx="10"/>
  <text class="h" x="226" y="198">First target</text>
  <text class="sub" x="226" y="220">its damage worked out,</text>
  <text class="sub" x="226" y="238">its messages shown</text>

  <path class="wire" d="M 296 262 V 276"/>
  <path class="head" d="M 290 272 h 12 l -6 9 z"/>
  <rect class="card" x="212" y="284" width="168" height="72" rx="10"/>
  <text class="h" x="226" y="310">Next target</text>
  <text class="sub" x="226" y="332">the same again</text>

  <path class="wire" d="M 296 356 V 370"/>
  <path class="head" d="M 290 366 h 12 l -6 9 z"/>
  <rect class="card" x="212" y="378" width="168" height="72" rx="10"/>
  <text class="h" x="226" y="404">Last target</text>
  <text class="sub" x="226" y="426">then nothing left</text>

  <!-- both done -->
  <path class="wire" d="M 104 472 V 494 M 296 450 V 494"/>
  <path class="head" d="M 98 490 h 12 l -6 9 z M 290 490 h 12 l -6 9 z"/>
  <rect class="card-exit" x="20" y="502" width="360" height="40" rx="12"/>
  <text class="h" x="36" y="528">The battle moves on when both are done</text>

  <text class="small" x="20" y="568">The animation picks when; the rules alone decide how much.</text>
</svg>
