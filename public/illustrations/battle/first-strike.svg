<svg xmlns="http://www.w3.org/2000/svg" width="480" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">Who gets the jump</title>
  <desc id="desc">A random battle opens with two rolls. One time in 16 the party strikes first: no enemy acts in the first round, and running away cannot fail. Otherwise, one time in 32 the party is caught by surprise: it chooses no commands, and two to five enemies act, once each. Otherwise the first round is a normal one. A bar shows the shares: about 6 percent, about 3 percent, and the remaining 91 percent. Running away succeeds half the time, plus 20 percent for each failed try and 5 percent for each level the party's average is above the enemies'; a failed try gives the rest of the round to the enemies.</desc>
  <style>
    .panel { fill: #fafafa; stroke: #e5e5e5; }
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .card-accent { fill: #ffffff; stroke: #0a72ef; stroke-width: 1.5; }
    .card-exit { fill: #fafafa; stroke: #a3a3a3; stroke-dasharray: 4 4; }
    .chip { fill: #f0f6ff; stroke: #bcd7fb; }
    .chip-exit { fill: #fff3f0; stroke: #f6c3b7; }
    .chip-wait { fill: #f5f5f5; stroke: #d4d4d4; }
    .chip-ok { fill: #effaf2; stroke: #b4e3c2; }
    .h { fill: #0a0a0a; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .big { fill: #0a0a0a; font: 600 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .p { fill: #525252; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #8f8f8f; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .small { fill: #8f8f8f; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .k { fill: #0a72ef; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kb { fill: #0a72ef; font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kx { fill: #c2410c; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kw { fill: #525252; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ko { fill: #15803d; font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .code { fill: #8f8f8f; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #8f8f8f; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.08em; }
    .label { fill: #737373; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wire { fill: none; stroke: #a3a3a3; stroke-width: 1.5; }
    .wire-accent { fill: none; stroke: #0a72ef; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #a3a3a3; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: #a3a3a3; }
    .head-accent { fill: #0a72ef; }
    .dot { fill: #0a72ef; }
    .bar { fill: #0a72ef; }
    .bar-soft { fill: #0a72ef; fill-opacity: 0.35; }
    .bar-muted { fill: #d4d4d4; }
    .bar-exit { fill: #ea580c; }
    .bar-ok { fill: #16a34a; }
    .rule { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .axis { stroke: #a3a3a3; stroke-width: 1; fill: none; }
    .line-accent { fill: none; stroke: #0a72ef; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .line-ok { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .unit { fill: #0a72ef; }
    .foe { fill: #737373; }
    .foe-soft { fill: #d4d4d4; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0a0a0a; stroke: #262626; }
      .card { fill: #111111; stroke: #2e2e2e; }
      .card-accent { fill: #111111; stroke: #3b8eff; }
      .card-exit { fill: #0a0a0a; stroke: #525252; }
      .chip { fill: #0d1a2e; stroke: #1e3a66; }
      .chip-exit { fill: #2a130c; stroke: #5c2a1a; }
      .chip-wait { fill: #1a1a1a; stroke: #333333; }
      .chip-ok { fill: #0c2214; stroke: #1d4d2c; }
      .h, .big { fill: #ededed; }
      .p, .kw { fill: #a1a1a1; }
      .sub, .small, .code, .eyebrow { fill: #7c7c7c; }
      .label { fill: #8f8f8f; }
      .k, .kb { fill: #66a6ff; }
      .kx { fill: #fb8b5e; }
      .ko { fill: #4ade80; }
      .wire, .wire-dash { stroke: #5c5c5c; }
      .wire-accent { stroke: #3b8eff; }
      .head { fill: #5c5c5c; }
      .head-accent, .dot, .bar, .unit { fill: #3b8eff; }
      .bar-soft { fill: #3b8eff; fill-opacity: 0.35; }
      .bar-muted, .foe-soft { fill: #333333; }
      .bar-exit { fill: #fb8b5e; }
      .bar-ok { fill: #22c55e; }
      .rule { stroke: #262626; }
      .axis { stroke: #5c5c5c; }
      .line-accent { stroke: #3b8eff; }
      .line-ok { stroke: #22c55e; }
      .foe { fill: #8f8f8f; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="399" height="599" rx="16"/>
  <text class="eyebrow" x="20" y="30">A RANDOM BATTLE OPENS</text>

  <!-- the shares, 360 units for all -->
  <rect class="bar-ok" x="20" y="46" width="22.5" height="22" rx="3"/>
  <rect class="bar-exit" x="44" y="46" width="10.5" height="22" rx="3"/>
  <rect class="bar-muted" x="56" y="46" width="324" height="22" rx="3"/>
  <text class="small" x="20" y="88">6%</text>
  <text class="small" x="50" y="88">3%</text>
  <text class="small" x="380" y="88" text-anchor="end">91% of battles: a normal start</text>

  <!-- party first -->
  <rect class="chip-ok" x="20" y="104" width="360" height="96" rx="12"/>
  <text class="ko" x="36" y="128">1 IN 16</text>
  <text class="h" x="36" y="150">The party strikes first</text>
  <text class="p" x="36" y="172">No enemy acts in the first round,</text>
  <text class="p" x="36" y="190">and running away cannot fail.</text>

  <!-- enemies first -->
  <rect class="chip-exit" x="20" y="212" width="360" height="96" rx="12"/>
  <text class="kx" x="36" y="236">ELSE 1 IN 32</text>
  <text class="h" x="36" y="258">Caught by surprise</text>
  <text class="p" x="36" y="280">The party chooses nothing, and two</text>
  <text class="p" x="36" y="298">to five enemies act, once each.</text>

  <!-- normal -->
  <rect class="card" x="20" y="320" width="360" height="64" rx="12"/>
  <text class="h" x="36" y="346">Otherwise a normal round</text>
  <text class="p" x="36" y="368">Everyone chooses, fastest acts first.</text>

  <text class="small" x="20" y="404">Only random encounters roll; the Djinn lesson</text>
  <text class="small" x="20" y="420">always gives the party the first strike.</text>

  <!-- running away -->
  <rect class="card-exit" x="20" y="436" width="360" height="146" rx="12"/>
  <text class="h" x="36" y="462">Running away</text>
  <text class="p" x="36" y="486">50% to get away,</text>
  <text class="p" x="36" y="505">+20% for each try that failed,</text>
  <text class="p" x="36" y="524">+5% a level the party is ahead.</text>
  <text class="p" x="36" y="550">A failed try: the enemies take the</text>
  <text class="p" x="36" y="569">rest of the round, as in a surprise.</text>
</svg>
