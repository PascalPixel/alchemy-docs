name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alchemy_commit:
        description: Exact Alchemy source revision
        required: true
        type: string
      alchemy_run:
        description: Successful Alchemy CI run
        required: true
        type: string
      docs_commit:
        description: Generator revision pinned by Alchemy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      docs: ${{ steps.source.outputs.docs }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Resolve a successful Alchemy build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ inputs.alchemy_commit }}
          SOURCE_RUN: ${{ inputs.alchemy_run }}
          DOCS_SHA: ${{ inputs.docs_commit }}
        run: |
          if test "$EVENT" = workflow_dispatch; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$DOCS_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/PascalPixel/alchemy/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/run.json"
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .path == ".github/workflows/build.yml" and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == "PascalPixel/alchemy"' "$RUNNER_TEMP/run.json"
            latest=$(gh api repos/PascalPixel/alchemy/commits/main --jq .sha)
            test "$latest" = "$SOURCE_SHA" || { echo 'A newer Alchemy revision supersedes this deployment.' >&2; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            SOURCE_SHA=$(gh api 'repos/PascalPixel/alchemy/actions/workflows/build.yml/runs?branch=main&status=success&event=push&per_page=1' --jq '.workflow_runs[0].head_sha')
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            DOCS_SHA="$GITHUB_SHA"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.source.outputs.docs }}
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: PascalPixel/alchemy
          ref: ${{ needs.source.outputs.sha }}
          path: alchemy
          persist-credentials: false

      - name: Verify the generator pin before publishing
        if: needs.source.outputs.publish == 'true'
        env:
          DOCS_SHA: ${{ needs.source.outputs.docs }}
        run: test "$(cat alchemy/.github/docs.ref)" = "$DOCS_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install the pinned Doxygen release
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/doxygen.tar.gz" https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"

      - run: npm ci --prefix fonts
      - run: make ALCHEMY="$GITHUB_WORKSPACE/alchemy"

      - name: Add the verified figures from Alchemy's durable archive
        if: needs.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          DOCS_SHA: ${{ needs.source.outputs.docs }}
        run: |
          name="${SOURCE_SHA}.site.tar.gz"
          gh release download decomp-reports --repo PascalPixel/alchemy --dir "$RUNNER_TEMP/publication" --pattern "$name"
          actual=$(gh api repos/PascalPixel/alchemy/releases/tags/decomp-reports --jq ".assets[] | select(.name == \"$name\") | .digest")
          expected="sha256:$(sha256sum "$RUNNER_TEMP/publication/$name" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          printf '%s\n' PROGRESS.png PROGRESS_CHART.png history.tsv source.tsv > "$RUNNER_TEMP/expected-files"
          tar -tzf "$RUNNER_TEMP/publication/$name" > "$RUNNER_TEMP/archive-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/archive-files"
          tar -xzf "$RUNNER_TEMP/publication/$name" -C out/site
          test "$(awk 'NR == 2 { print $1 }' out/site/source.tsv)" = "$SOURCE_SHA"
          printf 'repository\tcommit\nalchemy\t%s\nalchemy-docs\t%s\n' "$SOURCE_SHA" "$DOCS_SHA" > out/site/versions.tsv

      - name: Check the deployable output
        run: |
          test -s out/site/index.html
          test -s out/site/tla/index.html
          test -s out/site/weyard-sans.otf
          test -s out/site/weyard-emoji-LICENSE
          test "$(du -sk out/site | cut -f1)" -lt 1000000
          if find out/site -type l -o -name '*.gba' -o -name '*.elf' -o -name '*.map' | grep .; then exit 1; fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: needs.source.outputs.publish == 'true'
        with:
          path: out/site

  deploy:
    if: needs.source.outputs.publish == 'true'
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a source revision superseded while the site built
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(gh api repos/PascalPixel/alchemy/commits/main --jq .sha)" = "$SOURCE_SHA"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
