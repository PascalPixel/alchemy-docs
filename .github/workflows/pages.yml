# Builds the site from the latest Alchemy and publishes it to GitHub Pages.
# The site, fonts included, goes straight to Pages as an artifact; nothing
# built is committed.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PascalPixel/alchemy
          path: alchemy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Doxygen 1.18
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar xz
          echo "$PWD/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix fonts
      - run: make ALCHEMY="$GITHUB_WORKSPACE/alchemy"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
