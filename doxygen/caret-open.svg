<svg xmlns="http://www.w3.org/2000/svg" width="8" height="5" shape-rendering="crispEdges">
<!-- The tree's open caret: a 7x4 white triangle pointing down, with the
     images' half-black shadow one pixel down and right. -->
<g fill="#000" fill-opacity="0.5">
<rect x="1" y="1" width="7" height="1"/>
<rect x="2" y="2" width="5" height="1"/>
<rect x="3" y="3" width="3" height="1"/>
<rect x="4" y="4" width="1" height="1"/>
</g>
<g fill="#fff">
<rect x="0" y="0" width="7" height="1"/>
<rect x="1" y="1" width="5" height="1"/>
<rect x="2" y="2" width="3" height="1"/>
<rect x="3" y="3" width="1" height="1"/>
</g>
</svg>
