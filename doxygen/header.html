<!-- The look applies before the first paint, from two stored choices: the
     theme (Weyard or Modern) and light or dark (Auto follows the system).
     The pair is the root's data-theme, which alchemy.css reads. -->
<script>
var AlchemyLook = (function () {
  var dark = matchMedia("(prefers-color-scheme: dark)");
  function get(k, ok, d) {
    var v;
    try { v = localStorage.getItem(k); } catch (e) {}
    return ok.test(v || "") ? v : d;
  }
  var look = {
    theme: get("alchemy-theme", /^(weyard|modern)$/, "weyard"),
    mode: get("alchemy-mode", /^(auto|light|dark)$/, "auto"),
    apply: function () {
      var night = look.mode == "dark" || (look.mode == "auto" && dark.matches);
      document.documentElement.setAttribute("data-theme", look.theme + (night ? "-night" : "-day"));
    },
    set: function (k, v) {
      look[k] = v;
      try { localStorage.setItem("alchemy-" + k, v); } catch (e) {}
      look.apply();
    }
  };
  dark.addEventListener("change", look.apply);
  look.apply();
  return look;
})();
</script>
